  /* ------------------------------------------------- Тестовый доступ --- */

  function openTestPassword(options) {
    const body = '<div class="field">' +
      '<label class="field__label" for="testPassword">пароль тестировщика</label>' +
      '<input class="input" id="testPassword" type="password" maxlength="8" autocomplete="off" ' +
        'inputmode="numeric" data-autofocus placeholder="••••" />' +
      '<span class="field__hint">Откроется отдельное окно с чистым профилем. Твой прогресс не изменится.</span>' +
      '<div class="field__error" data-test-error></div>' +
      '</div>';
    return openModal({
      title: 'Пароль тестировщика',
      body: body,
      buttons: [
        { id: 'cancel', label: 'Отмена' },
        { id: 'enter', label: 'Войти', primary: true }
      ],
      onMount: function (modal) {
        const input = modal.card.querySelector('#testPassword');
        const error = modal.card.querySelector('[data-test-error]');
        input.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') { event.preventDefault(); const btn = modal.card.querySelector('[data-modal-btn="enter"]'); if (btn) btn.click(); }
        });
        input.addEventListener('input', function () { error.textContent = ''; });
      },
      onButton: function (id, modal) {
        if (id !== 'enter') return false;
        const input = modal.card.querySelector('#testPassword');
        const error = modal.card.querySelector('[data-test-error]');
        const value = input.value;
        if (options.validate && !options.validate(value)) {
          error.textContent = 'Неверный пароль';
          input.value = '';
          input.focus();
          return true;
        }
        if (options.onSubmit) options.onSubmit(value);
        return false;
      }
    });
  }

  /* --------------------------------------------------- Иконка профиля --- */

  function profileIconCaption(icon) {
    if (!icon) return 'Без иконки — в кружке останется первая буква имени.';
    if (icon.type === 'custom') return 'Своя картинка (уменьшена до 128 px).';
    const entry = ProfileIcons.get(icon.value);
    return 'Иконка: ' + entry.label + '.';
  }

  function profileIconsHTML(icon) {
    const grid = ProfileIcons.LIST.map(function (item) {
      const selected = icon && icon.type === 'preset' && icon.value === item.id;
      return '<button class="profile-icon' + (selected ? ' is-selected' : '') + '" type="button" ' +
        'data-profile-icon="' + esc(item.id) + '" title="' + esc(item.label) + '">' +
        svgBody(item.body, '1.5') + '<span>' + esc(item.label) + '</span></button>';
    }).join('');
    return '<div class="profile-icons">' +
      '<div class="icon-picker__bar">' +
        '<button class="btn btn--ghost btn--sm" type="button" data-profile-none title="Вернуть букву имени">Без иконки</button>' +
        '<button class="btn btn--ghost btn--sm" type="button" data-profile-upload title="Загрузить свою картинку">Своя картинка</button>' +
        '<input type="file" accept="image/*" hidden data-profile-file />' +
      '</div>' +
      '<div class="profile-icons__grid">' + grid + '</div>' +
      '<div class="icon-picker__preview">' +
        '<span class="icon-picker__preview-box" data-profile-preview>' + (icon ? iconMarkup(icon, 'profile') : '') + '</span>' +
        '<span class="icon-picker__preview-text" data-profile-caption>' + esc(profileIconCaption(icon)) + '</span>' +
      '</div>' +
    '</div>';
  }

  function wireProfileIconPicker(modal, initial) {
    let current = initial ? { type: initial.type, value: initial.value } : null;
    const grid = modal.card.querySelector('.profile-icons__grid');
    const preview = modal.card.querySelector('[data-profile-preview]');
    const caption = modal.card.querySelector('[data-profile-caption]');
    const fileInput = modal.card.querySelector('[data-profile-file]');
    const upload = modal.card.querySelector('[data-profile-upload]');
    const none = modal.card.querySelector('[data-profile-none]');

    const paint = function () {
      preview.innerHTML = current ? iconMarkup(current, 'profile') : '';
      caption.textContent = profileIconCaption(current);
      grid.querySelectorAll('[data-profile-icon]').forEach(function (button) {
        button.classList.toggle('is-selected',
          Boolean(current && current.type === 'preset' && button.getAttribute('data-profile-icon') === current.value));
      });
    };

    grid.addEventListener('click', function (event) {
      const button = event.target.closest('[data-profile-icon]');
      if (!button) return;
      current = { type: 'preset', value: button.getAttribute('data-profile-icon') };
      paint();
    });
    none.addEventListener('click', function () { current = null; paint(); });
    upload.addEventListener('click', function () { fileInput.click(); });
    fileInput.addEventListener('change', async function () {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      caption.textContent = 'Готовим картинку…';
      const result = await root.SteelUpload.readIconFile(file);
      fileInput.value = '';
      if (!result.ok) { caption.textContent = result.error; return; }
      current = { type: 'custom', value: result.dataUrl };
      paint();
    });
    paint();
    return function () { return current; };
  }

  function openProfileIcons(options) {
    return openModal({
      title: 'Иконка профиля',
      body: profileIconsHTML(options.icon),
      wide: true,
      buttons: [
        { id: 'cancel', label: 'Отмена' },
        { id: 'save', label: 'Сохранить', primary: true }
      ],
      onMount: function (modal) { modal.getIcon = wireProfileIconPicker(modal, options.icon); },
      onButton: function (id, modal) {
        if (id !== 'save') return false;
        if (options.onSubmit) options.onSubmit(modal.getIcon());
        return false;
      }
    });
  }

  /* --------------------------------------------------- Иконки задач/товаров --- */

  function iconPickerHTML(icon) {
    const grid = Icons.LIST.map(function (item) {
      const selected = icon.type === 'preset' && icon.value === item.id;
      return '<button class="icon-option' + (selected ? ' is-selected' : '') + '" type="button" ' +
        'data-icon="' + esc(item.id) + '" title="' + esc(item.label) + '" aria-label="' + esc(item.label) + '">' +
        svgBody(item.body, '1.7') + '</button>';
    }).join('');
    return '<div class="field icon-picker">' +
      '<span class="field__label">иконка</span>' +
      '<div class="icon-picker__bar">' +
        '<input class="input icon-picker__search" type="search" data-icon-search placeholder="Поиск: гантель, кофе, книга…" aria-label="Поиск иконки" />' +
        '<button class="btn btn--ghost btn--sm" type="button" data-icon-upload title="Загрузить свою картинку">Своя картинка</button>' +
        '<input type="file" accept="image/*" hidden data-icon-file />' +
      '</div>' +
      '<div class="icon-picker__grid" data-icon-grid>' + grid + '</div>' +
      '<div class="icon-picker__preview">' +
        '<span class="icon-picker__preview-box" data-icon-preview>' + iconMarkup(icon) + '</span>' +
        '<span class="icon-picker__preview-text" data-icon-caption>' + esc(iconCaption(icon)) + '</span>' +
      '</div>' +
    '</div>';
  }

  function iconCaption(icon) {
    if (icon.type === 'custom') return 'Своя картинка (уменьшена до 128 px).';
    const entry = Icons.get(icon.value);
    return entry ? 'Иконка набора: ' + entry.label + '.' : 'Иконка по умолчанию.';
  }

  function wireIconPicker(modal, initial) {
    let current = { type: initial.type, value: initial.value };
    const grid = modal.card.querySelector('[data-icon-grid]');
    const search = modal.card.querySelector('[data-icon-search]');
    const preview = modal.card.querySelector('[data-icon-preview]');
    const caption = modal.card.querySelector('[data-icon-caption]');
    const fileInput = modal.card.querySelector('[data-icon-file]');
    const upload = modal.card.querySelector('[data-icon-upload]');
    const paint = function () {
      preview.innerHTML = iconMarkup(current);
      caption.textContent = iconCaption(current);
      grid.querySelectorAll('[data-icon]').forEach(function (button) {
        button.classList.toggle('is-selected',
          current.type === 'preset' && button.getAttribute('data-icon') === current.value);
      });
    };
    grid.addEventListener('click', function (event) {
      const button = event.target.closest('[data-icon]');
      if (!button) return;
      current = { type: 'preset', value: button.getAttribute('data-icon') };
      paint();
    });
    search.addEventListener('input', function () {
      const ids = new Set(Icons.search(search.value).map(function (item) { return item.id; }));
      grid.querySelectorAll('[data-icon]').forEach(function (button) {
        button.hidden = !ids.has(button.getAttribute('data-icon'));
      });
    });
    upload.addEventListener('click', function () { fileInput.click(); });
    fileInput.addEventListener('change', async function () {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      caption.textContent = 'Готовим картинку…';
      const result = await root.SteelUpload.readIconFile(file);
      fileInput.value = '';
      if (!result.ok) { caption.textContent = result.error; return; }
      current = { type: 'custom', value: result.dataUrl };
      paint();
    });
    paint();
    return function () { return current; };
  }

  /* ------------------------------------------------------------- Задача --- */

  function openTaskForm(options) {
    const task = options.task || null;
    const isEdit = Boolean(task);
    const icon = task ? task.icon : Core.DEFAULT_ICON;
    const count = task ? task.count : 1;
    const initialPoints = task ? task.points : 5;
    const body =
      '<div class="field"><label class="field__label" for="formTitle">название</label>' +
        '<input class="input" id="formTitle" maxlength="' + Core.TASK_TITLE_MAX_LENGTH + '" data-autofocus ' +
          'placeholder="Например: 20 приседаний" value="' + esc(task ? task.title : '') + '" /></div>' +
      '<div class="field"><label class="field__label" for="formDesc">описание</label>' +
        '<textarea class="textarea textarea--task-desc" id="formDesc" maxlength="' + Core.TASK_DESC_MAX_LENGTH + '" ' +
          'placeholder="Необязательно. Можно с абзацами и планом по шагам">' + esc(task ? task.desc : '') + '</textarea>' +
        '<span class="field__hint">До ' + Core.TASK_DESC_MAX_LENGTH + ' символов. Переносы строк сохранятся.</span></div>' +
      '<div class="field__row">' +
        '<div class="field"><label class="field__label" for="formCount">план подходов</label>' +
          '<input class="input input--number" id="formCount" type="number" min="1" max="999" value="' + count + '"' + (isEdit ? ' disabled' : '') + ' />' +
          (isEdit ? '<span class="field__hint">План задаётся при создании.</span>' : '') + '</div>' +
        '<div class="field"><label class="field__label" for="formPoints">баллы за подход</label>' +
          '<input class="input input--number" id="formPoints" type="number" min="2" max="50" value="' + initialPoints + '" /></div>' +
      '</div>' +
      '<div class="field"><label class="field__label" for="formMinutes">сколько займёт, минут</label>' +
        '<input class="input input--number" id="formMinutes" type="number" min="' + Core.TASK_MINUTES_MIN + '" max="' + Core.TASK_MINUTES_MAX + '" ' +
          'placeholder="Необязательно" value="' + (task && task.minutes ? task.minutes : '') + '" />' +
        '<span class="field__hint">Ориентир по времени. Таймер не запускается.</span></div>' +
      '<label class="task-type-toggle">' +
        '<input type="checkbox" id="formOneTime"' + (task && task.oneTime ? ' checked' : '') + ' />' +
        '<span><b>Разовая задача</b><small>После выполнения уйдёт в архив</small></span>' +
      '</label>' +
      '<div class="form-total" id="formTotal">максимум +5 баллов</div>' +
      '<div class="form-warning" id="formPointsHint"></div>' +
      iconPickerHTML(icon) +
      '<div class="field__error" data-error></div>';

    let saved = false;

    function refreshForm(modal, clampPoints) {
      const pointsInput = modal.card.querySelector('#formPoints');
      const countInput = modal.card.querySelector('#formCount');
      const totalNode = modal.card.querySelector('#formTotal');
      const hint = modal.card.querySelector('#formPointsHint');
      if (!pointsInput || !countInput || !totalNode) return;
      const planned = Math.max(1, Math.floor(Number(countInput.value) || 1));
      const range = Core.taskPointsRange(planned);
      pointsInput.min = String(range.min);
      pointsInput.max = String(range.max);
      let points = Math.floor(Number(pointsInput.value) || 0);
      if (clampPoints) {
        if (points < range.min) points = range.min;
        if (points > range.max) points = range.max;
        pointsInput.value = String(points);
      }
      const total = points * planned;
      totalNode.textContent = 'максимум +' + total + ' баллов за ' + planned + ' ' +
        Core.plural(planned, 'подход', 'подхода', 'подходов');
      if (hint) {
        hint.textContent = 'Для ' + planned + ' ' + Core.plural(planned, 'подхода', 'подходов', 'подходов') +
          ': ' + range.min + '–' + range.max + ' баллов за подход.';
        hint.classList.add('is-on');
      }
    }

    return openModal({
      title: isEdit ? 'Изменить задачу' : 'Новая задача',
      body: body,
      wide: true,
      buttons: [
        { id: 'cancel', label: 'Отмена' },
        { id: 'save', label: isEdit ? 'Сохранить' : 'Добавить', primary: true }
      ],
      onClose: function () {
        if (!saved && options.onCancel) options.onCancel();
      },
      onMount: function (modal) {
        modal.getIcon = wireIconPicker(modal, icon);
        refreshForm(modal, true);
        modal.card.addEventListener('input', function (event) {
          if (!event.target) return;
          if (event.target.id === 'formCount') refreshForm(modal, true);
          if (event.target.id === 'formPoints') refreshForm(modal, false);
        });
        modal.card.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' && event.target.tagName === 'INPUT') {
            event.preventDefault();
            const save = modal.card.querySelector('[data-modal-btn="save"]');
            if (save) save.click();
          }
        });
      },
      onButton: function (id, modal) {
        if (id !== 'save') return false;
        const error = modal.card.querySelector('[data-error]');
        const title = modal.card.querySelector('#formTitle').value;
        const desc = modal.card.querySelector('#formDesc').value;
        const points = Math.floor(Number(modal.card.querySelector('#formPoints').value));
        const countInput = modal.card.querySelector('#formCount');
        const planned = Math.max(1, Math.floor(Number(countInput.value) || 1));
        const range = Core.taskPointsRange(planned);
        const minutesRaw = modal.card.querySelector('#formMinutes').value;
        const minutes = minutesRaw === '' ? 0 : Number(minutesRaw);
        if (!Core.cleanText(title, Core.TASK_TITLE_MAX_LENGTH)) {
          error.textContent = 'Нужно название — иначе задачу не узнать.';
          modal.card.querySelector('#formTitle').focus();
          return true;
        }
        if (!Number.isFinite(points) || points < range.min || points > range.max) {
          error.textContent = 'Для ' + planned + ' ' + Core.plural(planned, 'подхода', 'подходов', 'подходов') +
            ' баллы должны быть от ' + range.min + ' до ' + range.max + ' за подход.';
          modal.card.querySelector('#formPoints').focus();
          return true;
        }
        if (minutesRaw !== '' && (!Number.isFinite(minutes) || minutes < Core.TASK_MINUTES_MIN || minutes > Core.TASK_MINUTES_MAX)) {
          error.textContent = 'Время — от ' + Core.TASK_MINUTES_MIN + ' до ' + Core.TASK_MINUTES_MAX + ' минут или оставь пустым.';
          modal.card.querySelector('#formMinutes').focus();
          return true;
        }
        saved = true;
        options.onSubmit({
          title: title, desc: desc, points: points,
          count: planned, minutes: minutesRaw === '' ? 0 : Math.floor(minutes),
          oneTime: Boolean(modal.card.querySelector('#formOneTime').checked),
          icon: modal.getIcon()
        });
        return false;
      }
    });
  }

  /* --------------------------------------------------------- Карточка задачи --- */

  function openTaskCard(options) {
    const task = options.task;
    if (!task) return null;
    const kind = task.oneTime ? 'Разовая' : 'Многоразовая';
    const time = task.minutes ? task.minutes + ' мин' : '—';
    const desc = task.desc
      ? '<div class="task-card__desc">' + esc(task.desc) + '</div>'
      : '<p class="task-card__empty">Без описания.</p>';
    const body = '<div class="task-card">' +
      '<div class="task-card__kicker">' + esc(kind) + ' · выполнено ' + task.completed + ' из ' + task.count + '</div>' +
      '<div class="task-card__title-row">' +
        '<h2 class="task-card__title">' + esc(task.title) + '</h2>' +
        '<button class="icon-btn task-card__edit" type="button" data-task-card-edit ' +
          'title="Редактировать задачу" aria-label="Редактировать задачу">' + glyph('pencil') + '</button>' +
      '</div>' +
      desc +
      '<div class="task-card__meta">' +
        '<span>' + glyph('target') + '+' + task.points + ' за подход</span>' +
        '<span>' + glyph('check') + 'выполнено ' + task.completed + ' из ' + task.count + '</span>' +
        '<span>' + glyph('clock') + 'ориентир: ' + esc(time) + '</span>' +
        '<span>' + glyph('coins') + 'сейчас +' + task.award + '</span>' +
      '</div>' +
    '</div>';

    return openModal({
      title: 'Задача',
      body: body,
      wide: true,
      className: 'modal--task-card',
      buttons: [{ id: 'close', label: 'Закрыть' }],
      onMount: function (modal) {
        const edit = modal.card.querySelector('[data-task-card-edit]');
        if (edit && options.onEdit) {
          edit.addEventListener('click', function () { options.onEdit(task); });
        }
      }
    });
  }

  /* ------------------------------------------------------------- Товар --- */

  function randomIdea(exclude) {
    const pool = Core.SHOP_IDEAS.filter(function (idea) { return idea !== exclude; });
    return pool[Math.floor(Math.random() * pool.length)] || Core.SHOP_IDEAS[0];
  }

  function openItemForm(options) {
    const item = options.item || null;
    const isEdit = Boolean(item);
    const icon = item ? item.icon : Core.DEFAULT_ICON;
    const idea = item ? item.title : randomIdea('');
    const body =
      '<div class="field"><label class="field__label" for="itemTitle">что покупаем</label>' +
        '<div class="item-title-row">' +
          '<input class="input" id="itemTitle" maxlength="' + Core.TASK_TITLE_MAX_LENGTH + '" data-autofocus value="' + esc(idea) + '" />' +
          (isEdit ? '' : '<button class="btn btn--ghost btn--sm" type="button" data-shuffle title="Подсказать другую награду">' + glyph('refresh-cw') + 'Ещё идея</button>') +
        '</div>' +
        '<span class="field__hint">Не нравится идея — напишите свою. Это ваша награда.</span></div>' +
      '<div class="field"><label class="field__label" for="itemDesc">описание</label>' +
        '<textarea class="textarea" id="itemDesc" maxlength="' + Core.ITEM_DESC_MAX_LENGTH + '" placeholder="Коротко: почему это приятно">' + esc(item ? item.desc : '') + '</textarea>' +
        '<span class="field__hint">До ' + Core.ITEM_DESC_MAX_LENGTH + ' символов. Полный текст откроется в карточке.</span></div>' +
      '<div class="field"><label class="field__label" for="itemPrice">цена в баллах</label>' +
        '<input class="input input--number" id="itemPrice" type="number" min="1" max="999999" value="' + (item ? item.price : 30) + '" />' +
        '<span class="field__hint">Списывается только кошелёк. Уровень и класс не меняются.</span></div>' +
      iconPickerHTML(icon) +
      '<div class="field__error" data-error></div>';

    return openModal({
      title: isEdit ? 'Изменить товар' : 'Новая награда',
      body: body,
      wide: true,
      buttons: [
        { id: 'cancel', label: 'Отмена' },
        { id: 'save', label: isEdit ? 'Сохранить' : 'Добавить', primary: true }
      ],
      onMount: function (modal) {
        modal.getIcon = wireIconPicker(modal, icon);
        const shuffle = modal.card.querySelector('[data-shuffle]');
        if (shuffle) {
          shuffle.addEventListener('click', function () {
            const title = modal.card.querySelector('#itemTitle');
            title.value = randomIdea(title.value);
            title.focus();
          });
        }
      },
      onButton: function (id, modal) {
        if (id !== 'save') return false;
        const error = modal.card.querySelector('[data-error]');
        const title = modal.card.querySelector('#itemTitle').value;
        const desc = modal.card.querySelector('#itemDesc').value;
        const price = Number(modal.card.querySelector('#itemPrice').value);
        if (!Core.cleanText(title, Core.TASK_TITLE_MAX_LENGTH)) {
          error.textContent = 'Назовите награду — так понятнее, за что копим.';
          return true;
        }
        if (!Number.isFinite(price) || price < 1) {
          error.textContent = 'Цена — целое число от 1 балла.';
          return true;
        }
        options.onSubmit({ title: title, desc: desc, price: Math.floor(price), icon: modal.getIcon() });
        return false;
      }
    });
  }

  /* --------------------------------------------------------- Карточка награды --- */

  function openRewardCard(options) {
    const entry = options.entry || {};
    const isShop = options.kind === 'shop';
    const body = '<div class="reward-card">' +
      '<span class="reward-card__icon">' + iconMarkup(entry.icon) + '</span>' +
      '<div><p class="reward-card__desc">' + esc(entry.desc || 'Описания нет — только название и предвкушение.') + '</p>' +
      (isShop
        ? '<p class="field__hint">Цена: ' + entry.price + ' ' + Core.pointsWord(entry.price) + '. Покупка спишет только кошелёк.</p>'
        : '<p class="field__hint">Это уже случилось. Можно просто порадоваться.</p>') +
      '</div></div>';
    return openModal({
      title: entry.title || 'Награда',
      body: body,
      className: 'modal--reward',
      buttons: isShop
        ? [{ id: 'cancel', label: 'Закрыть' }, { id: 'buy', label: 'Купить', primary: true }]
        : [{ id: 'ok', label: 'Приятно', primary: true }],
      onButton: function (id) {
        if (id === 'buy' && options.onBuy) root.setTimeout(options.onBuy, 0);
        return false;
      }
    });
  }

  /* ------------------------------------------------------------- Заметка --- */

  function showNoteMini(options) {
    if (!elements.noteMiniRoot) return;
    const title = esc(options.title || 'Без названия');
    const text = esc(options.text || 'Пусто');
    elements.noteMiniRoot.innerHTML = '<div class="note-mini">' +
      '<div class="note-mini__head"><span class="note-mini__kicker">черновик заметки</span>' +
        '<button class="icon-btn note-mini__close" type="button" title="Убрать черновик" aria-label="Убрать черновик">' + glyph('x') + '</button></div>' +
      '<p class="note-mini__title">' + title + '</p>' +
      '<p class="note-mini__text">' + text + '</p>' +
      '<div class="note-mini__actions">' +
        '<button class="btn btn--ghost btn--sm" type="button" data-note-mini-expand>Развернуть</button>' +
        '<button class="btn btn--gold btn--sm" type="button" data-note-mini-save>Сохранить</button>' +
      '</div>' +
    '</div>';
    const expand = elements.noteMiniRoot.querySelector('[data-note-mini-expand]');
    const save = elements.noteMiniRoot.querySelector('[data-note-mini-save]');
    const close = elements.noteMiniRoot.querySelector('.note-mini__close');
    if (expand) expand.addEventListener('click', function () { if (options.onExpand) options.onExpand(); });
    if (save) save.addEventListener('click', function () { if (options.onSave) options.onSave(); });
    if (close) close.addEventListener('click', function () { if (options.onDiscard) options.onDiscard(); });
  }

  function hideNoteMini() {
    if (elements.noteMiniRoot) elements.noteMiniRoot.innerHTML = '';
  }

  function openNoteForm(options) {
    const note = options.note || null;
    const body =
      '<div class="field"><label class="field__label" for="noteTitle">название</label>' +
        '<input class="input" id="noteTitle" maxlength="' + Core.NOTE_TITLE_MAX_LENGTH + '" data-autofocus placeholder="Например: планы на неделю" value="' + esc(note ? note.title : '') + '" /></div>' +
      '<div class="field"><label class="field__label" for="noteText">текст</label>' +
        '<textarea class="textarea textarea--tall" id="noteText" maxlength="' + Core.NOTE_TEXT_MAX_LENGTH + '" placeholder="Начните писать…">' + esc(note ? note.text : '') + '</textarea>' +
        '<div class="field__hint" style="text-align:right" data-note-counter>0 / ' + Core.NOTE_TEXT_MAX_LENGTH + '</div></div>' +
      (note ? '' : '<div class="note-tips"><span class="note-tips__title">Можно писать как есть</span>' +
        '<span class="note-tips__text">Без структуры, заголовков и «правильных» формулировок. Заметка — это место, где мысль может побыть собой.</span></div>') +
      '<div class="field__error" data-error></div>';
    return openModal({
      title: note ? 'Изменить заметку' : 'Новая заметка',
      body: body,
      wide: true,
      buttons: [
        { id: 'cancel', label: 'Отмена' },
        { id: 'collapse', label: 'Свернуть' },
        { id: 'save', label: note ? 'Сохранить' : 'Добавить', primary: true }
      ],
      onMount: function (modal) {
        const text = modal.card.querySelector('#noteText');
        const counter = modal.card.querySelector('[data-note-counter]');
        const paint = function () { counter.textContent = text.value.length + ' / ' + Core.NOTE_TEXT_MAX_LENGTH; };
        text.addEventListener('input', paint);
        paint();
        modal.card.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' && event.ctrlKey) {
            event.preventDefault();
            const save = modal.card.querySelector('[data-modal-btn="save"]');
            if (save) save.click();
          }
        });
      },
      onButton: function (id, modal) {
        const error = modal.card.querySelector('[data-error]');
        const title = modal.card.querySelector('#noteTitle').value;
        const text = modal.card.querySelector('#noteText').value;
        if (id === 'collapse') {
          if (options.onCollapse) options.onCollapse({ id: note ? note.id : '', title: title, text: text });
          return false;
        }
        if (id !== 'save') return false;
        if (!title.trim() && !text.trim()) {
          error.textContent = 'Пустую заметку сохранять нечего.';
          modal.card.querySelector('#noteTitle').focus();
          return true;
        }
        options.onSubmit({ title: title, text: text });
        return false;
      }
    });
  }

  /* --------------------------------------------------- Выбор класса --- */

  function classOptionHTML(template, mode) {
    const isCustom = template.kind === 'custom';
    const titles = isCustom
      ? '<p class="field__hint">Вы сами назовёте класс и 15 титулов после выбора. Нажмите на карандаш в блоке «Классы и титулы».</p>'
      : '<div class="class-option__titles">' + template.titles.map(function (item, index) {
          return '<div class="class-title-line"><div class="class-title-line__name">' +
            pad2(index + 1) + ' · ' + esc(item.name) + '</div>' +
            '<div class="class-title-line__lore">' + esc(item.lore) + '</div></div>';
        }).join('') + '</div>';
    return '<div class="class-option" data-class-kind="' + esc(template.kind) + '">' +
      '<button class="class-option__head" type="button" data-class-toggle>' +
        '<span class="class-option__icon">' + glyph(template.icon) + '</span>' +
        '<span class="class-option__text"><span class="class-option__name">' + esc(template.name) + '</span>' +
          '<span class="class-option__lore">' + esc(template.lore) + '</span></span>' +
        '<svg class="class-option__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m6 9 6 6 6-6"/></svg>' +
      '</button>' +
      '<div class="class-option__body">' +
        titles +
        (isCustom
          ? '<div class="field"><label class="field__label" for="customClassName">название класса</label>' +
              '<input class="input" id="customClassName" data-custom-class-name maxlength="' + Core.CLASS_NAME_MAX_LENGTH + '" placeholder="Например: Ассасин" /></div>'
          : '') +
        '<div class="class-option__actions"><button class="btn btn--ghost btn--sm" type="button" data-class-select ' +
          'title="Выбрать этот класс">Выбрать</button></div>' +
      '</div>' +
    '</div>';
  }

  function openClassPicker(options) {
    const mode = options.mode === 'sub' ? 'sub' : 'main';
    const view = options.view;
    const classes = view.classes;
    const templates = classes.templates.filter(function (template) {
      if (mode === 'main') return true;
      return !template.used || template.kind === 'custom';
    });
    const title = mode === 'main' ? 'Выбор ветки развития' : 'Желаете выбрать подкласс?';
    const intro = mode === 'main'
      ? 'На 2 уровне пора выбрать путь. Класс начнётся с первого титула. Потом его можно будет сменить, а титулы — переименовать.'
      : 'Подкласс — вторая ветка. Она начнёт расти с первого титула и станет активной. Всего можно хранить до 4 веток: основную и три подкласса.';
    const body = '<p class="modal__text">' + intro + '</p>' +
      '<div class="class-picker">' + templates.map(function (template) { return classOptionHTML(template, mode); }).join('') + '</div>' +
      '<div class="class-picker__error" data-class-error></div>';
    let selectedKind = '';
    let selectedName = '';
    let primary = null;

    return openModal({
      title: title,
      body: body,
      wide: true,
      className: 'modal--class-picker',
      buttons: [
        { id: 'cancel', label: 'Отмена' },
        { id: 'choose', label: mode === 'main' ? 'Начать' : 'Добавить', primary: true }
      ],
      onMount: function (modal) {
        primary = modal.card.querySelector('[data-modal-btn="choose"]');
        primary.disabled = true;
        const error = modal.card.querySelector('[data-class-error]');
        const customInput = modal.card.querySelector('[data-custom-class-name]');
        const paint = function () {
          modal.card.querySelectorAll('[data-class-kind]').forEach(function (option) {
            option.classList.toggle('is-selected', option.getAttribute('data-class-kind') === selectedKind);
          });
          primary.disabled = !selectedKind || (selectedKind === 'custom' && !selectedName);
        };
        modal.card.addEventListener('click', function (event) {
          const toggle = event.target.closest('[data-class-toggle]');
          if (toggle) {
            const option = toggle.closest('[data-class-kind]');
            option.classList.toggle('is-open');
            return;
          }
          const select = event.target.closest('[data-class-select]');
          if (select) {
            const option = select.closest('[data-class-kind]');
            selectedKind = option.getAttribute('data-class-kind');
            const input = option.querySelector('[data-custom-class-name]');
            selectedName = input ? input.value.trim() : '';
            error.textContent = '';
            paint();
            return;
          }
        });
        if (customInput) {
          customInput.addEventListener('input', function () {
            selectedKind = 'custom';
            selectedName = customInput.value.trim();
            paint();
          });
        }
        paint();
      },
      onButton: function (id, modal) {
        if (id !== 'choose') return false;
        const error = modal.card.querySelector('[data-class-error]');
        if (!selectedKind) { error.textContent = 'Выберите ветку.'; return true; }
        if (selectedKind === 'custom' && !selectedName) {
          error.textContent = 'Придумайте название своей ветке.';
          const input = modal.card.querySelector('[data-custom-class-name]');
          if (input) input.focus();
          return true;
        }
        if (options.onChoose) options.onChoose(selectedKind, selectedName);
        return false;
      }
    });
  }

  /* --------------------------------------------------- Редактор титулов --- */

  function openTitleEditor(options) {
    const branch = options.branch;
    const isCustom = branch.kind === 'custom';
    const body = '<div class="title-editor">' +
      (isCustom
        ? '<div class="field"><label class="field__label" for="classNameInput">название класса</label>' +
            '<input class="input" id="classNameInput" maxlength="' + Core.CLASS_NAME_MAX_LENGTH + '" value="' + esc(branch.name) + '" /></div>'
        : '<p class="field__hint">Класс: ' + esc(branch.name) + '. Меняйте названия и описания титулов — они сохранятся только у вас.</p>') +
      '<div class="title-editor__list">' +
        branch.titles.map(function (title, index) {
          return '<div class="title-edit" data-title-level="' + (index + 1) + '">' +
            '<div class="title-edit__head"><span class="title-edit__level">' + pad2(index + 1) + '</span>' +
              '<span class="title-edit__standard">титул ' + (index + 1) + '</span></div>' +
            '<div class="field"><input class="input" data-title-name maxlength="' + Core.TITLE_MAX_LENGTH + '" value="' + esc(title.name) + '" /></div>' +
            '<div class="field"><textarea class="textarea" data-title-lore maxlength="' + Core.DESC_MAX_LENGTH + '" rows="2">' + esc(title.lore) + '</textarea></div>' +
          '</div>';
        }).join('') +
      '</div></div>';
    return openModal({
      title: 'Титулы и описания',
      body: body,
      wide: true,
      className: 'modal--title-editor',
      buttons: [
        { id: 'cancel', label: 'Отмена' },
        { id: 'save', label: 'Сохранить', primary: true }
      ],
      onButton: function (id, modal) {
        if (id !== 'save') return false;
        const titles = [];
        modal.card.querySelectorAll('[data-title-level]').forEach(function (row) {
          titles.push({
            name: row.querySelector('[data-title-name]').value,
            lore: row.querySelector('[data-title-lore]').value
          });
        });
        const nameInput = modal.card.querySelector('#classNameInput');
        options.onSave({
          name: nameInput ? nameInput.value : branch.name,
          titles: titles
        });
        return false;
      }
    });
  }

  /* ----------------------------------------------------------------- FAQ --- */

  function faqItem(question, answer) {
    return '<details class="faq__item"><summary class="faq__q">' + esc(question) + '</summary>' +
      '<div class="faq__a">' + answer + '</div></details>';
  }

  function openFAQ() {
    const body = '<div class="faq">' +
      '<p class="faq__intro"><b>Still Standing Demo</b> — это приложение для геймификации задач и возможности делать сложное приятным способом. ' +
        'Оно не требует быть продуктивным каждый день. Оно помогает заметить, что ты уже сделал, и получить за это немного тепла.</p>' +
      faqItem('Зачем это приложение?', '<p>Чтобы трудные дела становились маленькими шагами, а не горой. Ты отмечаешь сделанное, получаешь баллы, растёшь в уровнях и открываешь титулы. Это не экзамен и не таблица достижений — это способ поддержать себя.</p>') +
      faqItem('Как считаются баллы?', '<p>Баллы за задачу = <b>баллы за подход × количество подходов</b>. Кнопка «+» добавляет подход, «−» убирает. После отметки пополняется кошелёк и общий счёт; уровень растёт только после подтверждения. Снятая галочка возвращает баллы, кроме уже потраченных в магазине.</p>') +
      faqItem('Что такое класс и как его выбрать?', '<p>На 2 уровне открывается выбор класса: китайская сущность, карьерист, котик или своя ветка. Класс — это отдельный путь с 15 титулами. У него свой счётчик: баллы ветки не тратятся в магазине и не двигают общий уровень. Задачи идут в активную ветку; переключить её можно кнопкой с треугольником в блоке «Классы и титулы».</p>') +
      faqItem('Как добавить подкласс?', '<p>Когда активная ветка достигает 5 уровня, в шапке «Классы и титулы» загорается кнопка «+ подкласс». Можно хранить до 4 веток: основную и три подкласса. Новый подкласс становится активным; чтобы добавить следующий, его тоже нужно прокачать до 5 уровня. Подкласс можно удалить корзиной; основную ветку в демо не удаляем.</p>') +
      faqItem('Что такое титулы?', '<p>У каждого класса 15 титулов с описаниями. Текущий подсвечен золотым, достигнутые — светлее, будущие — приглушены. Карандаш в строке класса открывает редактор: можно переименовать любой титул и описание, у «Своего» — ещё и название класса.</p>') +
      faqItem('Как работает фокусировка?', '<p>Выбери время фокуса или отдыха и нажми «Сейчас фокусируемся» или «Сейчас отдыхаем». «Старт» запускает таймер, «Пауза» останавливает, «Стоп» записывает результат, если прошло от 5 минут, и сбрасывает время. Таймер идёт в фоне на любой вкладке.</p>') +
      faqItem('Что происходит в 04:00?', '<p>Галочки, счётчики подходов и итоги фокусировки обнуляются. Баллы, уровень, классы, титулы, заметки, инвентарь и архив остаются. Это происходит в 04:00 по вашему местному времени.</p>') +
      faqItem('Куда попадают выполненные задачи?', '<p>В архив. Он хранит 31 активный день: только дни, где были выполнены задачи. Старые даты исчезают без возможности восстановления. Внутри дня — задачи, подходы и баллы, без общей суммы за день.</p>') +
      faqItem('Что делать с покупками?', '<p>Купленное лежит в инвентаре над классами. Нажми «Использовано» — награда переедет в «Ачивки». Покупка списывает только кошелёк, уровень и титулы не меняются.</p>') +
      faqItem('Как изменить имя?', '<p>Только кнопкой с карандашом рядом с именем. Нажатие на сами буквы имя не меняет. В окне можно ввести до 16 символов; пустое имя вернёт заглушку «Назови свое имя».</p>') +
      faqItem('Как не потерять данные?', '<p>Всё хранится в этом браузере. Экспорт и импорт — в правом верхнем углу. Приложение работает офлайн и не отправляет данные на сервер.</p>') +
      faqItem('Что если я пропустил день?', '<p>Ничего страшного. Приложение не считает пропуски и не ругает. В 04:00 просто начнётся новый день, а заработанное останется с тобой.</p>') +
    '</div>';
    return openModal({
      title: 'FAQ',
      body: body,
      wide: true,
      className: 'modal--faq',
      buttons: [{ id: 'ok', label: 'Понятно', primary: true }]
    });
  }

  /* ------------------------------------------------------------- Тосты --- */

  function toast(text, tone) {
    const node = el('div', 'toast' + (tone ? ' toast--' + tone : ''), esc(text));
    elements.toastStack.appendChild(node);
    root.setTimeout(function () {
      node.classList.add('is-leaving');
      root.setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); }, 320);
    }, 3200);
  }

  function floatPoints(text, tone, anchor) {
    if (!anchor || !anchor.getBoundingClientRect) return;
    const rect = anchor.getBoundingClientRect();
    const node = el('span', 'float-points float-points--' + (tone || 'plus'), esc(text));
    node.style.left = Math.round(rect.left + rect.width / 2) + 'px';
    node.style.top = Math.round(rect.top - 6) + 'px';
    node.style.transform = 'translateX(-50%)';
    document.body.appendChild(node);
    root.setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); }, 1050);
  }

  function pulse(variant) {
    const blocks = document.querySelectorAll('.profile__rank, .progress__block--' + variant);
    blocks.forEach(function (block) {
      block.classList.remove('is-pulsing');
      void block.offsetWidth;
      block.classList.add('is-pulsing');
    });
  }

  /* ---------------------------------------------------------- Публичный API --- */

  root.SteelUI = {
    init: init,
    render: render,
    toast: toast,
    floatPoints: floatPoints,
    pulse: pulse,
    confirmAction: confirmAction,
    openLevelUpDialog: openLevelUpDialog,
    showMessage: showMessage,
    openNameForm: openNameForm,
    openTestPassword: openTestPassword,
    openProfileIcons: openProfileIcons,
    openTaskForm: openTaskForm,
    showNoteMini: showNoteMini,
    hideNoteMini: hideNoteMini,
    openTaskCard: openTaskCard,
    openItemForm: openItemForm,
    openNoteForm: openNoteForm,
    openRewardCard: openRewardCard,
    openClassPicker: openClassPicker,
    openTitleEditor: openTitleEditor,
    openFAQ: openFAQ,
    closeModal: closeModal,
    updateFocusClock: updateFocusClock,
    showFocusOverlay: showFocusOverlay,
    hideFocusOverlay: hideFocusOverlay,
    focusOverlayMode: function () { return lastEndedMode; },
    isModalOpen: function () { return Boolean(activeModal); },
    getLastView: function () { return lastView; }
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script data-source="js/main.js">
/* ============================================================================
   Still Standing — запуск приложения и обработчики действий.
   ============================================================================ */
(function (root) {
  'use strict';

  const Core = root.SteelCore;
  const Store = root.SteelStore;
  const UI = root.SteelUI;
  const Focus = root.SteelFocus;
  const Storage = root.SteelStorage;

  const RESET_TICK_MS = 30000;
  const TEST_PASSWORD = '0211';
  const TEST_WINDOW_NAME = 'still-standing-test';
  const TEST_MODE = /(?:^|[?&])test=1(?:&|$)/.test(root.location.search);
  const NOTE_DRAFT_KEY = 'steel-standing/note-draft';
  const TEST_NOTE_DRAFT_KEY = 'steel-standing/test-note-draft';
  let testWindow = null;
  let noteDraft = null;

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function findTask(id) {
    return Store.getState().tasks.find(function (task) { return task.id === id; }) || null;
  }
  function findItem(id) {
    return Store.getState().shop.find(function (item) { return item.id === id; }) || null;
  }
  function findNote(id) {
    return (Store.getState().notes || []).find(function (note) { return note.id === id; }) || null;
  }
  function findInventory(id) {
    return (Store.getState().inventory || []).find(function (entry) { return entry.id === id; }) || null;
  }
  function pointsLabel(count) {
    return count + ' ' + Core.pointsWord(count);
  }
  function findClass(id) {
    const view = Store.getView();
    return view.classes.list.find(function (item) { return item.id === id; }) || null;
  }

  /* --------------------------------------------------------- Черновик заметки --- */

  function noteDraftKey() {
    return Store.isTestMode() ? TEST_NOTE_DRAFT_KEY : NOTE_DRAFT_KEY;
  }

  function readNoteDraft() {
    try {
      const raw = root.localStorage.getItem(noteDraftKey());
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (!data || typeof data !== 'object') return null;
      return {
        id: typeof data.id === 'string' ? data.id : '',
        title: String(data.title == null ? '' : data.title).slice(0, Core.NOTE_TITLE_MAX_LENGTH),
        text: String(data.text == null ? '' : data.text).slice(0, Core.NOTE_TEXT_MAX_LENGTH)
      };
    } catch (error) { return null; }
  }

  function writeNoteDraft(data) {
    noteDraft = data;
    try { root.localStorage.setItem(noteDraftKey(), JSON.stringify(data)); } catch (error) {}
    showNoteDraft();
  }

  function clearNoteDraft() {
    noteDraft = null;
    try { root.localStorage.removeItem(noteDraftKey()); } catch (error) {}
    UI.hideNoteMini();
  }

  function showNoteDraft() {
    if (!noteDraft) return;
    UI.showNoteMini({
      title: noteDraft.title,
      text: noteDraft.text,
      onExpand: openDraft,
      onSave: saveDraft,
      onDiscard: discardDraft
    });
  }

  function restoreNoteDraft() {
    noteDraft = readNoteDraft();
    if (noteDraft) showNoteDraft();
  }

  function collapseNote(data) {
    writeNoteDraft({
      id: data.id || '',
      title: String(data.title || '').slice(0, Core.NOTE_TITLE_MAX_LENGTH),
      text: String(data.text || '').slice(0, Core.NOTE_TEXT_MAX_LENGTH)
    });
    UI.toast('Заметка свёрнута. Черновик внизу справа.', 'mint');
  }

  function openDraft() {
    if (!noteDraft) return;
    openNoteEditor({ id: noteDraft.id, title: noteDraft.title, text: noteDraft.text }, true);
  }

  function saveDraft() {
    if (!noteDraft) return;
    if (!noteDraft.title.trim() && !noteDraft.text.trim()) {
      UI.toast('Пустую заметку сохранять нечего', 'amber');
      return;
    }
    const existing = noteDraft.id ? findNote(noteDraft.id) : null;
    if (existing) {
      Store.updateNoteById(noteDraft.id, { title: noteDraft.title, text: noteDraft.text });
      clearNoteDraft();
      UI.toast('Заметка сохранена', 'mint');
      return;
    }
    const result = Store.createNote({ title: noteDraft.title, text: noteDraft.text });
    if (!result.ok) {
      UI.toast(result.reason === 'limit' ? 'Заметок уже слишком много' : 'Заметка не сохранилась', 'amber');
      return;
    }
    clearNoteDraft();
    UI.toast('Заметка сохранена', 'mint');
  }

  function discardDraft() {
    if (!noteDraft) return;
    UI.confirmAction({
      title: 'Убрать черновик?',
      text: 'Несохранённый текст заметки исчезнет.',
      confirmLabel: 'Убрать', cancelLabel: 'Оставить', tone: 'danger'
    }).then(function (confirmed) {
      if (confirmed) clearNoteDraft();
    });
  }

  function openNoteEditor(note, fromDraft) {
    UI.openNoteForm({
      note: note,
      onCollapse: function (data) {
        collapseNote({ id: note && note.id ? note.id : data.id, title: data.title, text: data.text });
      },
      onSubmit: function (data) {
        const result = note && note.id
          ? Store.updateNoteById(note.id, data)
          : Store.createNote(data);
        if (!result || result.ok === false) { UI.toast('Заметка не сохранилась', 'rose'); return; }
        if (fromDraft) clearNoteDraft();
        UI.toast(note && note.id ? 'Заметка обновлена' : 'Заметка добавлена', 'mint');
      }
    });
  }

  /* ------------------------------------------------------ Класс на 2 уровне --- */  /* ------------------------------------------------------ Класс на 2 уровне --- */

  let classOffered = false;

  function offerClassChoice(force) {
    if (!force && classOffered) return;
    if (UI.isModalOpen()) return;
    const view = Store.getView();
    if (!view.classes.canChoose) return;
    classOffered = true;
    UI.openClassPicker({
      mode: 'main',
      view: view,
      onChoose: function (kind, name) {
        const result = Store.chooseMainClass(kind, name);
        if (!result.ok) {
          UI.toast(result.reason === 'name-required'
            ? 'Придумайте название своей ветке'
            : 'Класс не выбран', 'amber');
          return;
        }
        classOffered = true;
        UI.toast('Ветка выбрана: ' + result.class.name + '. Первый титул уже ваш.', 'mint');
      }
    });
  }

  function openAddSubclass() {
    const view = Store.getView();
    if (!view.classes.canAddSubclass) {
      UI.toast(view.classes.addSubclassReason || 'Подкласс пока недоступен', 'amber');
      return;
    }
    UI.openClassPicker({
      mode: 'sub',
      view: view,
      onChoose: function (kind, name) {
        const result = Store.addSubclass(kind, name);
        if (!result.ok) {
          UI.toast(result.reason === 'name-required'
            ? 'Придумайте название своей ветке'
            : 'Подкласс не добавлен', 'amber');
          return;
        }
        UI.toast('Подкласс добавлен: ' + result.class.name + '. Он стал активным.', 'mint');
      }
    });
  }

  function openChooseClass() {
    const view = Store.getView();
    if (!view.classes.canChoose) {
      UI.toast('Выбор ветки откроется на 2 уровне', 'amber');
      return;
    }
    offerClassChoice(true);
  }

  function openEditClass(id) {
    const branch = findClass(id);
    if (!branch) return;
    UI.openTitleEditor({
      branch: branch,
      onSave: function (data) {
        const result = Store.updateClass(id, data);
        UI.toast(result && result.changed ? 'Титулы обновлены' : 'Титулы не изменились',
          result && result.changed ? 'mint' : 'amber');
      }
    });
  }

  function removeClassWithConfirm(id) {
    const branch = findClass(id);
    if (!branch) return;
    if (branch.main) {
      UI.toast('Основную ветку нельзя удалить в демо', 'amber');
      return;
    }
    UI.confirmAction({
      title: 'Удалить ветвь?',
      text: 'Ветвь <b>' + esc(branch.name) + '</b> и её прогресс (' + branch.points +
        ' ' + Core.pointsWord(branch.points) + ') исчезнут. Задачи и баллы кошелька останутся.',
      confirmLabel: 'Удалить ветвь',
      tone: 'danger'
    }).then(function (confirmed) {
      if (!confirmed) return;
      const result = Store.removeClass(id);
      if (result && result.ok) UI.toast('Ветвь удалена. Можно выбрать новую.', 'amber');
      else UI.toast('Не получилось удалить ветвь', 'rose');
    });

  /* ------------------------------------------------------ Подтверждение уровня --- */

  function offerLevelUp(options) {
    const force = Boolean(options && options.force);
    if (UI.isModalOpen()) return;
    const offered = Store.getView().levelUp;
    if (!offered || !offered.pending) {
      if (force) UI.toast('Баллов пока не хватает на новый уровень', 'amber');
      return;
    }
    if (!force && !offered.prompt) return;
    UI.openLevelUpDialog({ level: offered.level }).then(function (answer) {
      if (answer === 'confirm') {
        const result = Store.confirmLevelUp();
        if (!result.ok) return;
        UI.pulse('level');
        UI.toast('Уровень ' + result.level + '. Продолжай в своём темпе.', 'mint');
        if (Store.getView().classes.canChoose) {
          root.setTimeout(function () { offerClassChoice(true); }, 80);
        }
        return;
      }
      Store.deferLevelUp();
      UI.toast('Повышение отложено — баллы и уровень на месте', 'amber');
    });
  }

  /* --------------------------------------------------------- Карточка задачи --- */

  function openTaskCard(id) {
    const task = Store.getView().tasks.find(function (item) { return item.id === id; }) || null;
    if (!task) return;
    UI.openTaskCard({
      task: task,
      onEdit: function () { editTask(id, true); }
    });
  }

  function editTask(id, returnToCard) {
    const task = findTask(id);
    if (!task) return;
    UI.openTaskForm({
      task: task,
      onCancel: returnToCard ? function () { openTaskCard(id); } : null,
      onSubmit: function (data) {
        Store.updateTaskById(id, data);
        if (returnToCard) openTaskCard(id);
        else UI.toast('Задача обновлена', 'mint');
      }
    });
  }

  /* ------------------------------------------------------ Тестовое окно --- */

  function openTestWindow() {
    if (testWindow && !testWindow.closed) {
      try { testWindow.close(); } catch (error) { /* окно могло быть не нашим */ }
    }
    if (Storage) Storage.clear(Storage.TEST_KEY);
    try { root.localStorage.removeItem(TEST_NOTE_DRAFT_KEY); } catch (error) {}

    const url = new root.URL(root.location.href);
    url.searchParams.delete('demo');
    url.searchParams.delete('test');
    url.searchParams.delete('session');
    url.searchParams.set('test', '1');
    url.searchParams.set('session', String(Date.now()));

    let opened = null;
    try {
      opened = root.open(url.href, TEST_WINDOW_NAME, 'popup=yes,width=1024,height=768');
    } catch (error) {
      opened = null;
    }
    if (!opened) {
      UI.showMessage({
        title: 'Окно не открылось',
        text: 'Браузер заблокировал второе окно. Разрешите всплывающие окна для этого файла и нажмите «Режим тестирования» ещё раз.<br>' +
          'Твой профиль при этом не пострадал.'
      });
      return;
    }
    testWindow = opened;
    try { opened.focus(); } catch (error) { /* не критично */ }
    UI.toast('Тестовое окно открыто. Твой профиль не тронут.', 'mint');
  }

  function resetTestData() {
    if (!Store.isTestMode()) return;
    UI.confirmAction({
      title: 'Вернуть как было?',
      text: 'В тестовом окне всё станет пустым: имя, класс, задачи, заметки, фокус.<br>' +
        'Твой настоящий профиль в другом окне не изменится.',
      confirmLabel: 'Вернуть как было',
      tone: 'danger'
    }).then(function (confirmed) {
      if (!confirmed) return;
      if (Focus) Focus.stop();
      UI.hideFocusOverlay();
      try { root.localStorage.removeItem(TEST_NOTE_DRAFT_KEY); } catch (error) {}
      noteDraft = null;
      UI.hideNoteMini();
      Store.resetToZero();
      UI.toast('Тестовые данные сброшены. Профиль не тронут.', 'amber');
    });
  }

    /* --- Фокусировка --- */
    focusMode: function (mode) {
      const timer = Focus.getState();
      if (timer.hasTimer) { UI.toast('Сначала нажмите «Стоп», чтобы сменить режим', 'amber'); return; }
      Store.setFocusMode(mode);
    },

    focusStart: function (form) {
      const timer = Focus.getState();
      if (timer.running) return;
      const view = Store.getView();
      const data = form || {};
      if (!timer.hasTimer) {
        Store.saveFocusSettings({ focusMin: data.focusMin, restMin: data.restMin });
        if (data.quote != null) Store.saveFocusQuote(data.quote);
      }
      const fresh = Store.getView();
      if (timer.hasTimer && !timer.ended && timer.remainingMs > 0) {
        Focus.resume();
        UI.toast('Продолжаем. Где остановились — там и продолжим.', 'mint');
        UI.render(Store.getView());
        return;
      }
      const mode = fresh.focus.mode;
      const minutes = mode === 'rest' ? fresh.focus.restMin : fresh.focus.focusMin;
      Store.markFocusStarted();
      Focus.start(mode, minutes, fresh.focus.quote);
      UI.render(Store.getView());
      UI.toast(mode === 'rest'
        ? 'Отдых пошёл. Не спорьте с таймером — он прав.'
        : 'Фокус пошёл. ' + minutes + ' ' + Core.plural(minutes, 'минута', 'минуты', 'минут') + ' — и ни о чём другом.',
      'mint');
    },

    focusPause: function () {
      const timer = Focus.getState();
      if (!timer.running) return;
      Focus.pause();
      UI.toast('Пауза. Подход не разорвался — минуты на месте.', 'amber');
      UI.updateFocusClock();
    },

    focusStop: function () {
      const timer = Focus.getState();
      if (!timer.hasTimer) {
        UI.toast('Таймер и так на нуле. Готовность — тоже состояние.', 'amber');
        return;
      }
      const mode = timer.mode || 'focus';
      const minutes = Math.max(0, Math.floor(timer.elapsedMs / 60000));
      Focus.stop();
      UI.hideFocusOverlay();
      if (minutes >= 5) {
        Store.addFocusSession(mode, minutes);
        UI.toast(minutes + ' ' + Core.plural(minutes, 'минута', 'минуты', 'минут') +
          ' записаны. Теперь можно выбрать отдых или новый заход.', 'mint');
      } else {
        UI.toast('Кажется, вы меня проверяете. Я запишу результат, если он будет от 5 минут.', 'amber');
        UI.render(Store.getView());
      }
    },

    focusSettings: function (form) {
      const timer = Focus.getState();
      if (timer.hasTimer) return;
      Store.saveFocusSettings({
        focusMin: form ? form.focusMin : 25,
        restMin: form ? form.restMin : 15
      });
    },

    focusQuote: function (value) {
      const timer = Focus.getState();
      if (timer.hasTimer) return;
      Store.saveFocusQuote(value);
    },

    focusOverlayPrimary: function () {
      const mode = UI.focusOverlayMode();
      const next = mode === 'rest' ? 'focus' : 'rest';
      const view = Store.getView();
      const minutes = next === 'rest' ? view.focus.restMin : view.focus.focusMin;
      Store.setFocusMode(next);
      Store.markFocusStarted();
      Focus.start(next, minutes, view.focus.quote);
      UI.hideFocusOverlay();
      UI.render(Store.getView());
      UI.toast(next === 'rest' ? 'Отдых пошёл. Не спорьте с таймером.' : 'Фокус пошёл. Телефон вниз.', 'mint');
    },

    focusOverlayStop: function () {
      Focus.stop();
      UI.hideFocusOverlay();
      UI.render(Store.getView());
      UI.toast('Закрыли. Можно вернуться к делам или к тишине.', 'amber');
    },

    /* --- Тестовый режим --- */
    testMode: function () {
      UI.openTestPassword({
        validate: function (value) { return value === TEST_PASSWORD; },
        onSubmit: openTestWindow
      });
    },
    testReset: resetTestData,

    /* --- Файлы --- */
    exportData: function () { exportToFile(); },
    importFile: function (file) { importFromFile(file); }
  };

  /* ---------------------------------------------------- Экспорт в файл --- */

  function timestampForFile(date) {
    const pad = function (value) { return String(value).padStart(2, '0'); };
    return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()) +
      '_' + pad(date.getHours()) + pad(date.getMinutes());
  }

  function exportToFile() {
    const payload = Store.exportPayload();
    const text = JSON.stringify(payload, null, 2);
    const blob = new root.Blob([text], { type: 'application/json;charset=utf-8' });
    const url = root.URL.createObjectURL(blob);
    const filename = (TEST_MODE ? 'still-standing_test_' : 'still-standing_') +
      timestampForFile(new Date(Store.now())) + '.json';
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    root.setTimeout(function () { root.URL.revokeObjectURL(url); }, 3000);
    UI.toast('Файл сохранён: ' + filename, 'mint');
  }

  /* --------------------------------------------------- Импорт из файла --- */

  function importFromFile(file) {
    if (!file) return;
    if (file.size > 8 * 1024 * 1024) {
      UI.showMessage({
        title: 'Файл слишком большой', emoji: '🐘', humor: true,
        text: 'Резервная копия Still Standing весит куда меньше 8 МБ. Похоже, это не тот файл.'
      });
      return;
    }
    const reader = new root.FileReader();
    reader.onerror = function () { UI.toast('Не удалось прочитать файл', 'rose'); };
    reader.onload = function () {
      let parsed;
      try { parsed = JSON.parse(String(reader.result)); }
      catch (error) {
        UI.showMessage({
          title: 'Это не JSON', emoji: '🗿', humor: true,
          text: 'Файл не читается как JSON. Проверьте, что это именно резервная копия Still Standing.'
        });
        return;
      }
      const checked = Core.validateImportPayload(parsed, Store.now());
      if (!checked.ok) {
        UI.showMessage({
          title: 'Импорт не удался', emoji: '🚫',
          text: checked.errors.map(esc).join('<br>'), okLabel: 'Ладно'
        });
        return;
      }
      const summary = 'задач — ' + checked.state.tasks.length +
        ', наград — ' + checked.state.shop.length +
        ', классов — ' + checked.state.classes.list.length +
        ', уровень ' + checked.state.levelFloor +
        ', кошелёк ' + pointsLabel(checked.state.wallet);
      UI.confirmAction({
        title: 'Заменить данные?',
        text: 'Текущие задачи, награды, баллы, классы и титулы будут заменены данными из файла.<br><b>' +
          esc(file.name) + '</b>: ' + esc(summary) + '.' +
          (checked.warnings.length ? '<br><span class="field__hint">' + checked.warnings.map(esc).join('<br>') + '</span>' : ''),
        confirmLabel: 'Импортировать', tone: 'danger'
      }).then(function (confirmed) {
        if (!confirmed) return;
        if (Focus) Focus.stop();
        UI.hideFocusOverlay();
        Store.replaceState(checked.state);
        UI.toast('Данные импортированы', 'mint');
        offerLevelUp();
        if (Store.getView().classes.canChoose) root.setTimeout(function () { offerClassChoice(true); }, 100);
      });
    };
    reader.readAsText(file, 'utf-8');
  }

  /* -------------------------------------------------- Сброс в 04:00 --- */

  function announceReset(skipped) {
    UI.toast(skipped > 1
      ? 'Прошло несколько дней: галочки, счётчики и итоги фокуса обнулены'
      : 'Новый день по вашему времени: галочки и счётчики обнулены', 'mint');
  }

  function startResetWatcher() {
    root.setInterval(function () {
      const result = Store.checkDailyReset();
      if (result.changed) announceReset(result.skipped);
    }, RESET_TICK_MS);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) return;
      const result = Store.checkDailyReset();
      if (result.changed) announceReset(result.skipped);
    });
  }

  /* ---------------------------------------------- Проблемы с хранилищем --- */

  function reportLoadIssues(info) {
    if (!info || info.ok) return;
    if (info.reason === 'unavailable') {
      UI.showMessage({
        title: 'Данные не сохранятся', emoji: '💾', humor: true,
        text: 'Браузер не дал доступ к локальному хранилищу — так бывает в приватном режиме.<br>' +
          'Приложение работает, но после закрытия всё забудется. Сделайте экспорт вручную.'
      });
      return;
    }
    if (info.reason === 'corrupt') { UI.toast('Сохранение повреждено — начали с чистого листа', 'rose'); return; }
    if (info.reason === 'newer-schema') {
      UI.showMessage({
        title: 'Сохранение новее приложения', emoji: '🛠', humor: true,
        text: 'Данные сохранены более новой версией Still Standing.<br>Чтобы не потерять их, обновите файлы приложения.'
      });
      return;
    }
    if (info.reason === 'read-error') UI.toast('Не удалось прочитать сохранение', 'rose');
  }

  /* --------------------------------------- Демо-данные для скриншотов --- */

  function seedDemoIfRequested() {
    if (TEST_MODE) return;
    if (!/[?&]demo=1/.test(root.location.search)) return;
    const info = Store.getLoadInfo();
    if (!info || !info.fresh) return;
    const icon = function (value) { return { type: 'preset', value: value }; };
    const now = Store.now();
    Store.replaceState({
      schemaVersion: Core.SCHEMA_VERSION,
      profile: { name: 'Женя' },
      wallet: 45,
      xp: Core.xpForLevel(8),
      levelFloor: 8,
      levelPromptSkipped: 0,
      lastResetAt: Core.lastResetBoundary(now),
      classes: {
        mainId: 'careerist',
        activeId: 'careerist',
        list: [
          { id: 'careerist', kind: 'careerist', points: 534 },
          { id: 'kotik', kind: 'kotik', points: 50 }
        ]
      },
      tasks: [
        { id: 'demo_task_1', title: 'Зарядка 15 минут', desc: 'Разбудить тело, а не только телефон',
          points: 30, count: 1, minutes: 15, done: false, awarded: 0, icon: icon('dumbbell') },
        { id: 'demo_task_2', title: 'Прочитать 20 страниц', desc: 'Нон-фикшн, не ленту',
          points: 20, count: 2, minutes: 30, done: false, awarded: 0, icon: icon('book-open') },
        { id: 'demo_task_3', title: 'Разобрать стол', desc: 'Пять минут позора — и чистая поверхность',
          points: 35, count: 1, minutes: 10, done: false, awarded: 0, icon: icon('brush') },
        { id: 'demo_task_4', title: 'Прогулка 6000 шагов', desc: '',
          points: 30, count: 1, minutes: 45, done: false, awarded: 0, icon: icon('footprints') }
      ],
      shop: [
        { id: 'demo_item_1', title: 'Большой латте', desc: 'С сиропом и без чувства вины', price: 30, icon: icon('coffee') },
        { id: 'demo_item_2', title: 'Вечер без экрана', desc: 'Книга, плед, тишина', price: 45, icon: icon('moon') },
        { id: 'demo_item_3', title: 'Новая настолка', desc: 'Копим на большую коробку', price: 120, icon: icon('gamepad-2') }
      ],
      inventory: [
        { id: 'demo_stock_1', itemId: 'demo_item_x', title: 'Большой латте',
          desc: 'С сиропом и без чувства вины', price: 30, icon: icon('coffee'),
          boughtAt: now - 7200000, usedAt: now - 3600000 },
        { id: 'demo_stock_2', itemId: 'demo_item_y', title: 'Вечер без экрана',
          desc: 'Книга, плед, тишина', price: 45, icon: icon('moon'),
          boughtAt: now - 3600000, usedAt: 0 }
      ],
      notes: [
        { id: 'demo_note_1', title: 'Планы на неделю',
          text: 'Спокойно, без героизма: три задачи в день, один вечер без экрана и прогулка, даже если лень. Особенно если лень.',
          createdAt: now - 86400000, updatedAt: now - 3600000 }
      ],
      archive: [
        { id: 'demo_day_1', date: now - 2 * 86400000,
          tasks: [
            { title: 'Зарядка 15 минут', points: 30, count: 1, minutes: 15, awarded: 30 },
            { title: 'Прочитать 20 страниц', points: 20, count: 2, minutes: 30, awarded: 40 }
          ] }
      ],
      focus: {
        dayStart: Core.lastResetBoundary(now),
        focus: [25, 25, 10], rest: [15], touched: true,
        quote: 'Ещё 25 минут — и я молодец',
        focusMin: 25, restMin: 15, mode: 'focus'
      },
      ui: { active: 'ss', open: [], sections: { tasks: true, shop: true, inventory: true } },
      spentToday: 0
    }, { type: 'demo' });
  }

  /* ------------------------------------------------------------ Запуск --- */

  function wireFocusTimer() {
    if (!Focus) return;
    Focus.subscribe(function (timer, payload) {
      UI.updateFocusClock();
      if (payload && payload.type === 'ended') {
        Store.addFocusSession(payload.mode, payload.minutes);
        UI.showFocusOverlay(payload.mode, payload.minutes);
        UI.toast(payload.mode === 'rest'
          ? 'Отдых закончился. Как насчёт ещё одной фокусировки?'
          : 'Подход закончился: ' + payload.minutes + ' ' + Core.plural(payload.minutes, 'минута', 'минуты', 'минут') + ' в копилке.', 'mint');
      }
    });
  }

  function boot() {
    UI.init(handlers, { testMode: TEST_MODE });
    Store.subscribe(function (view) { UI.render(view); });
    Store.init(TEST_MODE
      ? { testMode: true, storageKey: Storage ? Storage.TEST_KEY : 'steel-standing/test-state' }
      : undefined);
    wireFocusTimer();

    reportLoadIssues(Store.getLoadInfo());
    startResetWatcher();

    if (TEST_MODE) {
      document.title = 'Still Standing Demo — тестовый режим';
      UI.render(Store.getView());
    } else {
      seedDemoIfRequested();
      UI.render(Store.getView());
      offerLevelUp();
      root.setTimeout(function () { offerClassChoice(); }, 120);
    }
    restoreNoteDraft();
    document.documentElement.setAttribute('data-app', 'ready');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
  <script>
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./service-worker.js').catch(function () {});
      });
    }
  </script>
