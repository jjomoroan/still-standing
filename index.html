<script data-source="js/storage.js">
/* ============================================================================
   Still Standing — работа с localStorage.
   Отвечает за: ключ хранения, миграции по schemaVersion, безопасную загрузку
   и сохранение, а также за понятные причины отказа.
   ============================================================================ */
(function (root, factory) {
  const api = factory(root);
  root.SteelStorage = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function (root) {
  'use strict';

  const Core = (typeof module !== 'undefined' && module.exports)
    ? require('./core.js')
    : root.SteelCore;

  const KEY = 'steel-standing/state';
  const TEST_KEY = 'steel-standing/test-state';

  /**
   * Миграции: функция под ключом N превращает данные версии N-1 в версию N.
   * 1 → 2: появились персональные титулы (titleOverrides) и иконка профиля
   * (avatarIcon). Переписывать старые данные не нужно — недостающие поля
   * создаёт Core.normalizeState, поэтому шаг только поднимает версию.
   * 2 → 3: повышение уровня подтверждается игроком (levelPromptSkipped).
   * Раньше уровень выводился из XP автоматически, поэтому у старых данных
   * достигнутый уровень фиксируем в levelFloor — иначе после обновления
   * уровень «упал» бы до последнего подтверждённого.
   * 3 → 4: внутренние вкладки (ui), инвентарь покупок (inventory), архив
   * 31 дня (archive), заметки (notes), ветки развития (branches) и траты
   * за сутки (spentToday). Все поля досоздаёт Core.normalizeState, поэтому
   * шаг только поднимает версию.
   * 4 → 5: вкладки всего приложения (ui.active / ui.open), ветки-классы 0…15,
   * фокус-сессии (focus) и лимит описания награды 54 символа. Старые вкладки
   * и ветки читаются в normalizeUi/normalizeClasses, поэтому шаг снова только
   * поднимает версию.
   * 5 → 6: классы стали отдельными ветками с активной веткой и 15 титулами,
   * появился базовый титул «Зарождающийся», старт с 1 уровня. Старые branches
   * и titleOverrides переносит normalizeState/normalizeClasses.
   * 6 → 7: у задачи появились выполненные подходы, разовость, время и зум UI.
   * Недостающие поля досоздаёт Core.normalizeState.
   */
  const MIGRATIONS = {
    /* 0 → 1: базовая схема; недостающие поля досоздаёт Core.normalizeState */
    1: function (data) { return data; },
    2: function (data) { return data; },
    3: function (data) {
      const source = data || {};
      const xp = Math.max(0, Math.floor(Number(source.xp) || 0));
      const floor = Math.max(0, Math.floor(Number(source.levelFloor) || 0));
      return Object.assign({}, source, {
        levelFloor: Math.max(floor, Core.levelFromXp(xp)),
        levelPromptSkipped: 0
      });
    },
    4: function (data) { return data; },
    5: function (data) { return data; },
    6: function (data) { return data; },
    7: function (data) { return data; }
  };

  /* Хранилище можно подменить в тестах (setBackend) */
  let backend;
  function getBackend() {
    if (backend !== undefined) return backend;
    try {
      backend = root.localStorage || null;
    } catch (error) {
      backend = null;
    }
    return backend;
  }

  function setBackend(custom) {
    backend = custom;
  }

  function resolveKey(storageKey) {
    return storageKey || KEY;
  }

  /** Доступно ли постоянное хранилище (в приватном режиме бывает запрещено). */
  function available(storageKey) {
    const key = resolveKey(storageKey);
    const store = getBackend();
    if (!store) return false;
    try {
      store.setItem(key + ':probe', '1');
      store.removeItem(key + ':probe');
      return true;
    } catch (error) {
      return false;
    }
  }

  /** Прогон данных по цепочке миграций до текущей версии схемы. */
  function migrate(raw) {
    const from = Number(raw && raw.schemaVersion) || 0;

    if (from > Core.SCHEMA_VERSION) {
      return { ok: false, reason: 'newer-schema', data: null, from: from, to: from };
    }

    let version = from;
    let current = raw;
    while (version < Core.SCHEMA_VERSION) {
      const step = MIGRATIONS[version + 1];
      if (typeof step !== 'function') break;
      /* Шаг работает с копией: исходные данные не мутируем */
      current = Object.assign({}, step(current));
      version += 1;
      current.schemaVersion = version;
    }
    return { ok: true, reason: null, data: current, from: from, to: version };
  }

  /**
   * Загрузка состояния.
   * Возвращает { ok, fresh, reason, state, migrations }.
   */
  function load(nowMs, storageKey) {
    const key = resolveKey(storageKey);
    const fresh = Core.createDefaultState(nowMs);

    if (!available(key)) {
      return { ok: false, fresh: true, reason: 'unavailable', state: fresh, migrations: 0 };
    }

    let text;
    try {
      text = getBackend().getItem(key);
    } catch (error) {
      return { ok: false, fresh: true, reason: 'read-error', state: fresh, migrations: 0 };
    }

    if (!text) return { ok: true, fresh: true, reason: null, state: fresh, migrations: 0 };

    let raw;
    try {
      raw = JSON.parse(text);
    } catch (error) {
      return { ok: false, fresh: true, reason: 'corrupt', state: fresh, migrations: 0 };
    }

    /* Данные могли сохранить и «голым» состоянием, и конвертом { state } */
    const payload = (raw && typeof raw === 'object' && raw.state && typeof raw.state === 'object')
      ? raw.state
      : raw;

    const migrated = migrate(payload);
    if (!migrated.ok) {
      return { ok: false, fresh: true, reason: migrated.reason, state: fresh, migrations: 0 };
    }

    return {
      ok: true,
      fresh: false,
      reason: null,
      state: Core.normalizeState(migrated.data, nowMs),
      migrations: Math.max(0, Core.SCHEMA_VERSION - migrated.from)
    };
  }

  /** Сохранение состояния. Возвращает { ok, reason }. */
  function save(state, storageKey) {
    const key = resolveKey(storageKey);
    if (!available(key)) return { ok: false, reason: 'unavailable' };
    try {
      getBackend().setItem(key, JSON.stringify(state));
      return { ok: true, reason: null };
    } catch (error) {
      const quota = error && (error.name === 'QuotaExceededError' || error.code === 22);
      return { ok: false, reason: quota ? 'quota' : 'write-error' };
    }
  }

  /** Полная очистка сохранённых данных. */
  function clear(storageKey) {
    const key = resolveKey(storageKey);
    if (!available(key)) return { ok: false, reason: 'unavailable' };
    try {
      getBackend().removeItem(key);
      return { ok: true, reason: null };
    } catch (error) {
      return { ok: false, reason: 'write-error' };
    }
  }

  /** Оценка занятого места в байтах (для отладки и предупреждений). */
  function usedBytes(storageKey) {
    const key = resolveKey(storageKey);
    if (!available(key)) return 0;
    try {
      const text = getBackend().getItem(key);
      return text ? text.length * 2 : 0;
    } catch (error) {
      return 0;
    }
  }

  return {
    KEY: KEY,
    TEST_KEY: TEST_KEY,
    resolveKey: resolveKey,
    MIGRATIONS: MIGRATIONS,
    available: available,
    setBackend: setBackend,
    migrate: migrate,
    load: load,
    save: save,
    clear: clear,
    usedBytes: usedBytes
  };
});

</script>
<script data-source="js/store.js">
/* ============================================================================
   Still Standing — состояние приложения.
   Тонкая обёртка над core.js: держит состояние, сохраняет в localStorage
   и сообщает подписчикам новый «срез» для отрисовки.
   ============================================================================ */
(function (root) {
  'use strict';

  const Core = root.SteelCore;
  const Storage = root.SteelStorage;

  let state = null;
  let loadInfo = null;
  let storageKey = Storage.KEY;
  let testMode = false;
  let clock = function () { return Date.now(); };
  const listeners = new Set();

  function setClock(fn) {
    clock = (typeof fn === 'function') ? fn : function () { return Date.now(); };
  }

  function now() { return clock(); }

  function emit(meta) {
    const view = Core.buildViewModel(state, now());
    const payload = meta || {};
    listeners.forEach(function (listener) {
      try {
        listener(view, payload);
      } catch (error) {
        console.error('Ошибка в подписчике состояния:', error);
      }
    });
    return view;
  }

  function init(options) {
    const opts = options || {};
    storageKey = opts.storageKey || Storage.KEY;
    testMode = Boolean(opts.testMode) || storageKey === Storage.TEST_KEY;
    loadInfo = Storage.load(now(), storageKey);
    const reset = Core.applyDailyReset(loadInfo.state, now());
    state = reset.state;
    saveState();
    return emit({ type: 'init', load: loadInfo, reset: reset.changed, testMode: testMode });
  }

  function saveState() { return Storage.save(state, storageKey); }

  function subscribe(listener) {
    listeners.add(listener);
    return function () { listeners.delete(listener); };
  }

  function getState() { return state; }
  function getView() { return Core.buildViewModel(state, now()); }
  function getLoadInfo() { return loadInfo; }
  function getStorageKey() { return storageKey; }
  function isTestMode() { return testMode; }

  function commit(result, type) {
    state = result.state;
    const saved = saveState();
    emit({ type: type, result: result, saved: saved });
    return result;
  }

  /* ---------------------------------------------------------- Задачи --- */

  function createTask(input) {
    return commit(Core.addTask(state, input), 'task-create');
  }

  function updateTaskById(id, patch) {
    return commit(Core.updateTask(state, id, patch), 'task-update');
  }

  function deleteTask(id) {
    return commit(Core.removeTask(state, id), 'task-delete');
  }

  function changeCount(id, delta) {
    const task = state.tasks.find(function (item) { return item.id === id; });
    if (!task) return { ok: false, reason: 'not-found', state: state };
    return commit(Core.setTaskCount(state, id, task.count + delta), 'task-count');
  }

  function changeCompleted(id, delta) {
    const task = state.tasks.find(function (item) { return item.id === id; });
    if (!task) return { ok: false, reason: 'not-found', state: state };
    return commit(Core.setTaskCompleted(state, id, task.completed + delta), 'task-completed');
  }

  function checkTask(id) {
    return commit(Core.checkTask(state, id, now()), 'task-check');
  }

  function uncheckTask(id) {
    return commit(Core.uncheckTask(state, id), 'task-uncheck');
  }

  /* -------------------------------------------------- Повышение уровня --- */

  function confirmLevelUp() {
    return commit(Core.confirmLevelUp(state), 'level-confirm');
  }

  function deferLevelUp() {
    return commit(Core.deferLevelUp(state), 'level-defer');
  }

  /* --------------------------------------------------------- Магазин --- */

  function createItem(input) {
    return commit(Core.addItem(state, input), 'item-create');
  }

  function updateItemById(id, patch) {
    return commit(Core.updateItem(state, id, patch), 'item-update');
  }

  function deleteItem(id) {
    return commit(Core.removeItem(state, id), 'item-delete');
  }

  function buyItem(id) {
    return commit(Core.buyItem(state, id, now()), 'item-buy');
  }

  /* ------------------------------------------------------ Инвентарь --- */

  function useInventory(id, used) {
    return commit(Core.useInventoryEntry(state, id, used, now()), 'inventory-use');
  }

  function deleteInventory(id) {
    return commit(Core.removeInventoryEntry(state, id), 'inventory-delete');
  }

  /* ------------------------------------------------- Вкладки и секции --- */

  function openTab(tab) {
    return commit(Core.openAppTab(state, tab), 'tab-open');
  }

  function activateTab(tab) {
    return commit(Core.activateAppTab(state, tab), 'tab');
  }

  function closeTab(tab) {
    return commit(Core.closeAppTab(state, tab), 'tab-close');
  }

  function toggleSection(section, open) {
    return commit(Core.setSectionOpen(state, section, open), 'section');
  }

  function setZoom(zoom) {
    return commit(Core.setUiZoom(state, zoom), 'zoom');
  }

  /* ---------------------------------------------------------- Заметки --- */

  function createNote(input) {
    return commit(Core.addNote(state, input, now()), 'note-create');
  }

  function updateNoteById(id, patch) {
    return commit(Core.updateNote(state, id, patch, now()), 'note-update');
  }

  function deleteNote(id) {
    return commit(Core.removeNote(state, id), 'note-delete');
  }

  /* -------------------------------------------------- Классы и титулы --- */

  function chooseMainClass(kind, customName) {
    return commit(Core.chooseMainClass(state, kind, customName), 'class-main');
  }

  function addSubclass(kind, customName) {
    return commit(Core.addSubclass(state, kind, customName), 'class-sub');
  }

  function setActiveClass(id) {
    return commit(Core.setActiveClass(state, id), 'class-active');
  }

  function updateClass(id, patch) {
    return commit(Core.updateClass(state, id, patch), 'class-update');
  }

  function removeClass(id) {
    return commit(Core.removeClass(state, id), 'class-remove');
  }

  /* --------------------------------------------------------- Профиль --- */

  function rename(name) {
    state = Core.renameProfile(state, name);
    const saved = saveState();
    return emit({ type: 'rename', saved: saved });
  }

  function saveAvatarIcon(icon) {
    return commit(Core.setAvatarIcon(state, icon), 'profile-avatar');
  }

  /* ----------------------------------------------------- Фокусировка --- */

  function setFocusMode(mode) {
    return commit(Core.setFocusMode(state, mode, now()), 'focus-mode');
  }

  function markFocusStarted() {
    return commit(Core.markFocusStarted(state, now()), 'focus-start');
  }

  function addFocusSession(mode, minutes) {
    return commit(Core.addFocusSession(state, mode, minutes, now()), 'focus-session');
  }

  function saveFocusSettings(settings) {
    return commit(Core.setFocusSettings(state, settings, now()), 'focus-settings');
  }

  function saveFocusQuote(quote) {
    return commit(Core.setFocusQuote(state, quote, now()), 'focus-quote');
  }

  /* --------------------------------------------- Импорт и служебные --- */

  function replaceState(next, meta) {
    state = Core.normalizeState(next, now());
    const saved = saveState();
    return emit(Object.assign({ type: 'import', saved: saved }, meta || {}));
  }

  /** Сброс тестовой песочницы в пустое состояние. Реальный профиль не трогает. */
  function resetToZero(meta) {
    state = Core.createDefaultState(now());
    const saved = saveState();
    return emit(Object.assign({ type: 'test-reset', saved: saved }, meta || {}));
  }

  function checkDailyReset() {
    const result = Core.applyDailyReset(state, now());
    if (!result.changed) return { changed: false, skipped: 0, archived: null };
    state = result.state;
    saveState();
    emit({ type: 'daily-reset', skipped: result.skipped, archived: result.archived });
    return { changed: true, skipped: result.skipped, archived: result.archived };
  }

  function exportPayload() {
    return Core.buildExportPayload(state, now());
  }

  root.SteelStore = {
    init: init,
    subscribe: subscribe,
    getState: getState,
    getView: getView,
    getLoadInfo: getLoadInfo,
    getStorageKey: getStorageKey,
    isTestMode: isTestMode,
    setClock: setClock,
    now: now,

    createTask: createTask,
    updateTaskById: updateTaskById,
    deleteTask: deleteTask,
    changeCount: changeCount,
    changeCompleted: changeCompleted,
    checkTask: checkTask,
    uncheckTask: uncheckTask,
    confirmLevelUp: confirmLevelUp,
    deferLevelUp: deferLevelUp,

    createItem: createItem,
    updateItemById: updateItemById,
    deleteItem: deleteItem,
    buyItem: buyItem,

    useInventory: useInventory,
    deleteInventory: deleteInventory,

    openTab: openTab,
    activateTab: activateTab,
    closeTab: closeTab,
    toggleSection: toggleSection,
    setZoom: setZoom,

    createNote: createNote,
    updateNoteById: updateNoteById,
    deleteNote: deleteNote,

    chooseMainClass: chooseMainClass,
    addSubclass: addSubclass,
    setActiveClass: setActiveClass,
    updateClass: updateClass,
    removeClass: removeClass,

    rename: rename,
    saveAvatarIcon: saveAvatarIcon,

    setFocusMode: setFocusMode,
    markFocusStarted: markFocusStarted,
    addFocusSession: addFocusSession,
    saveFocusSettings: saveFocusSettings,
    saveFocusQuote: saveFocusQuote,

    replaceState: replaceState,
    resetToZero: resetToZero,
    checkDailyReset: checkDailyReset,
    exportPayload: exportPayload
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script data-source="js/focus.js">
/* ============================================================================
   Still Standing — таймер фокусировки (Помодоро).
   Живёт отдельно от интерфейса: считает по отметкам времени, поэтому тикает
   ровно даже в фоновой вкладке и при переключении разделов. UI только читает
   состояние и подписывается на события.

   Режимы: mode = 'focus' | 'rest' | null.
   Завершённый подход отдаётся событием { type: 'ended', mode, minutes }.
   ============================================================================ */
(function (root) {
  'use strict';

  const MINUTE_MS = 60 * 1000;
  const TICK_MS = 250;

  let clock = function () { return Date.now(); };
  let timerId = null;
  const listeners = new Set();

  const state = {
    mode: null,       // 'focus' | 'rest' | null
    totalMs: 0,
    remainingMs: 0,   // остаток на момент последней паузы/старта
    startedAt: 0,     // когда побежал текущий отрезок
    running: false,
    ended: false,
    quote: ''
  };

  function now() { return clock(); }

  function emit(extra) {
    const payload = Object.assign({}, extra || {});
    const view = getState();
    listeners.forEach(function (listener) {
      try {
        listener(view, payload);
      } catch (error) {
        console.error('Ошибка в подписчике таймера:', error);
      }
    });
    return view;
  }

  function remainingNow() {
    if (!state.running) return Math.max(0, state.remainingMs);
    return Math.max(0, state.remainingMs - (now() - state.startedAt));
  }

  function getState() {
    const remaining = remainingNow();
    return {
      mode: state.mode,
      totalMs: state.totalMs,
      remainingMs: remaining,
      elapsedMs: Math.max(0, state.totalMs - remaining),
      running: state.running,
      ended: state.ended,
      quote: state.quote,
      hasTimer: Boolean(state.mode)
    };
  }

  function format(ms) {
    const total = Math.max(0, Math.ceil(Number(ms || 0) / 1000));
    const minutes = Math.floor(total / 60);
    const seconds = total % 60;
    return String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
  }

  function startTicker() {
    if (timerId != null) return;
    timerId = root.setInterval(tick, TICK_MS);
  }

  function stopTicker() {
    if (timerId == null) return;
    root.clearInterval(timerId);
    timerId = null;
  }

  function finish() {
    const mode = state.mode;
    const minutes = Math.max(1, Math.round(state.totalMs / MINUTE_MS));
    state.remainingMs = 0;
    state.running = false;
    state.ended = true;
    stopTicker();
    emit({ type: 'ended', mode: mode, minutes: minutes });
  }

  function tick() {
    if (!state.running) return;
    if (remainingNow() <= 0) {
      finish();
      return;
    }
    emit({ type: 'tick' });
  }

  /**
   * Запустить подход.
   * @param {'focus'|'rest'} mode
   * @param {number} minutes целые минуты (1…999)
   * @param {string} [quote] фраза-мотивация
   */
  function start(mode, minutes, quote) {
    const kind = mode === 'rest' ? 'rest' : 'focus';
    const value = Math.max(1, Math.floor(Number(minutes) || 1));
    state.mode = kind;
    state.totalMs = value * MINUTE_MS;
    state.remainingMs = state.totalMs;
    state.startedAt = now();
    state.running = true;
    state.ended = false;
    state.quote = String(quote == null ? '' : quote);
    startTicker();
    return emit({ type: 'start' });
  }

  /** Пауза: подход не разрывается, остаток сохраняется. */
  function pause() {
    if (!state.running) return getState();
    state.remainingMs = remainingNow();
    state.running = false;
    stopTicker();
    return emit({ type: 'pause' });
  }

  /** Продолжить после паузы. */
  function resume() {
    if (state.running || state.ended || !state.mode || state.remainingMs <= 0) return getState();
    state.startedAt = now();
    state.running = true;
    startTicker();
    return emit({ type: 'resume' });
  }

  /** Старт/пауза одной кнопкой. */
  function toggle(mode, minutes, quote) {
    if (state.running) return pause();
    if (state.mode && !state.ended && state.remainingMs > 0) return resume();
    return start(mode, minutes, quote);
  }

  /** Полный сброс: подход не записывается. */
  function stop() {
    const had = Boolean(state.mode);
    state.mode = null;
    state.totalMs = 0;
    state.remainingMs = 0;
    state.startedAt = 0;
    state.running = false;
    state.ended = false;
    state.quote = '';
    stopTicker();
    if (!had) return getState();
    return emit({ type: 'stop' });
  }

  /** Закрыть оверлей «время вышло» и обнулить таймер. */
  function dismiss() {
    return stop();
  }

  function subscribe(listener) {
    listeners.add(listener);
    return function () { listeners.delete(listener); };
  }

  /** Подмена часов — нужна автотестам. */
  function setClock(fn) {
    clock = (typeof fn === 'function') ? fn : function () { return Date.now(); };
    emit({ type: 'clock' });
  }

  root.SteelFocus = {
    MINUTE_MS: MINUTE_MS,
    start: start,
    pause: pause,
    resume: resume,
    toggle: toggle,
    stop: stop,
    dismiss: dismiss,
    getState: getState,
    format: format,
    subscribe: subscribe,
    setClock: setClock
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script data-source="js/profile-icons.js">
/* ============================================================================

<script data-source="js/upload.js">
/* ============================================================================
   Still Standing — загрузка своей иконки.
   Пользователь выбирает картинку, мы уменьшаем её до 128×128 через canvas
   и храним как data URL. Больше 200 КБ в состояние не пускаем.
   ============================================================================ */
(function (root) {
  'use strict';

  const MAX_BYTES = 200 * 1024;   // предел на одну иконку
  const MAX_SIDE = 128;           // сторона квадрата в пикселях
  const MAX_SOURCE_BYTES = 8 * 1024 * 1024; // исходник принимаем до 8 МБ

  function readAsDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new root.FileReader();
      reader.onload = () => resolve(String(reader.result));
      reader.onerror = () => reject(new Error('Не удалось прочитать файл.'));
      reader.readAsDataURL(file);
    });
  }

  function loadImage(dataUrl) {
    return new Promise((resolve, reject) => {
      const image = new root.Image();
      image.onload = () => resolve(image);
      image.onerror = () => reject(new Error('Файл не похож на изображение.'));
      image.src = dataUrl;
    });
  }

  /**
   * Готовит иконку из файла.
   * Возвращает Promise<{ ok, dataUrl, error, bytes }>.
   */
  async function readIconFile(file) {
    if (!file) return { ok: false, error: 'Файл не выбран.' };
    if (!/^image\//.test(file.type || '')) {
      return { ok: false, error: 'Нужен файл изображения: png, jpg, webp или gif.' };
    }
    if (file.size > MAX_SOURCE_BYTES) {
      return { ok: false, error: 'Картинка больше 8 МБ — выберите файл поменьше.' };
    }

    let image;
    try {
      image = await loadImage(await readAsDataUrl(file));
    } catch (error) {
      return { ok: false, error: error.message };
    }

    const canvas = document.createElement('canvas');
    canvas.width = MAX_SIDE;
    canvas.height = MAX_SIDE;
    const context = canvas.getContext('2d');
    if (!context) return { ok: false, error: 'Браузер не дал холст для обработки картинки.' };

    const scale = Math.min(MAX_SIDE / image.width, MAX_SIDE / image.height);
    const width = Math.max(1, Math.round(image.width * scale));
    const height = Math.max(1, Math.round(image.height * scale));
    context.drawImage(
      image,
      Math.round((MAX_SIDE - width) / 2),
      Math.round((MAX_SIDE - height) / 2),
      width,
      height
    );

    let dataUrl = canvas.toDataURL('image/png');
    if (approximateBytes(dataUrl) > MAX_BYTES) {
      dataUrl = canvas.toDataURL('image/jpeg', 0.85);
    }
    const bytes = approximateBytes(dataUrl);
    if (bytes > MAX_BYTES) {
      return { ok: false, error: 'Даже после сжатия картинка весит больше 200 КБ.' };
    }

    return { ok: true, dataUrl: dataUrl, bytes: bytes, error: null };
  }

  /** Приблизительный вес data URL в байтах. */
  function approximateBytes(dataUrl) {
    const comma = dataUrl.indexOf(',');
    const payload = comma === -1 ? dataUrl : dataUrl.slice(comma + 1);
    return Math.round((payload.length * 3) / 4);
  }

  root.SteelUpload = {
    MAX_BYTES: MAX_BYTES,
    MAX_SIDE: MAX_SIDE,
    readIconFile: readIconFile,
    approximateBytes: approximateBytes
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script data-source="js/ui.js">
/* ============================================================================
   Still Standing — слой интерфейса.
   ui.js только рисует данные и сообщает о действиях наружу через handlers.
   Вся арифметика — в core.js, состояние — в store.js.
   ============================================================================ */
(function (root) {
  'use strict';

  const Core = root.SteelCore;
  const Icons = root.SteelIcons;
  const ProfileIcons = root.SteelProfileIcons;

  let handlers = {};
  let lastView = null;
  let activeModal = null;
  let lastEndedMode = 'focus';
  let testMode = false;
  const elements = {};

  /* ------------------------------------------------------------ Хелперы --- */

  function $(id) { return document.getElementById(id); }

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function svgBody(body, width) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' +
      (width || '1.6') + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      body + '</svg>';
  }

  function iconMarkup(icon, family) {
    if (icon && icon.type === 'custom') {
      return '<img src="' + esc(icon.value) + '" alt="" />';
    }
    const source = family === 'profile' ? ProfileIcons : Icons;
    const entry = source.get(icon && icon.value);
    return entry ? svgBody(entry.body, '1.6') : '';
  }

  function glyph(id) {
    const entry = Icons.get(id);
    return entry ? svgBody(entry.body, '1.7') : '';
  }

  function el(tag, className, innerHTML) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (innerHTML != null) node.innerHTML = innerHTML;
    return node;
  }

  function pad2(value) {
    return String(value).padStart(2, '0');
  }

  function minutesWord(count) {
    return Core.plural(count, 'минута', 'минуты', 'минут');
  }

  /* --------------------------------------------------------- Инициализация --- */

  function init(userHandlers, options) {
    handlers = userHandlers || {};
    testMode = Boolean(options && options.testMode);
    document.documentElement.setAttribute('data-test-mode', testMode ? '1' : '0');

    elements.appWindow = $('appWindow');
    elements.profileAvatar = $('profileAvatar');
    elements.profileAvatarFace = $('profileAvatarFace');
    elements.profileName = $('profileName');
    elements.profileTitle = $('profileTitle');
    elements.profileRankValue = $('profileRankValue');
    elements.launchers = $('launchers');
    elements.appTabs = $('appTabs');
    elements.ssView = $('ssView');
    elements.focusView = $('focusView');
    elements.notesView = $('notesView');
    elements.archiveView = $('archiveView');
    elements.achievementsView = $('achievementsView');
    elements.tasksPanel = $('tasksPanel');
    elements.shopPanel = $('shopPanel');
    elements.inventoryPanel = $('inventoryPanel');
    elements.classesPanel = $('classesPanel');
    elements.modalRoot = $('modalRoot');
    elements.toastStack = $('toastStack');
    elements.importFile = $('importFile');
    elements.focusVeil = $('focusVeil');
    elements.focusVeilIcon = $('focusVeilIcon');
    elements.focusVeilKicker = $('focusVeilKicker');
    elements.focusVeilTitle = $('focusVeilTitle');
    elements.focusVeilText = $('focusVeilText');
    elements.focusVeilPrimary = $('focusVeilPrimary');
    elements.focusVeilStop = $('focusVeilStop');
    elements.testEntry = $('testEntry');
    elements.testModeBtn = $('testModeBtn');
    elements.testResetBtn = $('testResetBtn');
    elements.testBadge = $('testBadge');
    elements.zoomControl = $('zoomControl');
    elements.zoomValue = $('zoomValue');
    elements.noteMiniRoot = $('noteMiniRoot');
    if (elements.testEntry) elements.testEntry.hidden = testMode;
    if (elements.testResetBtn) elements.testResetBtn.hidden = !testMode;
    if (elements.testBadge) elements.testBadge.hidden = !testMode;

    wireToolbar();
    wireProfile();
    wireLaunchers();
    wireTabs();
    wireTasks();
    wireShop();
    wireInventory();
    wireClasses();
    wireNotes();
    wireAchievements();
    wireFocus();
    wireFocusVeil();
    wireTestMode();
    wireZoom();
    document.addEventListener('keydown', function (event) {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      const target = event.target;
      const toggle = target.closest && target.closest('[data-action="toggle-section"]');
      if (toggle && target === toggle) { event.preventDefault(); toggle.click(); return; }
      const choose = target.closest && target.closest('[data-action="choose-class"]');
      if (choose && target === choose) { event.preventDefault(); choose.click(); }
    });
  }

  function wireToolbar() {
    $('exportBtn').addEventListener('click', function () {
      if (handlers.exportData) handlers.exportData();
    });
    $('importBtn').addEventListener('click', function () {
      elements.importFile.value = '';
      elements.importFile.click();
    });
    elements.importFile.addEventListener('change', function () {
      const file = elements.importFile.files && elements.importFile.files[0];
      if (file && handlers.importFile) handlers.importFile(file);
    });
    $('helpBtn').addEventListener('click', function () { openFAQ(); });
  }

  function wireZoom() {
    if (!elements.zoomControl) return;
    elements.zoomControl.addEventListener('click', function (event) {
      const button = event.target.closest('[data-zoom]');
      if (!button || !lastView) return;
      const step = Number(button.getAttribute('data-zoom')) || 0;
      const current = Number(lastView.ui && lastView.ui.zoom) || 100;
      if (handlers.zoom) handlers.zoom(current + step * 25);
    });
    window.addEventListener('resize', function () {
      if (lastView) applyZoom(lastView);
    });
  }

  function wireTestMode() {
    if (elements.testModeBtn) {
      elements.testModeBtn.addEventListener('click', function () {
        if (handlers.testMode) handlers.testMode();
      });
    }
    if (elements.testResetBtn) {
      elements.testResetBtn.addEventListener('click', function () {
        if (handlers.testReset) handlers.testReset();
      });
    }
  }

  function wireProfile() {
    $('editNameBtn').addEventListener('click', function () {
      if (handlers.editName) handlers.editName();
    });
    elements.profileAvatar.addEventListener('click', function () {
      if (handlers.avatarEdit) handlers.avatarEdit();
    });
    /* Клик по имени ничего не делает — имя меняется только карандашом. */
  }

  function wireLaunchers() {
    elements.launchers.addEventListener('click', function (event) {
      const button = event.target.closest('[data-launcher]');
      if (!button) return;
      if (handlers.openLauncher) handlers.openLauncher(button.getAttribute('data-launcher'));
    });
  }

  function wireTabs() {
    elements.appTabs.addEventListener('click', function (event) {
      const close = event.target.closest('[data-tab-close]');
      if (close) {
        if (handlers.closeTab) handlers.closeTab(close.getAttribute('data-tab-close'));
        return;
      }
      const tab = event.target.closest('[data-tab]');
      if (!tab) return;
      if (handlers.openTab) handlers.openTab(tab.getAttribute('data-tab'));
    });
  }

  function wireTasks() {
    elements.tasksPanel.addEventListener('click', function (event) {
      const openArea = event.target.closest('[data-task-open]');
      if (openArea && !event.target.closest('button')) {
        const card = openArea.closest('[data-task-id]');
        if (card && handlers.taskOpen) handlers.taskOpen(card.getAttribute('data-task-id'));
        return;
      }
      const button = event.target.closest('[data-action]');
      if (!button) return;
      const action = button.getAttribute('data-action');
      if (action === 'toggle-section' && button.getAttribute('data-section') === 'tasks') {
        if (handlers.toggleSection) handlers.toggleSection('tasks');
        return;
      }
      if (action === 'add-task') { if (handlers.taskCreate) handlers.taskCreate(); return; }
      const card = button.closest('[data-task-id]');
      if (!card) return;
      const id = card.getAttribute('data-task-id');
      const task = lastView && lastView.tasks.find(function (item) { return item.id === id; });
      if (!task) return;
      if (action === 'task-check') {
        if (task.done) { if (handlers.taskUncheck) handlers.taskUncheck(id, button); }
        else if (task.oneTime) { if (handlers.taskCheckOneTime) handlers.taskCheckOneTime(id, button); }
        else if (handlers.taskCheck) handlers.taskCheck(id, button);
      }
      if (action === 'count-minus' && handlers.taskCompleted) handlers.taskCompleted(id, -1);
      if (action === 'count-plus' && handlers.taskCompleted) handlers.taskCompleted(id, 1);
      if (action === 'task-edit' && handlers.taskEdit) handlers.taskEdit(id);
      if (action === 'task-delete' && handlers.taskDelete) handlers.taskDelete(id);
    });
    elements.tasksPanel.addEventListener('keydown', function (event) {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      const openArea = event.target.closest('[data-task-open]');
      if (!openArea) return;
      event.preventDefault();
      const card = openArea.closest('[data-task-id]');
      if (card && handlers.taskOpen) handlers.taskOpen(card.getAttribute('data-task-id'));
    });
  }

  function wireShop() {
    elements.shopPanel.addEventListener('click', function (event) {
      const button = event.target.closest('[data-action]');
      if (button) {
        const action = button.getAttribute('data-action');
        if (action === 'toggle-section' && button.getAttribute('data-section') === 'shop') {
          if (handlers.toggleSection) handlers.toggleSection('shop');
          return;
        }
        if (action === 'add-item') { if (handlers.itemCreate) handlers.itemCreate(); return; }
        const card = button.closest('[data-item-id]');
        if (!card) return;
        const id = card.getAttribute('data-item-id');
        if (action === 'buy' && handlers.itemBuy) handlers.itemBuy(id, button);
        if (action === 'item-edit' && handlers.itemEdit) handlers.itemEdit(id);
        if (action === 'item-delete' && handlers.itemDelete) handlers.itemDelete(id);
        return;
      }
      const card = event.target.closest('[data-item-id]');
      if (card && handlers.itemOpen) handlers.itemOpen(card.getAttribute('data-item-id'));
    });
  }

  function wireInventory() {
    elements.inventoryPanel.addEventListener('click', function (event) {
      const button = event.target.closest('[data-action]');
      if (!button) return;
      const action = button.getAttribute('data-action');
      if (action === 'toggle-section' && button.getAttribute('data-section') === 'inventory') {
        if (handlers.toggleSection) handlers.toggleSection('inventory');
        return;
      }
      if (action === 'stock-use') {
        const card = button.closest('[data-stock-id]');
        if (card && handlers.stockUse) handlers.stockUse(card.getAttribute('data-stock-id'));
      }
    });
  }

  function wireClasses() {
    elements.classesPanel.addEventListener('click', function (event) {
      const button = event.target.closest('[data-action]');
      if (!button) return;
      const action = button.getAttribute('data-action');
      if (action === 'add-subclass') { if (handlers.addSubclass) handlers.addSubclass(); return; }
      if (action === 'choose-class') { if (handlers.chooseClass) handlers.chooseClass(); return; }
      const block = button.closest('[data-class-id]');
      if (!block) return;
      const id = block.getAttribute('data-class-id');
      if (action === 'class-active' && handlers.setActiveClass) handlers.setActiveClass(id);
      if (action === 'class-edit' && handlers.editClass) handlers.editClass(id);
      if (action === 'class-remove' && handlers.removeClass) handlers.removeClass(id);
    });
  }

  function wireNotes() {
    elements.notesView.addEventListener('click', function (event) {
      const button = event.target.closest('[data-action]');
      if (!button) return;
      const action = button.getAttribute('data-action');
      if (action === 'add-note') { if (handlers.noteCreate) handlers.noteCreate(); return; }
      const card = button.closest('[data-note-id]');
      if (!card) return;
      const id = card.getAttribute('data-note-id');
      if (action === 'note-edit' && handlers.noteEdit) handlers.noteEdit(id);
      if (action === 'note-delete' && handlers.noteDelete) handlers.noteDelete(id);
    });
  }

  function wireAchievements() {
    elements.achievementsView.addEventListener('click', function (event) {
      const card = event.target.closest('[data-achievement-id]');
      if (card && handlers.achievementOpen) handlers.achievementOpen(card.getAttribute('data-achievement-id'));
    });
  }

  /* ------------------------------------------------------------- Фокус --- */

  let lastEgg = { key: '', at: 0 };

  function wireFocus() {
    elements.focusView.addEventListener('click', function (event) {
      const button = event.target.closest('[data-action]');
      if (!button) return;
      const action = button.getAttribute('data-action');
      if (action === 'focus-mode' && handlers.focusMode) handlers.focusMode(button.getAttribute('data-mode'));
      if (action === 'focus-start' && handlers.focusStart) handlers.focusStart(readFocusForm());
      if (action === 'focus-pause' && handlers.focusPause) handlers.focusPause();
      if (action === 'focus-stop' && handlers.focusStop) handlers.focusStop();
    });

    elements.focusView.addEventListener('input', function (event) {
      const field = event.target;
      if (!field || !field.id) return;
      if (field.id === 'focusMinutes') showLimitEgg('focus', Number(field.value));
      if (field.id === 'restMinutes') showLimitEgg('rest', Number(field.value));
    });

    elements.focusView.addEventListener('change', function (event) {
      const field = event.target;
      if (!field || !field.id) return;
      if (field.id === 'focusMinutes' || field.id === 'restMinutes') {
        if (handlers.focusSettings) handlers.focusSettings(readFocusForm());
      }
      if (field.id === 'focusQuote' && handlers.focusQuote) handlers.focusQuote(field.value);
    });
  }

  function readFocusForm() {
    const focusInput = $('focusMinutes');
    const restInput = $('restMinutes');
    const quoteInput = $('focusQuote');
    return {
      focusMin: focusInput ? Number(focusInput.value) : 25,
      restMin: restInput ? Number(restInput.value) : 15,
      quote: quoteInput ? quoteInput.value : ''
    };
  }

  function showLimitEgg(field, value) {
    if (!Number.isFinite(value)) return;
    const now = Date.now();
    const key = field + ':' + value;
    if (lastEgg.key === key && now - lastEgg.at < 5000) return;
    if (field === 'focus' && value > 60) {
      lastEgg = { key: key, at: now };
      toast('Такое время фокусировки неэффективно, так говорит создатель. ' +
        'Фокусируемся не больше часа, бе-бе-бе!', 'amber');
    }
    if (field === 'rest' && value > 60 && value <= 90) {
      lastEgg = { key: key, at: now };
      toast('Правильно! Чем больше, тем лучше! Отдых — это важно.', 'mint');
    }
    if (field === 'rest' && value > 90) {
      lastEgg = { key: key, at: now };
      toast('Не, ну это уже перебор. Отдохни полтора часа и возвращайся!', 'amber');
    }
  }

  function wireFocusVeil() {
    elements.focusVeilPrimary.addEventListener('click', function () {
      if (handlers.focusOverlayPrimary) handlers.focusOverlayPrimary();
    });
    elements.focusVeilStop.addEventListener('click', function () {
      if (handlers.focusOverlayStop) handlers.focusOverlayStop();
    });
  }

  /* ------------------------------------------------------------- Отрисовка --- */

  function render(view) {
    lastView = view;
    renderChrome(view);
    renderProfile(view);
    renderTasks(view);
    renderShop(view);
    renderInventory(view);
    renderClasses(view);
    renderFocus(view);
    renderNotes(view);
    renderArchive(view);
    renderAchievements(view);

    const active = view.tabs.active;
    elements.ssView.hidden = active !== 'ss';
    elements.focusView.hidden = active !== 'focus';
    elements.notesView.hidden = active !== 'notes';
    elements.archiveView.hidden = active !== 'archive';
    elements.achievementsView.hidden = active !== 'achievements';

    applyZoom(view);
    updateFocusClock();
    scrollTitlesToCurrent();
    applyTextFades();
    document.documentElement.setAttribute('data-app', 'ready');
  }

  /** Прокрутить горизонтальные списки титулов к текущему титулу. */
  function scrollTitlesToCurrent() {
    if (typeof root.requestAnimationFrame !== 'function') return;
    root.requestAnimationFrame(function () {
      document.querySelectorAll('.titles-track').forEach(function (track) {
        if (!track.offsetParent) return;
        const current = track.querySelector('.title-card.is-current');
        if (!current) return;
        const left = current.offsetLeft;
        const right = left + current.offsetWidth;
        if (left < track.scrollLeft || right > track.scrollLeft + track.clientWidth) {
          track.scrollLeft = Math.max(0, left - (track.clientWidth - current.offsetWidth) / 2);
        }
      });
    });
  }

  function applyZoom(view) {
    const zoom = Number(view.ui && view.ui.zoom) || 100;
    const isPhone = window.matchMedia && window.matchMedia('(max-width: 700px)').matches;
    const effective = isPhone ? 100 : zoom;
    document.documentElement.style.setProperty('--ui-zoom', String(effective / 100));
    document.documentElement.setAttribute('data-zoom', String(zoom));
    if (elements.zoomValue) elements.zoomValue.textContent = String(zoom);
    if (elements.zoomControl) {
      const down = elements.zoomControl.querySelector('[data-zoom="-1"]');
      const up = elements.zoomControl.querySelector('[data-zoom="1"]');
      if (down) down.disabled = zoom <= 50;
      if (up) up.disabled = zoom >= 150;
    }
  }

  function renderChrome(view) {
    const timer = root.SteelFocus ? root.SteelFocus.getState() : { hasTimer: false };
    const tabs = view.tabs.list;
    const focusTab = tabs.find(function (tab) { return tab.id === 'focus'; });
    const focusOpen = Boolean(focusTab && focusTab.open);
    const focusLabel = !focusOpen && timer.hasTimer
      ? (timer.running ? 'Фокус идет' : 'Фокус на паузе')
      : 'Фокусировка';

    const defs = [
      { id: 'focus', label: focusLabel, icon: 'timer', active: view.tabs.active === 'focus', running: !focusOpen && timer.hasTimer },
      { id: 'notes', label: 'Заметки', icon: 'notebook-pen', active: view.tabs.active === 'notes' },
      { id: 'archive', label: 'Архив', icon: 'calendar-check', active: view.tabs.active === 'archive' },
      { id: 'achievements', label: 'Ачивки', icon: 'trophy', active: view.tabs.active === 'achievements' }
    ];

    elements.launchers.innerHTML = defs.map(function (item) {
      return '<button class="launcher' + (item.active ? ' is-active' : '') +
        (item.running ? ' is-running' : '') + '" type="button" data-launcher="' + item.id + '" ' +
        'title="' + esc(item.id === 'focus' ? 'Да-да, это фокусировка' : 'Открыть раздел') + '">' +
        glyph(item.icon) + '<span>' + esc(item.label) + '</span></button>';
    }).join('');

    const openTabs = tabs.filter(function (tab) { return tab.open; });
    elements.appTabs.innerHTML = openTabs.map(function (tab) {
      const isFocus = tab.id === 'focus';
      const label = isFocus && timer.hasTimer
        ? '[' + root.SteelFocus.format(timer.remainingMs) + ']'
        : tab.label;
      return '<span class="tab' + (tab.active ? ' is-active' : '') +
        (tab.open ? ' is-open' : '') + (tab.pinned ? ' is-pinned' : '') + '" ' +
        (tab.active ? 'aria-current="page"' : '') + '>' +
        '<button class="tab__label-btn" type="button" data-tab="' + esc(tab.id) + '" ' +
          'title="' + esc(tab.title) + '">' +
          (tab.pinned ? glyph('shield') : '') +
          '<span class="tab__label' + (isFocus ? ' tab__label--timer' : '') + '">' + esc(label) + '</span>' +
        '</button>' +
        (tab.pinned ? '' : '<button class="tab__x" type="button" data-tab-close="' + esc(tab.id) + '" ' +
          'title="Закрыть вкладку (таймер останется в фоне)" aria-label="Закрыть вкладку ' + esc(tab.label) + '">' +
          glyph('x') + '</button>') +
        '</span>';
    }).join('');
  }

  function renderProfile(view) {
    const name = view.profile.displayName;
    elements.profileName.textContent = name;
    elements.profileName.classList.toggle('is-placeholder', !view.profile.hasName);

    const avatar = view.profile.avatarIcon;
    if (avatar) {
      elements.profileAvatarFace.innerHTML = iconMarkup(avatar, 'profile');
      elements.profileAvatar.classList.add('has-icon');
    } else {
      elements.profileAvatarFace.textContent = view.profile.hasName
        ? (view.profile.name.trim().charAt(0).toUpperCase() || 'S')
        : 'S';
      elements.profileAvatar.classList.remove('has-icon');
    }

    elements.profileRankValue.textContent = String(view.profile.level);

    let line = view.profile.hasName ? 'Игрок <b>' + esc(view.profile.name) + '</b>' : 'Игрок';
    line += ', титул — <em>' + esc(view.profile.titleName) + '</em>';
    if (!view.profile.hasClass) {
      if (view.profile.level < 2) {
        line += ', до выбора ветки ' + view.profile.pointsToNextTitle + ' ' +
          Core.pointsWord(view.profile.pointsToNextTitle);
      } else {
        line += ', пора выбрать ветку';
      }
    } else if (view.profile.nextTitleName) {
      line += ', до титула <em>' + esc(view.profile.nextTitleName) + '</em> ' +
        view.profile.pointsToNextTitle + ' ' + Core.pointsWord(view.profile.pointsToNextTitle);
    } else {
      line += ', максимальный титул ветки';
    }
    elements.profileTitle.innerHTML = line + '.';
  }

  /* ------------------------------------------------------------- Задачи --- */

  function sectionHead(title, icon, count, addAction, addLabel, section, open, extra) {
    return '' +
      '<div class="acc__head" data-action="toggle-section" data-section="' + esc(section) + '" ' +
        'role="button" tabindex="0" title="Нажмите, чтобы свернуть или открыть">' +
        '<span class="acc__title">' + glyph(icon) + esc(title) + '</span>' +
        '<span class="acc__count">' + esc(count) + '</span>' +
        (extra || '') +
        '<span class="acc__spacer"></span>' +
        (addAction
          ? '<button class="acc__add" type="button" data-action="' + addAction + '" ' +
              'title="' + esc(addLabel) + '">' + glyph('plus') + esc(addLabel) + '</button>'
          : '') +
        '<svg class="acc__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m6 9 6 6 6-6"/></svg>' +
      '</div>';
  }

  function emptyState(icon, title, text) {
    return '<div class="empty"><span class="empty__icon">' + glyph(icon) + '</span>' +
      '<span class="empty__title">' + esc(title) + '</span>' +
      '<span class="empty__text">' + esc(text) + '</span></div>';
  }

  function taskRow(task) {
    const done = task.done;
    const completed = Math.max(0, Math.min(Number(task.completed) || 0, task.count));
    const minusDisabled = done || completed <= 0 ? ' disabled' : '';
    const plusDisabled = done || completed >= task.count ? ' disabled' : '';
    const checkDisabled = !done && completed <= 0 ? ' disabled' : '';
    const timeText = task.minutes ? task.minutes + ' мин' : '—';
    const descText = task.desc ? task.desc.replace(/\s+/g, ' ').trim() : '';
    return '' +
      '<article class="task' + (done ? ' is-done' : '') + (task.oneTime ? ' is-one-time' : '') + '" data-task-id="' + esc(task.id) + '">' +
        '<button class="task__check' + (done ? ' is-checked' : '') + '" type="button" data-action="task-check" ' +
          'aria-pressed="' + done + '"' + checkDisabled + ' title="' +
          esc(done ? 'Снять отметку: баллы вернутся' : (completed <= 0 ? 'Сначала добавьте выполненный подход кнопкой +' : 'Отметить выполненной')) + '">' +
          glyph('check') + '</button>' +
        '<div class="task__main" data-task-open role="button" tabindex="0" title="Открыть карточку задачи">' +
          '<h3 class="task__title">' + esc(task.title) + '</h3>' +
          (descText ? '<p class="task__desc is-faded" title="' + esc(task.desc) + '">' + esc(descText) + '</p>' : '') +
          '<div class="task__meta">' +
            '<span class="task__points">+' + task.points + ' за подход</span>' +
            '<span class="task__time" title="Ориентир по времени">' + glyph('clock') + esc(timeText) + '</span>' +
            '<span class="counter" title="Сколько подходов уже выполнено">' +
              '<button class="counter__btn" type="button" data-action="count-minus"' + minusDisabled +
                ' title="Убрать выполненный подход" aria-label="Убрать выполненный подход">' + glyph('minus') + '</button>' +
              '<span class="counter__value">' + completed + '</span>' +
              '<button class="counter__btn" type="button" data-action="count-plus"' + plusDisabled +
                ' title="Добавить выполненный подход" aria-label="Добавить выполненный подход">' + glyph('plus') + '</button>' +
            '</span>' +
            '<span class="task__total">итого +' + task.award + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="task__side">' +
          '<div class="task__actions">' +
            '<button class="icon-btn" type="button" data-action="task-edit" title="Изменить задачу" aria-label="Изменить задачу">' + glyph('pencil') + '</button>' +
            '<button class="icon-btn icon-btn--danger" type="button" data-action="task-delete" title="Удалить задачу (баллы останутся)" aria-label="Удалить задачу">' + glyph('trash-2') + '</button>' +
          '</div>' +
        '</div>' +
      '</article>';
  }

  function taskGroup(label, tasks) {
    if (!tasks.length) return '';
    return '<section class="task-group"><div class="task-group__head">' +
      '<span>' + esc(label) + '</span><span class="task-group__count">' + tasks.length + '</span>' +
      '</div>' + tasks.map(taskRow).join('') + '</section>';
  }

  function renderTasks(view) {
    const open = view.sections.tasks;
    const head = sectionHead('Задачи', 'list-checks', String(view.meta.taskCount),
      'add-task', 'задача', 'tasks', open);
    const multi = view.tasks.filter(function (task) { return !task.oneTime; });
    const single = view.tasks.filter(function (task) { return task.oneTime; });
    let body = '';
    if (view.tasks.length) {
      body = taskGroup('Многоразовые', multi) + taskGroup('Разовые', single);
    } else {
      body = emptyState('list-checks', 'Список пуст', 'Добавьте первое дело — баллы пойдут в кошелёк, уровень и активную ветку.');
    }
    elements.tasksPanel.className = 'accordion' + (open ? ' is-open' : '');
    elements.tasksPanel.innerHTML = head + '<div class="acc__body"' + (open ? '' : ' hidden') + '>' + body + '</div>';
  }

  /* ------------------------------------------------------------- Магазин --- */

  function shopCard(item) {
    return '' +
      '<article class="shop-card' + (item.affordable ? '' : ' is-locked') + '" data-item-id="' + esc(item.id) + '" ' +
        'title="' + esc('Открыть карточку: ' + (item.desc || item.title)) + '">' +
        '<div class="shop-card__top">' +
          '<span class="shop-card__icon">' + iconMarkup(item.icon) + '</span>' +
          '<div class="shop-card__head">' +
            '<h3 class="shop-card__title">' + esc(item.title) + '</h3>' +
            (item.desc ? '<p class="shop-card__desc is-faded">' + esc(item.desc) + '</p>' : '') +
          '</div>' +
        '</div>' +
        '<div class="shop-card__foot">' +
          '<span class="shop-card__price">' + item.price + ' ' + Core.pointsWord(item.price) + '</span>' +
          '<div class="shop-card__tools">' +
            '<button class="icon-btn" type="button" data-action="item-edit" title="Изменить награду" aria-label="Изменить награду">' + glyph('pencil') + '</button>' +
            '<button class="icon-btn icon-btn--danger" type="button" data-action="item-delete" title="Удалить награду" aria-label="Удалить награду">' + glyph('trash-2') + '</button>' +
          '</div>' +
        '</div>' +
        '<button class="btn btn--gold btn--sm shop-card__buy" type="button" data-action="buy" title="Купить: спишется только кошелёк">Купить</button>' +
      '</article>';
  }

  function renderShop(view) {
    const open = view.sections.shop;
    const head = sectionHead('Магазин', 'shopping-bag', String(view.meta.shopCount),
      'add-item', 'товар', 'shop', open,
      '<span class="acc__wallet" title="Кошелёк: доступно для трат">кошелёк ' +
        view.progress.wallet + ' ' + Core.pointsWord(view.progress.wallet) + '</span>');
    const body = view.shop.length
      ? '<div class="shop-grid">' + view.shop.map(shopCard).join('') + '</div>'
      : emptyState('shopping-bag', 'Витрина пуста', 'Добавьте награду — то, за что не жалко потратить баллы. Идеи подставим сами.');
    elements.shopPanel.className = 'accordion' + (open ? ' is-open' : '');
    elements.shopPanel.innerHTML = head + '<div class="acc__body"' + (open ? '' : ' hidden') + '>' + body + '</div>';
  }

  /* ----------------------------------------------------------- Инвентарь --- */

  function stockRow(entry) {
    return '' +
      '<div class="stock-row" data-stock-id="' + esc(entry.id) + '">' +
        '<span class="stock-row__icon">' + iconMarkup(entry.icon) + '</span>' +
        '<span class="stock-row__text">' +
          '<span class="stock-row__title">' + esc(entry.title) + '</span>' +
          '<span class="stock-row__desc">' + esc(entry.desc || 'без описания') + '</span>' +
        '</span>' +
        '<span class="stock-row__price">' + entry.price + ' ' + Core.pointsWord(entry.price) + '</span>' +
        '<button class="btn btn--ghost btn--sm" type="button" data-action="stock-use" title="Использовано: награда переедет в Ачивки">Использовано</button>' +
      '</div>';
  }

  function renderInventory(view) {
    const open = view.sections.inventory;
    const head = sectionHead('Инвентарь', 'gift', view.stock.length + ' в запасе',
      null, null, 'inventory', open);
    const body = view.stock.length
      ? view.stock.map(stockRow).join('')
      : '<p class="field__hint">Здесь пока пусто. Купите награду на витрине — и она появится тут.</p>';
    elements.inventoryPanel.className = 'accordion' + (open ? ' is-open' : '');
    elements.inventoryPanel.innerHTML = head + '<div class="acc__body"' + (open ? '' : ' hidden') + '>' + body + '</div>';

  /* --------------------------------------------------- Классы и титулы --- */

  function titleCard(title) {
    return '' +
      '<article class="title-card' + (title.earned ? ' is-earned' : '') +
        (title.current ? ' is-current' : '') + '" title="' + esc(title.name + ' · ' + title.lore) + '">' +
        '<div class="title-card__head">' +
          '<span class="title-card__level">' + pad2(title.level) + '</span>' +
          '<span class="title-card__name">' + esc(title.name) + '</span>' +
        '</div>' +
        '<p class="title-card__lore">' + esc(title.lore) + '</p>' +
      '</article>';
  }

  function classBlock(branch) {
    const active = branch.active;
    const sub = !branch.main;
    const playTitle = active ? 'Эта ветка уже прокачивается' : 'Выбрать для прокачки';
    const trashTitle = branch.main ? 'Основную ветку нельзя удалить в демо' : 'Удалить ветвь';
    return '' +
      '<section class="class-block' + (active ? ' is-active' : '') + (sub ? ' is-sub' : '') + '" data-class-id="' + esc(branch.id) + '">' +
        '<div class="class-row">' +
          '<span class="class-name">' + esc(branch.name) + '</span>' +
          '<span class="class-badge' + (sub ? ' class-badge--sub' : '') + '">' +
            (active ? 'активна' : (sub ? 'подкласс' : 'основная')) + '</span>' +
          '<span class="class-points">' + branch.points + ' ' + Core.pointsWord(branch.points) + '</span>' +
          '<span class="class-step">ступень ' + branch.level + ' / 15</span>' +
          '<span class="class-spacer"></span>' +
          '<div class="class-actions">' +
            '<button class="icon-btn" type="button" data-action="class-edit" title="Изменить титулы и описания" aria-label="Изменить титулы">' + glyph('pencil') + '</button>' +
            '<button class="icon-btn' + (active ? ' icon-btn--active' : '') + '" type="button" data-action="class-active" ' +
              (active ? 'disabled ' : '') + 'title="' + esc(playTitle) + '" aria-label="' + esc(playTitle) + '">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="m10 9 5 3-5 3z"/></svg>' +
            '</button>' +
            '<button class="icon-btn icon-btn--danger" type="button" data-action="class-remove" ' +
              (branch.main ? 'disabled ' : '') + 'title="' + esc(trashTitle) + '" aria-label="' + esc(trashTitle) + '">' + glyph('trash-2') + '</button>' +
          '</div>' +
        '</div>' +
        '<div class="titles-track">' + branch.titles.map(titleCard).join('') + '</div>' +
      '</section>';
  }

  function renderClasses(view) {
    const classes = view.classes;
    const list = classes.list || [];
    const addTitle = classes.canAddSubclass
      ? 'Добавить подкласс: выберите ещё одну ветку'
      : classes.addSubclassReason || 'Подкласс пока недоступен';
    const head = '' +
      '<div class="classes__head">' +
        '<h2 class="classes__title">Классы и титулы</h2>' +
        '<span class="classes__sub">ваш прогресс по классам, подклассам и титулам</span>' +
        '<span class="classes__spacer"></span>' +
        '<button class="class-add" type="button" data-action="add-subclass"' +
          (classes.canAddSubclass ? '' : ' disabled') + ' title="' + esc(addTitle) + '">' +
          glyph('plus') + 'подкласс</button>' +
      '</div>';

    let body = '';
    if (!list.length) {
      const clickable = classes.canChoose;
      body = '<div class="classes-empty' + (clickable ? ' is-clickable' : '') + '"' +
        (clickable ? ' data-action="choose-class" role="button" tabindex="0"' : '') + ' ' +
        'title="' + esc(clickable ? 'Открыть выбор ветки' : 'Ветка появится на 2 уровне') + '">' +
        '<span class="classes-empty__mark">' + glyph('compass') + '</span>' +
        '<span>' + (clickable
          ? 'Пора выбрать ветку. Нажмите, чтобы открыть выбор.'
          : 'Ветка появится на 2 уровне — сначала накопите 10 баллов.') + '</span></div>';
    } else {
      body = list.map(classBlock).join('');
    }
    elements.classesPanel.innerHTML = head + body;
  }

  /* ------------------------------------------------------------- Фокус --- */

  const RING_RADIUS = 130;
  const RING_CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS;

  function focusRing(ratio) {
    const clamped = Math.max(0, Math.min(1, Number(ratio) || 0));
    const offset = Math.round(RING_CIRCUMFERENCE * (1 - clamped) * 100) / 100;
    return '' +
      '<div class="focus-ring">' +
        '<svg viewBox="0 0 300 300" aria-hidden="true">' +
          '<defs><linearGradient id="focusGold" x1="0" y1="0" x2="1" y2="1">' +
            '<stop offset="0" stop-color="#F0D9A3"/><stop offset=".55" stop-color="#C6A15B"/><stop offset="1" stop-color="#8C6A36"/>' +
          '</linearGradient></defs>' +
          '<circle class="focus-ring__track" cx="150" cy="150" r="' + RING_RADIUS + '"/>' +
          '<circle class="focus-ring__value" id="focusRingValue" cx="150" cy="150" r="' + RING_RADIUS + '" ' +
            'stroke="url(#focusGold)" stroke-dasharray="' + (Math.round(RING_CIRCUMFERENCE * 100) / 100) + '" ' +
            'stroke-dashoffset="' + offset + '"/>' +
        '</svg>' +
        '<div class="focus-clock">' +
          '<span class="focus-clock__time" id="focusClock">25:00</span>' +
          '<span class="focus-clock__mode" id="focusMode">фокус</span>' +
        '</div>' +
      '</div>';
  }

  function sessionLines(list) {
    if (!list.length) return '<span class="focus-session focus-session--empty">пока ни одного</span>';
    return list.map(function (min) {
      return '<span class="focus-session">' + min + ' ' + minutesWord(min) + '</span>';
    }).join('');
  }

  function renderFocus(view) {
    const focus = view.focus;
    const timer = root.SteelFocus ? root.SteelFocus.getState() : {
      hasTimer: false, running: false, ended: false, remainingMs: 0, mode: null, totalMs: 0
    };
    const mode = timer.mode || focus.mode;
    const idleMinutes = mode === 'rest' ? focus.restMin : focus.focusMin;
    const ratio = timer.hasTimer && timer.totalMs > 0 ? timer.remainingMs / timer.totalMs : 1;
    const clock = timer.hasTimer
      ? root.SteelFocus.format(timer.remainingMs)
      : pad2(idleMinutes) + ':00';
    const modeLabel = timer.hasTimer ? (mode === 'rest' ? 'отдых' : 'фокус') : 'готовность';
    const startLabel = timer.hasTimer && !timer.running && !timer.ended && timer.remainingMs > 0
      ? 'Продолжить'
      : 'Старт';

    const quoteBlock = timer.hasTimer
      ? '<p class="focus-quote is-active" title="Ваша фраза-мотивация">' +
          (focus.quote ? '«' + esc(focus.quote) + '»' : '«Тишина — тоже мотивация.»') + '</p>'
      : '<label class="focus-quote-field">' +
          '<span class="field__label">место чтобы себя подбодрить</span>' +
          '<input class="input focus-quote-input" id="focusQuote" type="text" maxlength="' + view.meta.quoteMax + '" ' +
            'placeholder="Например: ещё 25 минут — и я молодец" value="' + esc(focus.quote) + '" ' +
            'title="До ' + view.meta.quoteMax + ' символов" />' +
        '</label>';

    const totals = focus.touched
      ? '<div class="focus-totals">' +
          '<div class="focus-total" title="Сумма подходов фокусировки за локальный день">' +
            '<div class="focus-total__label">Фокусировка</div>' +
            '<div class="focus-total__value">' + focus.totalFocus + '<small>мин</small></div>' +
            '<div class="focus-session-list">' + sessionLines(focus.focus) + '</div>' +
          '</div>' +
          '<div class="focus-total" title="Сумма подходов отдыха за локальный день">' +
            '<div class="focus-total__label">Отдых</div>' +
            '<div class="focus-total__value">' + focus.totalRest + '<small>мин</small></div>' +
            '<div class="focus-session-list">' + sessionLines(focus.rest) + '</div>' +
          '</div>' +
        '</div>'
      : '<p class="focus-totals-empty">Итоги дня появятся после первого старта. В 04:00 они обнулятся — и можно начать заново.</p>';

    elements.focusView.innerHTML = '' +
      '<div class="focus-stage">' +
        focusRing(ratio).replace('id="focusClock">25:00', 'id="focusClock">' + clock) +
        '<div class="focus-controls">' +
          '<div class="focus-field">' +
            '<div>' +
              '<div class="focus-field__label">Время фокусировки</div>' +
              '<div class="focus-modes">' +
                '<button class="focus-mode-btn' + (mode === 'focus' ? ' is-active' : '') + '" type="button" ' +
                  'data-action="focus-mode" data-mode="focus"' + (timer.hasTimer ? ' disabled' : '') + ' title="Поставить в круг время фокусировки">Сейчас фокусируемся</button>' +
              '</div>' +
            '</div>' +
            '<div class="focus-field__value">' +
              '<input class="focus-field__input" id="focusMinutes" type="number" min="1" max="' + view.meta.focusMax + '" ' +
                'value="' + focus.focusMin + '"' + (timer.hasTimer ? ' disabled' : '') + ' title="Максимум ' + view.meta.focusMax + ' минут" />' +
              '<span class="focus-field__unit">мин</span>' +
            '</div>' +
          '</div>' +
          '<div class="focus-field">' +
            '<div>' +
              '<div class="focus-field__label">Время отдыха</div>' +
              '<div class="focus-modes">' +
                '<button class="focus-mode-btn' + (mode === 'rest' ? ' is-active' : '') + '" type="button" ' +
                  'data-action="focus-mode" data-mode="rest"' + (timer.hasTimer ? ' disabled' : '') + ' title="Поставить в круг время отдыха">Сейчас отдыхаем</button>' +
              '</div>' +
            '</div>' +
            '<div class="focus-field__value">' +
              '<input class="focus-field__input" id="restMinutes" type="number" min="1" max="' + view.meta.restMax + '" ' +
                'value="' + focus.restMin + '"' + (timer.hasTimer ? ' disabled' : '') + ' title="До ' + view.meta.restMax + ' минут" />' +
              '<span class="focus-field__unit">мин</span>' +
            '</div>' +
          '</div>' +
          '<div class="focus-actions">' +
            '<button class="btn btn--gold" type="button" data-action="focus-start" title="Запустить или продолжить таймер"' + (timer.running ? ' disabled' : '') + '>' + startLabel + '</button>' +
            '<button class="btn btn--ghost" type="button" data-action="focus-pause" title="Поставить на паузу"' + (timer.running ? '' : ' disabled') + '>Пауза</button>' +
            '<button class="btn btn--ghost" type="button" data-action="focus-stop" title="Записать результат и сбросить таймер">Стоп</button>' +
            '<span class="focus-actions__hint">Стоп запишет результат и позволит начать новое действие.</span>' +
          '</div>' +
        '</div>' +
      '</div>' +
      quoteBlock +
      totals;
    updateFocusClock();
  }

  function updateFocusClock() {
    if (!lastView) return;
    const timer = root.SteelFocus ? root.SteelFocus.getState() : null;
    if (!timer) return;
    const view = lastView;
    const mode = timer.mode || view.focus.mode;
    const idleMinutes = mode === 'rest' ? view.focus.restMin : view.focus.focusMin;
    const clock = timer.hasTimer ? root.SteelFocus.format(timer.remainingMs) : pad2(idleMinutes) + ':00';
    const clockNode = $('focusClock');
    if (clockNode) clockNode.textContent = clock;
    const modeNode = $('focusMode');
    if (modeNode) modeNode.textContent = timer.hasTimer ? (mode === 'rest' ? 'отдых' : 'фокус') : 'готовность';

    const ring = $('focusRingValue');
    if (ring) {
      const ratio = timer.hasTimer && timer.totalMs > 0 ? timer.remainingMs / timer.totalMs : 1;
      const offset = Math.round(RING_CIRCUMFERENCE * (1 - Math.max(0, Math.min(1, ratio))) * 100) / 100;
      ring.setAttribute('stroke-dashoffset', String(offset));
    }

    const focusInput = $('focusMinutes');
    const restInput = $('restMinutes');
    if (focusInput) focusInput.disabled = timer.hasTimer;
    if (restInput) restInput.disabled = timer.hasTimer;
    elements.focusView.querySelectorAll('[data-action="focus-mode"]').forEach(function (btn) {
      btn.disabled = Boolean(timer.hasTimer);
      btn.classList.toggle('is-active', btn.getAttribute('data-mode') === mode);
    });

    const start = elements.focusView.querySelector('[data-action="focus-start"]');
    if (start) {
      start.disabled = Boolean(timer.running);
      start.textContent = timer.hasTimer && !timer.running && !timer.ended && timer.remainingMs > 0
        ? 'Продолжить'
        : 'Старт';
    }
    const pause = elements.focusView.querySelector('[data-action="focus-pause"]');
    if (pause) pause.disabled = !timer.running;

    const focusTab = view.tabs.list.find(function (tab) { return tab.id === 'focus'; });
    const focusOpen = Boolean(focusTab && focusTab.open);
    const label = timer.hasTimer ? '[' + root.SteelFocus.format(timer.remainingMs) + ']' : 'Фокусировка';
    const tabLabel = elements.appTabs.querySelector('[data-tab="focus"] .tab__label');
    if (tabLabel) tabLabel.textContent = focusOpen ? label : 'Фокусировка';
    const launcher = elements.launchers.querySelector('[data-launcher="focus"]');
    if (launcher) {
      const text = !focusOpen && timer.hasTimer
        ? (timer.running ? 'Фокус идет' : 'Фокус на паузе')
        : 'Фокусировка';
      launcher.querySelector('span').textContent = text;
      launcher.classList.toggle('is-running', Boolean(!focusOpen && timer.hasTimer));
    }
  }

  function showFocusOverlay(mode, completedMinutes) {
    lastEndedMode = mode === 'rest' ? 'rest' : 'focus';
    const rest = lastEndedMode === 'rest';
    const focus = lastView ? lastView.focus : { focusMin: 25, restMin: 15 };
    const minutes = Math.max(1, Math.floor(Number(completedMinutes) || (rest ? focus.restMin : focus.focusMin)));
    elements.focusVeilIcon.innerHTML = glyph(rest ? 'timer' : 'moon');
    elements.focusVeilKicker.textContent = rest ? 'отдых закончился' : 'подход закончился';
    elements.focusVeilTitle.textContent = rest ? 'Как насчет еще одной фокусировки?' : 'Ну все, отдыхаем?';
    elements.focusVeilText.textContent = rest
      ? 'Отдых позади. Мозг размялся, руки помнят. Ещё один подход?'
      : (minutes + ' ' + minutesWord(minutes) + ' фокуса позади. Можно выдохнуть — или сразу планировать следующий заход.');
    elements.focusVeilPrimary.textContent = rest ? 'Фокусироваться' : 'Отдохнуть';
    elements.focusVeilPrimary.setAttribute('title', rest ? 'Запустить фокусировку' : 'Запустить отдых');
    elements.focusVeil.hidden = false;
    elements.appWindow.classList.add('is-focus-blurred');
  }

  function hideFocusOverlay() {
    elements.focusVeil.hidden = true;
    elements.appWindow.classList.remove('is-focus-blurred');
  }

  function focusOverlayMode() { return lastEndedMode; }

  /* --------------------------------------------------------- Затухание --- */

  function applyTextFades() {
    if (typeof root.requestAnimationFrame !== 'function') return;
    root.requestAnimationFrame(function () {
      document.querySelectorAll('.is-faded').forEach(function (node) {
        if (!node.offsetParent || !node.clientWidth) return;
        const clone = node.cloneNode(true);
        clone.removeAttribute('id');
        clone.setAttribute('aria-hidden', 'true');
        clone.classList.remove('is-overflowing');
        clone.style.position = 'absolute';
        clone.style.left = '-9999px';
        clone.style.top = '0';
        clone.style.visibility = 'hidden';
        clone.style.width = node.clientWidth + 'px';
        clone.style.height = 'auto';
        clone.style.maxHeight = 'none';
        clone.style.overflow = 'visible';
        clone.style.display = 'block';
        document.body.appendChild(clone);
        const contentHeight = clone.getBoundingClientRect().height;
        clone.remove();
        node.classList.toggle('is-overflowing', contentHeight > node.clientHeight + 1);
      });
    });
  }

  /* --------------------------------------------------------- Модальные окна --- */

  const X_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6 6 18"/></svg>';

  function closeModal() {
    if (!activeModal) return;
    const modal = activeModal;
    activeModal = null;
    document.removeEventListener('keydown', modal.onKeydown);
    if (modal.root.parentNode) modal.root.parentNode.removeChild(modal.root);
    if (modal.options.onClose) modal.options.onClose();
  }

  function openModal(options) {
    closeModal();
    const rootNode = el('div', 'modal' + (options.className ? ' ' + options.className : ''));
    rootNode.setAttribute('role', 'dialog');
    rootNode.setAttribute('aria-modal', 'true');
    if (options.title) rootNode.setAttribute('aria-label', options.title);

    const buttons = (options.buttons || []).map(function (button) {
      const tone = button.tone ? ' btn--' + button.tone : (button.primary ? ' btn--gold' : ' btn--ghost');
      return '<button class="btn' + tone + '" type="button" data-modal-btn="' + esc(button.id) + '" ' +
        'title="' + esc(button.title || button.label) + '">' + esc(button.label) + '</button>';
    }).join('');

    const card = el('div', 'modal__card' + (options.wide ? ' modal__card--wide' : ''));
    card.innerHTML =
      '<div class="modal__head">' +
        '<h2 class="modal__title">' + esc(options.title || '') + '</h2>' +
        '<button class="icon-btn" type="button" data-modal-btn="__close" title="Закрыть окно" aria-label="Закрыть">' + X_SVG + '</button>' +
      '</div>' +
      '<div class="modal__body">' + (options.body || '') + '</div>' +
      (buttons ? '<div class="modal__foot">' + buttons + '</div>' : '');
    rootNode.appendChild(card);
    elements.modalRoot.appendChild(rootNode);

    const modal = { root: rootNode, card: card, options: options, onKeydown: null, close: closeModal };
    modal.onKeydown = function (event) {
      if (event.key === 'Escape') { event.preventDefault(); closeModal(); }
    };
    document.addEventListener('keydown', modal.onKeydown);

    rootNode.addEventListener('click', function (event) {
      if (event.target === rootNode) { closeModal(); return; }
      const button = event.target.closest('[data-modal-btn]');
      if (!button) return;
      const id = button.getAttribute('data-modal-btn');
      if (id === '__close') { closeModal(); return; }
      const keepOpen = options.onButton ? options.onButton(id, modal) : false;
      if (!keepOpen && activeModal === modal) closeModal();
    });

    activeModal = modal;
    if (options.onMount) options.onMount(modal);
    const focusTarget = card.querySelector('[data-autofocus]') || card.querySelector('input, textarea, button');
    if (focusTarget) focusTarget.focus();
    return modal;
  }

  /* --------------------------------------------------- Подтверждение --- */

  function confirmAction(options) {
    return new Promise(function (resolve) {
      let settled = false;
      const finish = function (value) {
        if (settled) return;
        settled = true;
        resolve(value);
      };
      openModal({
        title: options.title || 'Подтверждение',
        body: '<p class="modal__text">' + options.text + '</p>',
        buttons: [
          { id: 'no', label: options.cancelLabel || 'Отмена' },
          { id: 'yes', label: options.confirmLabel || 'Подтвердить', tone: options.tone === 'danger' ? 'danger' : 'gold' }
        ],
        onButton: function (id) { finish(id === 'yes'); return false; },
        onClose: function () { finish(false); }
      });
    });
  }

  function openLevelUpDialog(options) {
    const level = options && options.level != null ? options.level : 2;
    return new Promise(function (resolve) {
      let settled = false;
      const finish = function (value) {
        if (settled) return;
        settled = true;
        resolve(value);
      };
      const body = '<p class="modal__text">Баллов хватает на уровень <b>' + level + '</b>. Повышаем?</p>' +
        '<p class="field__hint">' +
        (level === 2
          ? 'На 2 уровне откроется выбор ветки. Это не экзамен — просто путь, который откликается.'
          : 'Если баллы пришли случайно, нажмите «Подожду». Уровень останется прежним, баллы — на месте.') +
        '</p>';
      openModal({
        title: 'Вы готовы перейти на новый уровень',
        body: body,
        buttons: [
          { id: 'later', label: 'Подожду' },
          { id: 'confirm', label: 'Повышаю', primary: true }
        ],
        onButton: function (id) { finish(id === 'confirm' ? 'confirm' : 'later'); return false; },
        onClose: function () { finish(null); }
      });
    });
  }

  function showMessage(options) {
    return new Promise(function (resolve) {
      const body = (options.emoji ? '<div class="modal__emoji">' + esc(options.emoji) + '</div>' : '') +
        '<p class="modal__text' + (options.emoji ? ' modal__center' : '') + '">' + options.text + '</p>' +
        (options.note ? '<p class="field__hint modal__center">' + esc(options.note) + '</p>' : '');
      openModal({
        title: options.title || 'Готово',
        body: body,
        className: options.humor ? 'modal--humor' : '',
        buttons: [{ id: 'ok', label: options.okLabel || 'Понятно', primary: true }],
        onButton: function () { resolve(true); return false; },
        onClose: function () { resolve(false); }
      });
    });
  }

  /* ------------------------------------------------------------- Имя --- */

  function openNameForm(options) {
    const body = '<div class="field">' +
      '<label class="field__label" for="nameInput">как тебя зовут?</label>' +
      '<input class="input" id="nameInput" maxlength="' + Core.NAME_MAX_LENGTH + '" data-autofocus ' +
        'placeholder="Например, Женя" value="' + esc(options.name || '') + '" />' +
      '<span class="field__hint">До ' + Core.NAME_MAX_LENGTH + ' символов. Можно оставить пустым — будет «Назови свое имя».</span>' +
      '</div>';
    return openModal({
      title: 'Меняем имя?',
      body: body,
      buttons: [
        { id: 'cancel', label: 'Отмена' },
        { id: 'save', label: 'Меняем', primary: true }
      ],
      onButton: function (id, modal) {
        if (id !== 'save') return false;
        if (options.onSubmit) options.onSubmit(modal.card.querySelector('#nameInput').value);
        return false;
      }
    });
