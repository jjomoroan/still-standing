/* ============================================================================
   Still Standing — дизайн-токены.
   Палитра: тёмный изумруд, мраморный текст, латунное золото.
   ============================================================================ */
:root {
  color-scheme: dark;

  /* --- Фоны --- */
  --void: #020907;
  --stage-a: #04100b;
  --stage-b: #020907;
  --window: #071a12;
  --window-top: #0b241a;
  --window-bottom: #04100b;
  --surface: #081b13;
  --surface-raised: #0b2419;
  --surface-sunken: #04120c;
  --surface-hover: #0e2b1e;

  /* --- Линии --- */
  --line: rgba(198, 161, 91, 0.24);
  --line-soft: rgba(198, 161, 91, 0.12);
  --line-strong: rgba(198, 161, 91, 0.45);

  /* --- Текст --- */
  --text: #f2eee5;
  --text-soft: #c8d1c9;
  --text-dim: #a9b8ae;
  --text-faint: #6f8277;

  /* --- Акценты --- */
  --gold: #c6a15b;
  --gold-light: #e8ce96;
  --gold-deep: #8c6a36;
  --emerald: #0e3a2a;
  --emerald-mid: #1e5c45;
  --emerald-light: #2e7a5d;
  --rose: #d79999;
  --amber: #d9b87a;

  --gold-soft: rgba(198, 161, 91, 0.10);
  --gold-line: rgba(198, 161, 91, 0.30);
  --emerald-soft: rgba(30, 92, 69, 0.22);
  --rose-soft: rgba(215, 153, 153, 0.12);

  /* --- Градиенты --- */
  --grad-stage:
    radial-gradient(110% 80% at 18% -10%, rgba(30, 92, 69, 0.42), transparent 60%),
    radial-gradient(90% 70% at 100% 110%, rgba(198, 161, 91, 0.08), transparent 60%),
    linear-gradient(160deg, var(--stage-a) 0%, var(--stage-b) 100%);
  --grad-window:
    radial-gradient(120% 90% at 12% -10%, rgba(30, 92, 69, 0.45), transparent 62%),
    linear-gradient(160deg, #071a12 0%, #04100b 52%, #020907 100%);
  --grad-card: linear-gradient(180deg, rgba(198, 161, 91, 0.035) 0%, rgba(198, 161, 91, 0) 60%);
  --grad-gold: linear-gradient(180deg, #f4dda8 0%, #d2ad68 48%, #9a753c 100%);
  --grad-gold-line: linear-gradient(90deg, transparent, rgba(198, 161, 91, 0.5), transparent);

  /* --- Тени --- */
  --shadow-pop: 0 30px 80px -30px rgba(0, 0, 0, 0.95), 0 0 0 1px var(--line);
  --shadow-soft: 0 20px 50px -40px rgba(0, 0, 0, 0.95);

  /* --- Радиусы --- */
  --r-xl: 18px;
  --r-lg: 13px;
  --r-md: 9px;
  --r-sm: 6px;
  --r-pill: 999px;

  /* --- Типографика --- */
  --font: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
  --serif: Georgia, 'Palatino Linotype', 'Times New Roman', serif;
  --font-mono: 'Cascadia Mono', 'JetBrains Mono', Consolas, monospace;
  --fs-xxs: 10px;
  --fs-xs: 11px;
  --fs-sm: 12px;
  --fs-md: 13px;
  --fs-lg: 15px;
  --fs-xl: 19px;
  --fs-2xl: 26px;
  --fs-3xl: 34px;

  /* --- Тайминги --- */
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --t-fast: 0.16s;
  --t-mid: 0.26s;
  --t-slow: 0.4s;

  /* --- Каркас --- */
  --titlebar-h: 46px;
  --ui-zoom: 1;
  --content-max: calc(1120px / var(--ui-zoom));
  --z-focus-veil: 60;
  --z-modal: 80;
  --z-toast: 90;
}

</style>

/* ============================================================================
   Still Standing — стили интерфейса.
   Палитра: изумруд, мрамор, латунное золото. Плоские строки, тонкие линии,
   много воздуха. Без тяжёлых карточек и объёмных рамок.
   ============================================================================ */

/* ---------------------------------------------------------------- 1. База --- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
html, body { overflow: hidden; }

body {
  margin: 0;
  font-family: var(--font);
  font-size: var(--fs-md);
  font-weight: 400;
  color: var(--text);
  background: var(--void);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4, p { margin: 0; }
button { font-family: inherit; color: inherit; }
svg { display: block; }
[hidden] { display: none !important; }

:focus-visible {
  outline: 1px solid var(--gold);
  outline-offset: 3px;
  border-radius: var(--r-sm);
}

* { scrollbar-width: thin; scrollbar-color: rgba(198, 161, 91, 0.32) transparent; }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb {
  background: rgba(198, 161, 91, 0.28);
  border: 2px solid transparent;
  background-clip: content-box;
  border-radius: var(--r-pill);
}
*::-webkit-scrollbar-thumb:hover { background: rgba(198, 161, 91, 0.48); background-clip: content-box; }

/* ------------------------------------------------------------ 2. Окно --- */
.zoom-shell {
  position: absolute;
  top: 0;
  left: 50%;
  width: calc(100% / var(--ui-zoom));
  height: calc(100% / var(--ui-zoom));
  transform: translateX(-50%) scale(var(--ui-zoom));
  transform-origin: top center;
  overflow: hidden;
}

.stage {
  height: 100%;
  min-height: 100%;
  background: var(--grad-window);
}

/* Приложение живёт в настоящем окне браузера/Chrome-приложения.
   Никакой второй рамки, теней и фальшивых кнопок окна. */
.app-window {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  background: var(--grad-window);
  border: 0;
  border-radius: 0;
  box-shadow: none;
  overflow: hidden;
}

/* --------------------------------------------------------- 3. Титульная панель --- */
.titlebar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  height: var(--titlebar-h);
  padding: 0 max(8px, calc((100% - var(--content-max)) / 2)) 0 max(18px, calc((100% - var(--content-max)) / 2));
  background: linear-gradient(180deg, rgba(11, 36, 26, 0.9), rgba(4, 16, 11, 0.9));
  border-bottom: 1px solid var(--line-soft);
  user-select: none;
}

.titlebar__brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.titlebar__mark {
  align-self: center;
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  color: var(--gold);
  border: 1px solid var(--line);
  border-radius: 7px;
}
.titlebar__mark svg { width: 14px; height: 14px; }
.titlebar__name {
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 400;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  background: var(--grad-gold);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  white-space: nowrap;
}
.titlebar__demo {
  font-size: 8px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--text-faint);
}
.titlebar__tag {
  font-size: 9px;
  letter-spacing: 0.12em;
  color: var(--text-faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.titlebar__actions { display: flex; align-items: center; gap: 5px; }

.chip-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 26px;
  padding: 0 9px;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-dim);
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--r-pill);
  cursor: pointer;
  transition: color var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease),
              background var(--t-fast) var(--ease);
}
.chip-btn svg { width: 13px; height: 13px; color: var(--gold); }
.chip-btn:hover { color: var(--gold-light); border-color: var(--line); background: var(--gold-soft); }
.chip-btn:active { transform: translateY(1px); }

/* ------------------------------------------------------------ 4. Шапка профиля --- */
.app-header {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  padding: 20px max(28px, calc((100% - var(--content-max)) / 2)) 0;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(11, 36, 26, 0.24), transparent 80%);
}

.profile {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 0 16px;
}

.profile__avatar {
  position: relative;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 58px;
  height: 58px;
  padding: 0;
  font-family: var(--serif);
  font-size: 25px;
  color: var(--gold-light);
  background: radial-gradient(circle at 32% 24%, #2a7458, #0e3a2a 68%);
  border: 1px solid rgba(198, 161, 91, 0.55);
  border-radius: 50%;
  box-shadow: inset 0 0 0 4px rgba(4, 16, 11, 0.35);
  cursor: pointer;
  transition: box-shadow var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
.profile__avatar:hover { box-shadow: inset 0 0 0 4px rgba(4, 16, 11, 0.35), 0 0 22px -8px rgba(198, 161, 91, 0.7); }
.profile__avatar:active { transform: scale(0.97); }
.profile__avatar-face { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; line-height: 1; }
.profile__avatar-face svg { width: 25px; height: 25px; }
.profile__avatar-face img { width: 100%; height: 100%; object-fit: cover; }

.profile__text { flex: 1 1 auto; min-width: 0; }
.profile__row { display: flex; align-items: center; gap: 10px; }
.profile__name {
  font-family: var(--serif);
  font-size: 32px;
  font-weight: 400;
  letter-spacing: 0.015em;
  line-height: 1.1;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.profile__name.is-placeholder { color: var(--text-dim); font-style: italic; }
.profile__edit { flex: 0 0 auto; }
.profile__title {
  margin-top: 5px;
  font-size: var(--fs-xs);
  line-height: 1.55;
  color: var(--text-dim);
}
.profile__title b { color: var(--text); font-weight: 500; }
.profile__title em { font-style: normal; color: var(--gold); }

.profile__rank {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 1px;
  min-width: 66px;
  padding-left: 24px;
  border-left: 1px solid var(--line);
}
.profile__rank-value {
  font-family: var(--serif);
  font-size: 42px;
  line-height: 0.95;
  color: var(--gold);
}
.profile__rank-label {
  font-size: 8px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--text-faint);
}

/* --------------------------------------------------------- 5. Кнопки-запускатели --- */
.launchers {
  display: flex;
  align-items: center;
  gap: 26px;
  padding: 2px 0 14px;
  overflow-x: auto;
  scrollbar-width: none;
}
.launchers::-webkit-scrollbar { display: none; }

.launcher {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  flex: 0 0 auto;
  padding: 2px 0;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-faint);
  background: transparent;
  border: 0;
  border-bottom: 1px solid transparent;
  cursor: pointer;
  transition: color var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
}
.launcher svg { width: 13px; height: 13px; color: var(--gold); }
.launcher:hover { color: var(--text); border-bottom-color: var(--line); }
.launcher.is-active { color: var(--gold-light); border-bottom-color: var(--gold); }
.launcher.is-running { color: var(--gold-light); text-shadow: 0 0 18px rgba(198, 161, 91, 0.45); }
.launcher.is-running::after { content: ''; width: 4px; height: 4px; margin-left: 2px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px var(--gold); }

/* --------------------------------------------------------- 6. Браузерные вкладки --- */
.tabbar {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabbar::-webkit-scrollbar { display: none; }

.tab {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  flex: 0 0 auto;
  padding: 8px 14px 7px;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-faint);
  background: transparent;
  border: 1px solid transparent;
  border-bottom: 0;
  border-radius: 8px 8px 0 0;
  cursor: pointer;
  transition: color var(--t-fast) var(--ease), background var(--t-fast) var(--ease),
              border-color var(--t-fast) var(--ease);
}
.tab svg { width: 12px; height: 12px; color: var(--gold); }
.tab__label-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 0;
  font: inherit;
  letter-spacing: inherit;
  text-transform: inherit;
  color: inherit;
  background: transparent;
  border: 0;
  cursor: pointer;
}
.tab__label { line-height: 1; font-variant-numeric: tabular-nums; }
.tab__label--timer { font-variant-numeric: tabular-nums; }
.tab:hover { color: var(--text); border-color: var(--line-soft); }
.tab.is-open { border-color: var(--line-soft); background: rgba(198, 161, 91, 0.035); color: var(--text-soft); }
.tab.is-active { color: var(--gold-light); border-color: var(--line-strong); background: linear-gradient(180deg, rgba(30, 92, 69, 0.32), transparent); }
.tab.is-active::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: 0; height: 1px; background: var(--gold); }
.tab.is-pinned { color: var(--gold); }
.tab__label { line-height: 1; font-variant-numeric: tabular-nums; }
.tab__x {
  display: grid;
  place-items: center;
  width: 15px;
  height: 15px;
  margin-left: 2px;
  color: var(--text-faint);
  background: transparent;
  border: 0;
  border-radius: 50%;
  cursor: pointer;
}
.tab__x svg { width: 9px; height: 9px; }
.tab__x:hover { color: var(--rose); background: var(--rose-soft); }

/* --------------------------------------------------------- 7. Прокрутка и виды --- */
.app-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
}
.app-body {
  display: flex;
  flex-direction: column;
  min-height: 100%;
  padding: 18px max(28px, calc((100% - var(--content-max)) / 2)) 72px;
}
.view { display: flex; flex-direction: column; gap: 16px; }

/* --------------------------------------------------------- 8. Гармошки --- */
.accordion { border-bottom: 1px solid var(--line); }

.acc__head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 0 12px;
  cursor: pointer;
  user-select: none;
}
.acc__head:hover .acc__title { color: var(--gold-light); }
.acc__title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text);
  transition: color var(--t-fast) var(--ease);
}
.acc__title svg { width: 14px; height: 14px; color: var(--gold); }
.acc__count { font-family: var(--serif); font-size: 13px; color: var(--gold); }
.acc__wallet { font-family: var(--serif); font-size: 12px; color: var(--gold-deep); white-space: nowrap; }
.acc__spacer { flex: 1 1 auto; }
.acc__add {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 25px;
  padding: 0 10px;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  cursor: pointer;
}
.acc__add svg { width: 11px; height: 11px; }
.acc__add:hover { color: var(--gold-light); background: var(--gold-soft); border-color: var(--line-strong); }
.acc__chev { width: 13px; height: 13px; color: var(--gold); transition: transform var(--t-mid) var(--ease); }
.acc.is-open .acc__chev { transform: rotate(180deg); }
.acc__body { padding: 0 0 14px; }

/* --------------------------------------------------------- 9. Задачи --- */
.task {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 13px;
  padding: 11px 0;
  border-top: 1px solid var(--line-soft);
}
.task:first-child { border-top: 0; }
.task__check {
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  color: transparent;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 5px;
  cursor: pointer;
  transition: color var(--t-fast) var(--ease), background var(--t-fast) var(--ease),
              border-color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
.task__check svg { width: 12px; height: 12px; }
.task__check:hover { border-color: var(--gold); background: var(--gold-soft); }
.task__check:disabled { opacity: 0.45; cursor: not-allowed; }
.task__check.is-checked { color: #171208; background: var(--gold); border-color: var(--gold); }
.task__check.is-checked:hover { background: var(--gold-light); }
.task__check:active { transform: scale(0.92); }
.task__main { min-width: 0; display: flex; flex-direction: column; gap: 2px; cursor: pointer; }
.task__main:focus-visible { outline: 1px solid var(--gold); outline-offset: 3px; border-radius: 4px; }
.task__title { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.3; }
.task__desc { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; font-size: 10px; color: var(--text-faint); line-height: 1.45; overflow: hidden; }
.task__meta { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin-top: 3px; }
.task__time { display: inline-flex; align-items: center; gap: 4px; font-size: 9px; color: var(--text-faint); white-space: nowrap; }
.task__time svg { width: 11px; height: 11px; }
.task__points { font-family: var(--serif); font-size: 13px; color: var(--gold); white-space: nowrap; }
.task__total { font-size: 9px; letter-spacing: 0.04em; color: var(--text-faint); white-space: nowrap; }
.task__warn { font-size: 8px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--amber); border: 1px solid rgba(217, 184, 122, 0.3); border-radius: var(--r-pill); padding: 1px 6px; }
.task__side { display: flex; align-items: center; gap: 6px; }
.task__actions { display: flex; align-items: center; gap: 3px; opacity: 0.45; transition: opacity var(--t-fast) var(--ease); }
.task:hover .task__actions, .task:focus-within .task__actions { opacity: 1; }
.task.is-done .task__title { color: var(--gold-light); }
.task.is-done .task__desc { color: var(--text-faint); }

.counter { display: inline-flex; align-items: center; gap: 8px; color: var(--text-faint); }
.counter__btn { width: 18px; height: 18px; display: grid; place-items: center; color: var(--text-dim); background: transparent; border: 0; border-radius: 50%; cursor: pointer; }
.counter__btn svg { width: 10px; height: 10px; }
.counter__btn:hover:not([disabled]) { color: var(--gold); background: var(--gold-soft); }
.counter__btn[disabled] { opacity: 0.25; cursor: not-allowed; }
.counter__value { min-width: 14px; font-family: var(--serif); font-size: 14px; text-align: center; color: var(--text); font-variant-numeric: tabular-nums; }

.task-group + .task-group { margin-top: 8px; }
.task-group__head { display: flex; align-items: center; gap: 8px; padding: 8px 0 5px; border-bottom: 1px solid var(--line-soft); font-size: 8px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-faint); }
.task-group__count { display: inline-grid; place-items: center; min-width: 16px; height: 16px; padding: 0 5px; border: 1px solid var(--line-soft); border-radius: var(--r-pill); font-size: 8px; letter-spacing: 0; color: var(--text-dim); }
.task.is-one-time .task__title { color: var(--gold-light); }

/* --------------------------------------------------------- 10. Магазин --- */
.shop-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 26px; }
.shop-card {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 13px 0 12px;
  border-top: 1px solid var(--line-soft);
  cursor: pointer;
  transition: background var(--t-fast) var(--ease);
}
.shop-card:hover { background: linear-gradient(180deg, rgba(198, 161, 91, 0.035), transparent); }
.shop-card__top { display: flex; align-items: flex-start; gap: 10px; }
.shop-card__icon {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  color: var(--gold);
  border: 1px solid var(--line);
  border-radius: 50%;
  overflow: hidden;
}
.shop-card__icon svg { width: 15px; height: 15px; }
.shop-card__icon img { width: 100%; height: 100%; object-fit: cover; }
.shop-card__head { min-width: 0; flex: 1 1 auto; }
.shop-card__title { font-family: var(--serif); font-size: 16px; font-weight: 400; color: var(--text); line-height: 1.25; }
.shop-card__desc { margin-top: 3px; font-size: 10px; line-height: 1.5; color: var(--text-faint); max-height: 30px; overflow: hidden; }
.shop-card__foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; }
.shop-card__price { font-family: var(--serif); font-size: 13px; color: var(--gold); }
.shop-card__tools { display: flex; align-items: center; gap: 3px; opacity: 0.35; transition: opacity var(--t-fast) var(--ease); }
.shop-card:hover .shop-card__tools, .shop-card:focus-within .shop-card__tools { opacity: 1; }
.shop-card__buy { align-self: flex-start; margin-top: 4px; }
.shop-card.is-locked { opacity: 1; }
.shop-card.is-locked .shop-card__price { color: var(--gold); }

/* --------------------------------------------------------- 11. Инвентарь --- */
.stock-row {
  display: grid;
  grid-template-columns: 32px minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 11px;
  padding: 8px 0;
  border-top: 1px solid var(--line-soft);
}
.stock-row:first-child { border-top: 0; }
.stock-row__icon { display: grid; place-items: center; width: 32px; height: 32px; color: var(--gold); border: 1px solid var(--line); border-radius: 50%; overflow: hidden; }
.stock-row__icon svg { width: 16px; height: 16px; }
.stock-row__icon img { width: 100%; height: 100%; object-fit: cover; }
.stock-row__text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.stock-row__title { font-family: var(--serif); font-size: 15px; color: var(--text); }
.stock-row__desc { font-size: 9px; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stock-row__price { font-family: var(--serif); font-size: 13px; color: var(--gold); white-space: nowrap; }

/* --------------------------------------------------------- 12. Классы и титулы --- */
.classes { padding-top: 4px; }
.classes__head { display: flex; align-items: center; gap: 12px; padding-bottom: 8px; }
.classes__title { font-family: var(--serif); font-size: 22px; font-weight: 400; letter-spacing: 0.06em; text-transform: uppercase; background: var(--grad-gold); -webkit-background-clip: text; background-clip: text; color: transparent; }
.classes__sub { font-size: 9px; letter-spacing: 0.04em; color: var(--text-faint); }
.classes__spacer { flex: 1 1 auto; }
.class-add {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 27px;
  padding: 0 12px;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gold);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  cursor: pointer;
}
.class-add:hover:not([disabled]) { color: var(--gold-light); background: var(--gold-soft); border-color: var(--line-strong); }
.class-add[disabled] { opacity: 0.35; cursor: not-allowed; }

.class-block { position: relative; padding: 12px 0 4px; border-top: 1px solid var(--line-soft); }
.class-block.is-active::before { content: ''; position: absolute; left: -14px; top: 12px; bottom: 4px; width: 1px; background: linear-gradient(180deg, var(--gold), transparent); }
.class-row { display: flex; align-items: center; gap: 11px; padding: 4px 0 7px; }
.class-name { font-family: var(--serif); font-size: 23px; font-weight: 400; color: var(--text); }
.class-block.is-active .class-name { color: var(--gold-light); }
.class-badge { font-size: 8px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
.class-badge--sub { color: var(--text-faint); }
.class-points { font-family: var(--serif); font-size: 14px; color: var(--gold); }
.class-step { font-size: 9px; letter-spacing: 0.05em; color: var(--text-faint); }
.class-spacer { flex: 1 1 auto; }
.class-actions { display: flex; align-items: center; gap: 5px; }

.titles-track {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding: 7px 0 9px;
  scroll-snap-type: x proximity;
  overscroll-behavior-x: contain;
}
.title-card {
  flex: 0 0 218px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: 10px 12px 11px;
  border-top: 1px solid var(--line-soft);
  border-bottom: 1px solid var(--line-soft);
  scroll-snap-align: start;
  background: linear-gradient(180deg, rgba(198, 161, 91, 0.02), transparent);
  opacity: 0.62;
}
.title-card.is-earned { opacity: 1; }
.title-card.is-current { border-color: var(--line); background: linear-gradient(180deg, rgba(198, 161, 91, 0.08), transparent); }
.title-card__head { display: flex; align-items: baseline; gap: 7px; }
.title-card__level { font-family: var(--serif); font-size: 10px; color: var(--gold-deep); }
.title-card__name { font-family: var(--serif); font-size: 14px; line-height: 1.25; color: var(--text-soft); }
.title-card.is-current .title-card__name { color: var(--gold-light); }
.title-card__lore { font-size: 9px; line-height: 1.5; color: var(--text-faint); }
.title-card.is-current .title-card__lore { color: var(--text-dim); }
.class-block.is-sub .class-name { color: var(--text-soft); font-size: 21px; }
.class-block.is-sub .class-points { color: var(--text-dim); }

.classes-empty {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 18px 0;
  border-bottom: 1px solid var(--line-soft);
  color: var(--text-faint);
  font-size: 11px;
  cursor: default;
}
.classes-empty.is-clickable { cursor: pointer; }
.classes-empty.is-clickable:hover { color: var(--gold); }
.classes-empty__mark { width: 26px; height: 26px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; color: var(--gold); }
.classes-empty__mark svg { width: 13px; height: 13px; }

/* --------------------------------------------------------- 13. Фокусировка --- */
.focus-stage {
  display: grid;
  grid-template-columns: 292px minmax(0, 1fr);
  align-items: center;
  gap: 48px;
  padding: 14px 26px 0;
}
.focus-ring { position: relative; width: 272px; height: 272px; justify-self: center; }
.focus-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.focus-ring__track { fill: none; stroke: rgba(198, 161, 91, 0.16); stroke-width: 1.3; }
.focus-ring__value { fill: none; stroke: url(#focusGold); stroke-width: 1.6; stroke-linecap: round; filter: drop-shadow(0 0 5px rgba(198, 161, 91, 0.3)); transition: stroke-dashoffset 0.25s linear; }
.focus-clock { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; pointer-events: none; }
.focus-clock__time { font-family: var(--serif); font-size: 54px; line-height: 1; color: var(--gold); font-variant-numeric: tabular-nums; }
.focus-clock__mode { font-size: 8px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--text-faint); }

.focus-controls { display: flex; flex-direction: column; min-width: 0; }
.focus-field { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 18px; padding: 13px 0; border-bottom: 1px solid var(--line-soft); }
.focus-field__label { font-size: 9px; letter-spacing: 0.17em; text-transform: uppercase; color: var(--text-faint); }
.focus-field__value { display: flex; align-items: baseline; gap: 6px; justify-content: flex-end; }
.focus-field__input {
  width: 62px;
  padding: 0 0 3px;
  font-family: var(--serif);
  font-size: 25px;
  text-align: right;
  color: var(--gold-light);
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--line);
  outline: none;
}
.focus-field__input:focus { border-color: var(--gold); }
.focus-field__input:disabled { opacity: 0.45; }
.focus-field__unit { font-size: 9px; color: var(--text-faint); }
.focus-modes { display: flex; gap: 7px; margin-top: 6px; }
.focus-mode-btn {
  padding: 4px 9px;
  font-size: 8px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-faint);
  background: transparent;
  border: 1px solid var(--line-soft);
  border-radius: var(--r-pill);
  cursor: pointer;
}
.focus-mode-btn:hover:not([disabled]) { color: var(--gold); border-color: var(--line); }
.focus-mode-btn.is-active { color: var(--gold-light); border-color: var(--line); background: var(--gold-soft); }
.focus-mode-btn[disabled] { opacity: 0.35; cursor: not-allowed; }

.focus-actions { display: flex; align-items: center; gap: 10px; padding: 16px 0 12px; flex-wrap: wrap; }
.focus-actions .btn { min-width: 98px; }
.focus-actions__hint { font-size: 9px; color: var(--text-faint); margin-left: 4px; }

.focus-quote { margin: 10px 26px 0; padding: 14px 0; border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); text-align: center; font-family: var(--serif); font-size: 17px; font-style: italic; color: var(--text-dim); }
.focus-quote.is-active { color: var(--gold-light); }
.focus-quote-field { display: flex; flex-direction: column; gap: 5px; margin: 10px 26px 0; }
.focus-quote-field .field__label { font-size: 8px; }
.focus-quote-input { background: transparent; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding-left: 0; }

.focus-totals { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 16px 26px 0; }
.focus-total { padding-top: 10px; border-top: 1px solid var(--line); }
.focus-total__label { font-size: 8px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-faint); }
.focus-total__value { font-family: var(--serif); font-size: 28px; color: var(--gold); line-height: 1.2; }
.focus-total__value small { font-family: var(--font); font-size: 9px; color: var(--text-faint); margin-left: 5px; }
.focus-session-list { display: flex; flex-direction: column; gap: 2px; margin-top: 3px; }
.focus-session { font-size: 10px; color: var(--text-dim); }
.focus-session--empty { color: var(--text-faint); font-style: italic; }
.focus-totals-empty { padding: 14px 26px 0; font-size: 10px; color: var(--text-faint); }

/* --------------------------------------------------------- 14. Заметки --- */
.notes-head { display: flex; align-items: center; gap: 13px; }
.notes-title { font-family: var(--serif); font-size: 25px; font-weight: 400; letter-spacing: 0.06em; text-transform: uppercase; background: var(--grad-gold); -webkit-background-clip: text; background-clip: text; color: transparent; }
.notes-count { font-family: var(--serif); font-size: 13px; color: var(--gold); }
.notes-create { margin-left: auto; }
.notes-hint { font-size: 10px; color: var(--text-faint); }
.notes-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.notes-grid .empty { grid-column: 1 / -1; }

.note {
  position: relative;
  display: flex;
  flex-direction: column;
  aspect-ratio: 1 / 1;
  min-height: 0;
  padding: 14px 14px 10px;
  border: 1px solid var(--line-soft);
  background: linear-gradient(155deg, rgba(30, 92, 69, 0.18), rgba(4, 16, 11, 0.34));
  transition: border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
  animation: card-in var(--t-mid) var(--ease-out) both;
}
.note:hover { border-color: var(--line); background: linear-gradient(155deg, rgba(30, 92, 69, 0.26), rgba(4, 16, 11, 0.34)); }
.note__open { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 6px; padding: 0 18px 0 0; text-align: left; background: transparent; border: 0; cursor: pointer; overflow: hidden; }
.note__title { flex: 0 0 auto; font-family: var(--serif); font-size: 16px; font-weight: 400; line-height: 1.25; color: var(--gold-light); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.note__text { flex: 1 1 auto; min-height: 0; font-size: 10px; line-height: 1.55; color: var(--text-soft); white-space: pre-line; overflow: hidden; }
.note__x { position: absolute; top: 7px; right: 7px; z-index: 1; width: 18px; height: 18px; display: grid; place-items: center; color: var(--text-faint); background: transparent; border: 0; border-radius: 50%; cursor: pointer; opacity: 0.6; }
.note__x svg { width: 10px; height: 10px; }
.note:hover .note__x { opacity: 1; }
.note__x:hover { color: var(--rose); background: var(--rose-soft); }
.note__meta { flex: 0 0 auto; display: flex; justify-content: flex-end; gap: 8px; margin-top: 7px; padding-top: 6px; border-top: 1px solid rgba(198, 161, 91, 0.1); font-size: 8px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); }

/* --------------------------------------------------------- 15. Архив --- */
.archive-days { display: flex; flex-direction: column; }
.archive-day { padding: 11px 0; border-bottom: 1px solid var(--line-soft); }
.archive-day__head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.archive-day__date { display: flex; align-items: center; gap: 7px; font-family: var(--serif); font-size: 16px; color: var(--text); }
.archive-day__date svg { width: 14px; height: 14px; color: var(--gold); }
.archive-day__count { font-size: 9px; color: var(--text-faint); }
.archive-list { display: flex; flex-direction: column; gap: 3px; margin: 7px 0 0; padding: 0; list-style: none; }
.archive-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 10px; font-size: 10px; }
.archive-row__title { color: var(--text-soft); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.archive-row__count { color: var(--text-faint); font-size: 9px; }
.archive-row__points { font-family: var(--serif); color: var(--gold); }

/* --------------------------------------------------------- 16. Ачивки --- */
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.ach-grid .empty { grid-column: 1 / -1; }
.ach-card { display: flex; flex-direction: column; gap: 6px; padding: 14px; border: 1px solid var(--line-soft); background: linear-gradient(155deg, rgba(30, 92, 69, 0.14), transparent); cursor: pointer; transition: border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease); }
.ach-card:hover { border-color: var(--line); background: linear-gradient(155deg, rgba(30, 92, 69, 0.24), transparent); }
.ach-card__icon { width: 40px; height: 40px; display: grid; place-items: center; color: var(--gold); border: 1px solid var(--line); border-radius: 50%; overflow: hidden; }
.ach-card__icon svg { width: 19px; height: 19px; }
.ach-card__icon img { width: 100%; height: 100%; object-fit: cover; }
.ach-card__title { font-family: var(--serif); font-size: 16px; color: var(--text); }
.ach-card__desc { min-height: 30px; max-height: 38px; overflow: hidden; font-size: 10px; line-height: 1.5; color: var(--text-faint); }
.ach-card__date { margin-top: auto; font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-faint); }
.ach-footer { padding-top: 6px; text-align: center; font-family: var(--serif); font-size: 14px; font-style: italic; color: var(--text-faint); }

/* --------------------------------------------------------- 17. Кнопки --- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 34px;
  padding: 0 16px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--text-soft);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  cursor: pointer;
  transition: color var(--t-fast) var(--ease), background var(--t-fast) var(--ease),
              border-color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
.btn svg { width: 13px; height: 13px; }
.btn:hover { color: var(--gold-light); border-color: var(--line-strong); background: var(--gold-soft); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: 0.35; cursor: not-allowed; }
.btn--gold { color: #171208; background: var(--grad-gold); border-color: var(--gold); }
.btn--gold:hover { color: #171208; background: var(--gold-light); border-color: var(--gold-light); }
.btn--ghost { color: var(--text-dim); border-color: var(--line-soft); }
.btn--ghost:hover { color: var(--gold-light); border-color: var(--line); }
.btn--danger { color: var(--rose); border-color: rgba(215, 153, 153, 0.35); background: var(--rose-soft); }
.btn--sm { height: 27px; padding: 0 11px; font-size: 8px; }

.icon-btn {
  display: grid;
  place-items: center;
  width: 27px;
  height: 27px;
  flex: 0 0 auto;
  color: var(--gold);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 50%;
  cursor: pointer;
  transition: color var(--t-fast) var(--ease), background var(--t-fast) var(--ease),
              border-color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
.icon-btn svg { width: 12px; height: 12px; }
.icon-btn:hover { color: var(--gold-light); background: var(--gold-soft); border-color: var(--line-strong); }
.icon-btn:active { transform: scale(0.94); }
.icon-btn[disabled] { opacity: 0.3; cursor: not-allowed; }
.icon-btn[disabled]:hover { color: var(--gold); background: transparent; border-color: var(--line); }
.icon-btn--danger:hover { color: var(--rose); background: var(--rose-soft); border-color: rgba(215, 153, 153, 0.35); }
.icon-btn--active { color: var(--gold-light); border-color: var(--gold); background: var(--gold-soft); }

/* --------------------------------------------------------- 18. Формы --- */
.field { display: flex; flex-direction: column; gap: 5px; }
.field__label { font-size: 8px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-faint); }
.field__row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field__hint { font-size: 9px; line-height: 1.5; color: var(--text-faint); }
.textarea--task-desc { min-height: 108px; resize: vertical; line-height: 1.5; }
.task-type-toggle { display: flex; align-items: flex-start; gap: 9px; padding: 10px 11px; border: 1px solid var(--line-soft); border-radius: var(--r-sm); cursor: pointer; }
.task-type-toggle input { margin-top: 2px; accent-color: var(--gold); }
.task-type-toggle b { display: block; font-size: 11px; color: var(--text); font-weight: 600; }
.task-type-toggle small { display: block; margin-top: 1px; font-size: 9px; color: var(--text-faint); }
.field__error { min-height: 13px; font-size: 9px; color: var(--rose); }

.input, .textarea, .select {
  width: 100%;
  padding: 9px 11px;
  font-family: inherit;
  font-size: 12px;
  color: var(--text);
  background: rgba(4, 16, 11, 0.55);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-sm);
  transition: border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
}
.textarea { min-height: 72px; resize: vertical; line-height: 1.5; }
.input::placeholder, .textarea::placeholder { color: var(--text-faint); }
.input:focus, .textarea:focus, .select:focus { outline: none; border-color: var(--gold); background: rgba(4, 16, 11, 0.8); }
.input--number { text-align: center; font-family: var(--serif); font-size: 16px; color: var(--gold-light); }
.select { appearance: none; cursor: pointer; }
.textarea--tall { min-height: 160px; }

.form-total { padding: 8px 11px; font-family: var(--serif); font-size: 15px; color: var(--gold); border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); }
.form-total.is-over { color: var(--amber); }
.form-warning { display: none; font-size: 9px; line-height: 1.5; color: var(--amber); }
.form-warning.is-on { display: block; }

.item-title-row { display: flex; align-items: center; gap: 8px; }
.item-title-row .input { flex: 1 1 auto; min-width: 0; }

.note-tips { padding: 10px 12px; border: 1px dashed var(--line-soft); }
.note-tips__title { font-size: 8px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); }
.note-tips__text { margin-top: 3px; font-size: 9px; line-height: 1.5; color: var(--text-faint); }

/* --------------------------------------------------------- 19. Модалки --- */
.modal-root { position: relative; z-index: var(--z-modal); }
.modal { position: fixed; inset: 0; display: grid; place-items: center; padding: 22px; background: rgba(2, 9, 7, 0.72); backdrop-filter: blur(4px); animation: fade-in var(--t-fast) var(--ease) both; }
.modal__card { display: flex; flex-direction: column; width: min(440px, 100%); max-height: min(88%, 760px); background: linear-gradient(160deg, #0d2b20, #06150f); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-pop); animation: modal-in var(--t-mid) var(--ease-out) both; overflow: hidden; }
.modal__card--wide { width: min(640px, 100%); }
.modal__head { display: flex; align-items: center; gap: 10px; padding: 15px 18px 12px; border-bottom: 1px solid var(--line-soft); }
.modal__title { flex: 1 1 auto; font-family: var(--serif); font-size: 21px; font-weight: 400; color: var(--text); }
.modal__body { display: flex; flex-direction: column; gap: 13px; padding: 16px 18px; overflow-y: auto; }
.modal__text { font-size: 11px; line-height: 1.6; color: var(--text-dim); }
.modal__text b { color: var(--text); font-weight: 600; }
.modal__foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 18px 14px; border-top: 1px solid var(--line-soft); }
.modal__emoji { display: grid; place-items: center; width: 52px; height: 52px; margin: 2px auto 0; font-size: 23px; border: 1px solid var(--line); border-radius: 50%; }
.modal--humor .modal__card { width: min(420px, 100%); }
.modal__center { text-align: center; }
.modal--branch-picker .modal__card, .modal--class-picker .modal__card { width: min(680px, 100%); }
.modal--title-editor .modal__card { width: min(680px, 100%); }
.modal--faq .modal__card { width: min(660px, 100%); }

.reward-card { display: flex; align-items: flex-start; gap: 14px; }
.reward-card__icon { flex: 0 0 auto; width: 52px; height: 52px; display: grid; place-items: center; color: var(--gold); border: 1px solid var(--line); border-radius: 50%; overflow: hidden; }
.reward-card__icon svg { width: 24px; height: 24px; }
.reward-card__icon img { width: 100%; height: 100%; object-fit: cover; }
.reward-card__desc { font-size: 12px; line-height: 1.65; color: var(--text-soft); white-space: pre-line; }

/* --------------------------------------------------------- 20. Выбор класса --- */
.class-picker { display: flex; flex-direction: column; gap: 8px; }
.class-option { border-top: 1px solid var(--line-soft); }
.class-option__head { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 0; background: transparent; border: 0; text-align: left; cursor: pointer; }
.class-option__icon { width: 28px; height: 28px; display: grid; place-items: center; color: var(--gold); border: 1px solid var(--line); border-radius: 50%; }
.class-option__icon svg { width: 14px; height: 14px; }
.class-option__text { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1 1 auto; }
.class-option__name { font-family: var(--serif); font-size: 17px; color: var(--text); }
.class-option__lore { font-size: 9px; color: var(--text-faint); }
.class-option__chev { width: 13px; height: 13px; color: var(--gold); transition: transform var(--t-mid) var(--ease); }
.class-option.is-open .class-option__chev { transform: rotate(180deg); }
.class-option__body { display: none; padding: 0 0 12px 38px; }
.class-option.is-open .class-option__body { display: block; }
.class-option__titles { max-height: 210px; overflow-y: auto; padding-right: 6px; }
.class-title-line { padding: 6px 0; border-bottom: 1px solid rgba(198, 161, 91, 0.08); }
.class-title-line__name { font-size: 11px; color: var(--text-soft); }
.class-title-line__lore { font-size: 9px; line-height: 1.45; color: var(--text-faint); }
.class-option__actions { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.class-option.is-selected { background: linear-gradient(180deg, rgba(198, 161, 91, 0.08), transparent); }
.class-option.is-selected .class-option__name { color: var(--gold-light); }
.class-option.is-used { opacity: 0.4; }
.class-picker__error { min-height: 13px; font-size: 9px; color: var(--rose); }
.class-picker__foot { display: flex; justify-content: flex-end; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line-soft); }

/* --------------------------------------------------------- 21. Редактор титулов --- */
.title-editor { display: flex; flex-direction: column; gap: 10px; }
.title-editor__list { display: flex; flex-direction: column; gap: 8px; max-height: 52vh; overflow-y: auto; padding-right: 4px; }
.title-edit { padding: 8px 0 10px; border-bottom: 1px solid var(--line-soft); }
.title-edit__head { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.title-edit__level { width: 20px; height: 20px; display: grid; place-items: center; font-family: var(--serif); font-size: 10px; color: var(--gold); border: 1px solid var(--line); border-radius: 50%; }
.title-edit__standard { font-size: 8px; color: var(--text-faint); }
.title-edit .input { font-size: 11px; }
.title-edit .textarea { min-height: 44px; font-size: 10px; }

/* --------------------------------------------------------- 22. FAQ --- */
.faq { display: flex; flex-direction: column; gap: 4px; }
.faq__intro { padding-bottom: 12px; border-bottom: 1px solid var(--line-soft); font-size: 11px; line-height: 1.65; color: var(--text-dim); }
.faq__intro b { color: var(--gold-light); font-weight: 500; }
.faq__item { border-bottom: 1px solid var(--line-soft); }
.faq__q { display: flex; align-items: center; gap: 10px; padding: 11px 0; font-family: var(--serif); font-size: 15px; color: var(--text-soft); cursor: pointer; list-style: none; }
.faq__q::-webkit-details-marker { display: none; }
.faq__q::after { content: '+'; margin-left: auto; color: var(--gold); font-family: var(--font); font-size: 14px; }
.faq__item[open] .faq__q { color: var(--gold-light); }
.faq__item[open] .faq__q::after { content: '−'; }
.faq__a { padding: 0 0 12px 0; font-size: 10px; line-height: 1.65; color: var(--text-dim); }
.faq__a p + p { margin-top: 7px; }
.faq__a b { color: var(--text-soft); font-weight: 500; }

/* --------------------------------------------------------- 23. Выбор иконки --- */
.icon-picker { display: flex; flex-direction: column; gap: 8px; }
.icon-picker__bar { display: flex; align-items: center; gap: 8px; }
.icon-picker__search { flex: 1 1 auto; }
.icon-picker__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 4px; max-height: 180px; padding: 6px; overflow-y: auto; border: 1px solid var(--line-soft); }
.icon-option { display: grid; place-items: center; aspect-ratio: 1; color: var(--text-dim); background: transparent; border: 1px solid transparent; border-radius: var(--r-sm); cursor: pointer; }
.icon-option svg { width: 16px; height: 16px; }

  /** Иконка по id; неизвестный id даёт иконку по умолчанию. */
  function get(id) {
    return BY_ID[id] || BY_ID[DEFAULT_ID] || LIST[0] || null;
  }

  /** Поиск по id и русской подписи. */
  function search(query) {

<script data-source="js/titles.js">
/* ============================================================================
   Still Standing — титулы (п. 5.2 ТЗ, мифология Китая)
   15 титулов, жёстко привязанных к уровням. Уровень 0 — «нулевой» титул,
   он не входит в набор 15 и показывается, пока игрок не заработал 10 баллов.

   Файл написан по UMD-шаблону: работает и как обычный <script> в браузере
   (window.SteelTitles), и через require() в тестах Node без сборки.
   ============================================================================ */
(function (root, factory) {
  var api = factory();
  root.SteelTitles = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  /* Максимальный уровень системы титулов */
  var MAX_LEVEL = 15;

  /* Титул игрока, который ещё не заработал ни одного балла */
  var ZERO_TITLE = {
    level: 0,
    name: 'Безымянный',
    lore: 'Титул ещё не обретён. Первая искра — всего в десяти баллах.'
  };

  /* Полный список 15 титулов по возрастанию силы:
     духи природы → стражи и мастера → великие боги и император. */
  var LIST = [
    { level: 1, name: 'Мерцающий огонёк', lore: 'Первая искра силы. Ещё не пламя, но уже не тьма.' },
    { level: 2, name: 'Дух Весеннего Ростка', lore: 'Трава пробивает камень — так начинается путь.' },
    { level: 3, name: 'Хранитель Бамбуковой Рощи', lore: 'Гибкий не ломается там, где ломается твёрдый.' },
    { level: 4, name: 'Лунный Алхимик', lore: 'Смешивает терпение и дисциплину в свете луны.' },
    { level: 5, name: 'Хули-цзин', lore: 'Лиса-оборотень: девять хвостов, сто уловок, одна цель.' },
    { level: 6, name: 'Страж Нефритовых Врат', lore: 'Стоит на границе смертного и небесного и не отступает.' },
    { level: 7, name: 'Укротитель Облаков', lore: 'Облака слушаются того, кто не суетится.' },
    { level: 8, name: 'Хранитель Котла Бессмертия', lore: 'Варит время — и получается привычка.' },
    { level: 9, name: 'Повелитель Грома Лэй-гун', lore: 'Гром — это вовремя сказанное «нет» собственной лени.' },
    { level: 10, name: 'Владыка Драконьих Глубин', lore: 'Глубина — не тьма, а сила, рождённая давлением.' },
    { level: 11, name: 'Матерь Западных Вершин Си-ван-му', lore: 'Дарует персик бессмертия за верность пути.' },
    { level: 12, name: 'Писец Книги Судеб', lore: 'Вписывает в книгу только сделанное, не обещанное.' },
    { level: 13, name: 'Небесный Мандарин Первого Ранга', lore: 'Порядок в делах — порядок на небесах.' },
    { level: 14, name: 'Хранитель Престола Девяти Небес', lore: 'Держит небо ровно, чтобы ты держал слово.' },
    { level: 15, name: 'Император Небесной Столицы', lore: 'Вершина. Дальше — только собственная легенда.' }
  ];

  /* Быстрый доступ по уровню */
  var BY_LEVEL = {};
  LIST.forEach(function (item) { BY_LEVEL[item.level] = item; });

  /** Титул для конкретного уровня (0 → «Безымянный», >15 → последний). */
  function titleAt(level) {
    var lv = Math.max(0, Math.floor(Number(level) || 0));
    if (lv === 0) return ZERO_TITLE;
    if (lv > MAX_LEVEL) lv = MAX_LEVEL;
    return BY_LEVEL[lv];
  }

  /** Титул, который действует сейчас. */
  function currentTitle(level) {
    return titleAt(level);
  }

  /**
   * Следующий титул, к которому идёт игрок.
   * Возвращает null, если достигнут максимальный титул.
   */
  function nextTitle(level) {
    var lv = Math.max(0, Math.floor(Number(level) || 0));
    if (lv >= MAX_LEVEL) return null;
    return BY_LEVEL[lv + 1];
  }

  /** Список титулов с отметками «получен» / «текущий» — для панели титулов. */
  function buildPanel(level) {
    var lv = Math.max(0, Math.floor(Number(level) || 0));
    return LIST.map(function (item) {
      return {
        level: item.level,
        name: item.name,
        lore: item.lore,
        earned: lv >= item.level,
        current: lv === item.level
      };
    });
  }

  return {
    MAX_LEVEL: MAX_LEVEL,
    ZERO_TITLE: ZERO_TITLE,
    LIST: LIST,
    titleAt: titleAt,
    currentTitle: currentTitle,
    nextTitle: nextTitle,
    buildPanel: buildPanel
  };
});

/* ============================================================================

    { name: 'Баст — Защитница сына солнца', lore: 'Тепло, которое умеет защищать.' },
    { name: 'Вознёсшийся до бога. Великий кошачий покровитель', lore: 'Вознёсся до бога — и всё ещё тот, кто начинает с малого.' }
  ]);

  const KITAI_TITLES = Object.freeze(Titles.LIST.map(function (item) {
    return { name: item.name, lore: item.lore };

  /** Шаблон класса по id; неизвестный id — «Своё». */

  function defaultTitles(id) {

        name: 'Титул ' + i,
        lore: 'Ваш титул. Нажмите на карандаш, чтобы дать ему имя и описание.'

  }

  function className(id, customName) {
    const cls = get(id);
    if (cls.id === 'custom') return String(customName || '').trim() || 'Своё';
    return cls.name;
  }

  return {
    BASE_TITLE: BASE_TITLE,
    CLASSES: CLASSES,
    get: get,
    defaultTitles: defaultTitles,
    customTitles: customTitles,
    className: className
  };
});
