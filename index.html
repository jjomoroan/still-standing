  const Titles = isNode ? require('./titles.js') : root.SteelTitles;
  const ClassBook = isNode ? require('./classes.js') : root.SteelClasses;

  /* ------------------------------------------------------------ Константы --- */

  /** Версия схемы. 7 — выполненные подходы, разовые задачи, время, зум. */
  const SCHEMA_VERSION = 7;
  const APP_ID = 'steel-standing';
  const APP_NAME = 'Still Standing';

  /** Час ежедневного сброса по локальному времени игрока. */
  const RESET_HOUR_LOCAL = 4;
  const DAY_MS = 24 * 60 * 60 * 1000;

  const MAX_LEVEL = 15;
  const NAME_MAX_LENGTH = 16;
  const TITLE_MAX_LENGTH = 60;
  const DESC_MAX_LENGTH = 200;
  const TASK_TITLE_MAX_LENGTH = 80;
  const TASK_DESC_MAX_LENGTH = 3000;
  const ITEM_DESC_MAX_LENGTH = 54;
  const NOTE_TITLE_MAX_LENGTH = 32;
  const NOTE_TEXT_MAX_LENGTH = 3000;
  const NOTES_LIMIT = 60;
  const QUOTE_MAX_LENGTH = 56;
  const FOCUS_MAX_MINUTES = 60;
  const REST_MAX_MINUTES = 90;
  const FOCUS_LOG_LIMIT = 100;
  const CLASS_NAME_MAX_LENGTH = 40;
  const POINTS_MAX = 999999;
  const COUNT_MAX = 999;
  const TASK_MINUTES_MIN = 5;
  const TASK_MINUTES_MAX = 120;
  const ZOOM_LEVELS = Object.freeze([50, 75, 100, 125, 150]);
  const ARCHIVE_DAYS = 31;

  /** Классы: 1 основная ветка + до 3 подклассов. */
  const CLASS_LIMIT = 4;
  const SUBCLASS_AT_BRANCH_LEVEL = 5;

  /** Диапазон баллов за подход зависит от запланированного числа подходов. */
  function taskPointsRange(planned) {
    const count = clampInt(planned, 1, COUNT_MAX, 1);
    if (count === 1) return { min: 2, max: 50 };
    if (count <= 3) return { min: 2, max: 20 };
    return { min: 2, max: 15 };
  }

  function normalizeTaskMinutes(raw) {
    if (raw == null || raw === '') return 0;
    const value = Math.floor(Number(raw));
    if (!Number.isFinite(value) || value <= 0) return 0;
    return clampInt(value, TASK_MINUTES_MIN, TASK_MINUTES_MAX, 0);
  }

  function normalizeZoom(raw) {
    const value = Math.floor(Number(raw));
    if (!Number.isFinite(value)) return 100;
    let best = ZOOM_LEVELS[0];
    let distance = Math.abs(value - best);
    ZOOM_LEVELS.forEach(function (level) {
      const d = Math.abs(value - level);
      if (d < distance) { best = level; distance = d; }
    });
    return best;
  }

  /** Фразы-заготовки для награды. */
  const SHOP_IDEAS = Object.freeze([
    'Выпить кофе без чувства вины',
    'Сон на 2 часа дольше',
    'Вечер без телефона',
    'Любимый фильм целиком',
    'Пицца без подсчёта калорий',
    'Прогулка без наушников',
    'Новая книга в бумаге',
    'День без будильника',
    'Ванна с пеной и тишиной',
    'Заказать еду вместо готовки',
    'Час на любимое хобби',
    'Плед, какао и сериал',
    'Массаж или самомассаж',
    'Настолка с друзьями',
    'Новая мелочь для стола',
    'Утро без спешки',
    'Ленивое воскресенье',
    'Сходить в кино',
    'Купить цветы себе',
    'Съесть десерт первым',
    'Полежать в тишине 20 минут',
    'Поездка за город',
    'Ничего не делать час',
    'Обнять кота дольше обычного'
  ]);

  /** Вкладки приложения. «SS» — главная и закреплённая. */
  const APP_TABS = Object.freeze([
    { id: 'ss', label: 'SS', icon: 'shield', pinned: true, title: 'Главная: задачи, магазин, инвентарь и классы' },
    { id: 'focus', label: 'Фокусировка', icon: 'timer', title: 'Да-да, это фокусировка' },
    { id: 'notes', label: 'Заметки', icon: 'notebook-pen', title: 'Мысли, которые жалко потерять' },
    { id: 'archive', label: 'Архив', icon: 'calendar-check', title: 'Тут лежат итоги стараний' },
    { id: 'achievements', label: 'Ачивки', icon: 'trophy', title: 'Награды, которые уже случились' }
  ]);
  const APP_TAB_IDS = Object.freeze(APP_TABS.map(function (tab) { return tab.id; }));
  const OPENABLE_TAB_IDS = Object.freeze(APP_TAB_IDS.filter(function (id) { return id !== 'ss'; }));
  const APP_TAB_LABELS = {};
  APP_TABS.forEach(function (tab) { APP_TAB_LABELS[tab.id] = tab.label; });

  /* ------------------------------------------------------- Вспомогательные --- */

  function clampInt(value, min, max, fallback) {
    const num = Math.floor(Number(value));
    if (!Number.isFinite(num)) return fallback;
    return Math.min(max, Math.max(min, num));
  }

  function cleanText(value, maxLength) {
    return String(value == null ? '' : value)
      .replace(/\s+/g, ' ')
      .trim()
      .slice(0, maxLength);
  }

  function cleanMultiline(value, maxLength) {
    return String(value == null ? '' : value)
      .replace(/\r\n?/g, '\n')
      .split('\n')
      .map(function (line) { return line.replace(/[ \t]+$/g, ''); })
      .join('\n')
      .replace(/\n{3,}/g, '\n\n')
      .trim()
      .slice(0, maxLength);
  }

  /** Имя может быть пустым: до первого ввода показываем заглушку. */
  function sanitizeName(value) {
    return cleanText(value, NAME_MAX_LENGTH);
  }

  function displayName(value) {
    return sanitizeName(value) || 'Назови свое имя';
  }

  function plural(count, one, few, many) {
    const n = Math.abs(Math.floor(Number(count) || 0)) % 100;
    const n10 = n % 10;
    if (n > 10 && n < 20) return many;
    if (n10 === 1) return one;
    if (n10 >= 2 && n10 <= 4) return few;
    return many;
  }

  function pointsWord(count) {
    return plural(count, 'балл', 'балла', 'баллов');
  }

  function createId(prefix) {
    const stamp = Date.now().toString(36);
    const rnd = Math.random().toString(36).slice(2, 8);
    return prefix + '_' + stamp + rnd;
  }

  /* ------------------------------------------------------------ Уровни --- */

  /**
   * Общий уровень 1…15. Старт — 1 уровень/0 XP; 2 уровень на 10 XP,
   * 3 на 30, 4 на 60, … 15 на 1050. Кривая: 5·(n−1)·n.
   */
  function xpForLevel(level) {
    const n = clampInt(level, 1, MAX_LEVEL, 1);
    return 5 * (n - 1) * n;
  }

  function levelFromXp(xp) {
    const value = Math.max(0, Math.floor(Number(xp) || 0));
    let level = 1;
    while (level < MAX_LEVEL && xpForLevel(level + 1) <= value) level += 1;
    return level;
  }

  function levelBar(xp, level) {
    const value = Math.max(0, Math.floor(Number(xp) || 0));
    const current = clampInt(level, 1, MAX_LEVEL, 1);
    const start = xpForLevel(current);
    if (current >= MAX_LEVEL) {
      return {
        level: current, xp: value, levelStart: start, nextLevelAt: null,
        toNextLevel: 0, step: 0, gained: 0, pct: 100
      };
    }
    const next = xpForLevel(current + 1);
    const span = next - start;
    const gained = Math.min(span, Math.max(0, value - start));
    return {
      level: current,
      xp: value,
      levelStart: start,
      nextLevelAt: next,
      toNextLevel: Math.max(0, next - value),
      step: span,
      gained: gained,
      pct: span > 0 ? Math.round((gained / span) * 100) : 0
    };
  }

  function levelProgress(xp, levelFloor) {
    const byXp = levelFromXp(xp);
    const floor = clampInt(levelFloor, 1, MAX_LEVEL, 1);
    return levelBar(xp, Math.max(byXp, floor));
  }

  function levelStatus(state) {
    const source = state || {};
    const current = clampInt(source.levelFloor, 1, MAX_LEVEL, 1);
    const target = levelFromXp(source.xp);
    const skipped = clampInt(source.levelPromptSkipped, 0, MAX_LEVEL, 0);
    const pending = target > current;
    const deferred = pending && skipped === target;
    return {
      current: current,
      target: target,
      pending: pending,
      deferred: deferred,
      prompt: pending && !deferred
    };
  }

  function confirmLevelUp(state) {
    const status = levelStatus(state);
    if (!status.pending) {
      return { ok: false, reason: 'nothing-pending', level: status.current, state: state };
    }
    return {
      ok: true, reason: null, level: status.target, previousLevel: status.current,
      state: Object.assign({}, state, { levelFloor: status.target, levelPromptSkipped: 0 })
    };
  }

  function deferLevelUp(state) {
    const status = levelStatus(state);
    if (!status.pending) {
      return { ok: false, reason: 'nothing-pending', level: status.current, state: state };
    }
    return {
      ok: true, reason: null, level: status.target,
      state: Object.assign({}, state, { levelPromptSkipped: status.target })
    };
  }

  function keepLevelPrompt(state) {
    const status = levelStatus(state);
    const next = status.deferred ? status.target : 0;
    const before = clampInt(state.levelPromptSkipped, 0, MAX_LEVEL, 0);
    if (next === before) return state;
    return Object.assign({}, state, { levelPromptSkipped: next });
  }

  /* ------------------------------------- Ежедневный сброс 04:00 по локали --- */

  function localBoundary(ms) {
    const date = new Date(ms);
    return new Date(date.getFullYear(), date.getMonth(), date.getDate(), RESET_HOUR_LOCAL, 0, 0, 0).getTime();
  }

  function shiftBoundary(boundaryMs, delta) {
    const date = new Date(boundaryMs);
    date.setDate(date.getDate() + delta);
    date.setHours(RESET_HOUR_LOCAL, 0, 0, 0);
    return date.getTime();
  }

  function todayResetBoundary(nowMs) {
    return localBoundary(Number.isFinite(Number(nowMs)) ? Number(nowMs) : Date.now());
  }

  function lastResetBoundary(nowMs) {
    const now = Number.isFinite(Number(nowMs)) ? Number(nowMs) : Date.now();
    const today = localBoundary(now);
    return now >= today ? today : shiftBoundary(today, -1);
  }

  function needsDailyReset(lastResetAt, nowMs) {
    const last = Number(lastResetAt);
    if (!Number.isFinite(last)) return true;
    return lastResetBoundary(nowMs) > last;
  }

  function missedResets(lastResetAt, nowMs) {
    const last = Number(lastResetAt);
    if (!Number.isFinite(last)) return 1;
    const boundary = lastResetBoundary(nowMs);
    const diff = boundary - last;
    if (diff <= 0) return 0;
    return Math.max(1, Math.round(diff / DAY_MS));
  }

  /* ---------------------------------------------------------- Иконки --- */

  const DEFAULT_ICON = Object.freeze({ type: 'preset', value: 'target' });

  function normalizeIcon(raw) {
    if (!raw || typeof raw !== 'object') return Object.assign({}, DEFAULT_ICON);
    if (raw.type === 'custom') {
      const value = typeof raw.value === 'string' ? raw.value : '';
      if (/^data:image\/(png|jpeg|jpg|webp|gif|svg\+xml);base64,/i.test(value)) {
        return { type: 'custom', value: value };
      }
      return Object.assign({}, DEFAULT_ICON);
    }
    const preset = typeof raw.value === 'string' ? raw.value.trim() : '';
    if (!preset) return Object.assign({}, DEFAULT_ICON);
    return { type: 'preset', value: preset };
  }

  function normalizeAvatarIcon(raw) {
    if (raw == null) return null;
    if (typeof raw === 'string') {
      const preset = raw.trim();
      return preset ? { type: 'preset', value: preset } : null;
    }
    if (typeof raw !== 'object') return null;
    if (raw.type === 'custom') {
      const value = typeof raw.value === 'string' ? raw.value : '';
      return /^data:image\/(png|jpeg|jpg|webp|gif|svg\+xml);base64,/i.test(value)
        ? { type: 'custom', value: value }
        : null;
    }
    const preset = typeof raw.value === 'string' ? raw.value.trim() : '';
    return preset ? { type: 'preset', value: preset } : null;
  }

  /* --------------------------------------------------- Классы и титулы --- */

  const CLASS_IDS = Object.freeze(ClassBook.CLASSES.map(function (item) { return item.id; }));

  function normalizeClassKind(raw) {
    const id = typeof raw === 'string' ? raw.trim().toLowerCase() : '';
    if (id === 'china' || id === 'kitai') return 'kitai';
    if (id === 'career' || id === 'careerist') return 'careerist';
    if (id === 'cat' || id === 'kotik') return 'kotik';
    if (id === 'custom' || id === 'own') return 'custom';
    return 'custom';
  }

  function classTemplate(kind) {
    return ClassBook.get(normalizeClassKind(kind));
  }

  /** Уровень класса 1…15. 1 уровень = 0 баллов, 2 = 10, 3 = 30… */
  function classXpForLevel(level) {
    const n = clampInt(level, 1, MAX_LEVEL, 1);
    return 5 * (n - 1) * n;
  }

  function classLevel(points) {
    const value = Math.max(0, Math.floor(Number(points) || 0));
    let level = 1;
    while (level < MAX_LEVEL && classXpForLevel(level + 1) <= value) level += 1;
    return level;
  }

  function classProgress(points) {
    const value = Math.max(0, Math.floor(Number(points) || 0));
    const level = classLevel(value);
    const start = classXpForLevel(level);
    const next = level >= MAX_LEVEL ? null : classXpForLevel(level + 1);
    const span = next === null ? 0 : next - start;
    return {
      level: level,
      start: start,
      nextLevelAt: next,
      toNextLevel: next === null ? 0 : Math.max(0, next - value),
      step: span,
      pct: next === null ? 100 : (span > 0 ? Math.round(((value - start) / span) * 100) : 0)
    };
  }

  function normalizeTitleList(kind, raw) {
    const fallback = kind === 'custom' ? ClassBook.customTitles() : ClassBook.defaultTitles(kind);
    const source = Array.isArray(raw) ? raw : [];
    const result = [];
    for (let i = 0; i < 15; i += 1) {
      const entry = source[i] && typeof source[i] === 'object' ? source[i] : {};
      const hasName = Object.prototype.hasOwnProperty.call(entry, 'name');
      const hasLore = Object.prototype.hasOwnProperty.call(entry, 'lore');
      let name = hasName ? cleanText(entry.name, TITLE_MAX_LENGTH) : fallback[i].name;
      if (!name) name = fallback[i].name;
      const lore = hasLore ? cleanText(entry.lore, DESC_MAX_LENGTH) : fallback[i].lore;
      result.push({ name: name, lore: lore });
    }
    return result;
  }

  function normalizeClassRecord(raw) {
    if (!raw || typeof raw !== 'object') return null;
    const kind = normalizeClassKind(raw.kind != null ? raw.kind : raw.id);
    const template = classTemplate(kind);
    const id = (typeof raw.id === 'string' && raw.id)
      ? raw.id
      : (kind === 'custom' ? createId('class') : kind);
    const name = kind === 'custom'
      ? (cleanText(raw.name, CLASS_NAME_MAX_LENGTH) || template.name)
      : template.name;
    return {
      id: id,
      kind: kind,
      name: name,
      points: clampInt(raw.points, 0, Number.MAX_SAFE_INTEGER, 0),
      titles: normalizeTitleList(kind, raw.titles)
    };
  }

  /**
   * Состояние классов.
   * Канон: { list: [record], mainId, activeId }.
   * Старые сохранения с branches / active / points / sub читаются и переносятся.
   */
  function normalizeClasses(raw) {
    const source = (raw && typeof raw === 'object' && !Array.isArray(raw)) ? raw : {};
    const list = [];
    const seenPreset = new Set();

    const pushRecord = function (record) {
      if (!record) return;
      if (record.kind !== 'custom') {
        if (seenPreset.has(record.kind)) return;
        seenPreset.add(record.kind);
        record.id = record.kind;
      }
      if (list.length >= CLASS_LIMIT) return;
      list.push(record);
    };

    if (Array.isArray(source.list)) {
      source.list.forEach(function (entry) { pushRecord(normalizeClassRecord(entry)); });
    } else if (Array.isArray(source.branches)) {
      source.branches.forEach(function (entry) { pushRecord(normalizeClassRecord(entry)); });
    } else {
      /* Старый формат: { active, points: {…}, customName } или branches из схемы 5 */
      const legacyBranches = source.branches && typeof source.branches === 'object' ? source.branches : source;
      const points = (legacyBranches.points && typeof legacyBranches.points === 'object') ? legacyBranches.points : {};
      const activeRaw = legacyBranches.active || legacyBranches.main || '';
      const activeKind = typeof activeRaw === 'string' && activeRaw ? normalizeClassKind(activeRaw) : '';
      CLASS_IDS.forEach(function (kind) {
        if (kind === 'custom') return;
        const value = clampInt(points[kind], 0, Number.MAX_SAFE_INTEGER, 0);
        if (value > 0 || kind === activeKind) {
          pushRecord(normalizeClassRecord({ id: kind, kind: kind, points: value }));
        }
      });
      const customValue = clampInt(points.custom, 0, Number.MAX_SAFE_INTEGER, 0);
      if (customValue > 0 || activeKind === 'custom') {
        pushRecord(normalizeClassRecord({
          id: 'custom', kind: 'custom',
          name: legacyBranches.customName || 'Своё',
          points: customValue
        }));
      }
    }

    let mainId = '';
    let activeId = '';
    const mainRaw = source.mainId != null ? source.mainId : (source.main != null ? source.main : source.active);
    const activeRaw = source.activeId != null ? source.activeId : (source.active != null ? source.active : source.mainId);
    const findId = function (id) {
      if (typeof id !== 'string' || !id) return '';
      const direct = list.find(function (entry) { return entry.id === id; });
      if (direct) return direct.id;
      const kind = normalizeClassKind(id);
      const byKind = list.find(function (entry) { return entry.kind === kind; });
      return byKind ? byKind.id : '';
    };
    mainId = findId(mainRaw);
    activeId = findId(activeRaw);
    if (!mainId && list.length) mainId = list[0].id;
    if (!activeId || !list.some(function (entry) { return entry.id === activeId; })) activeId = mainId;
    if (mainId) {
      const mainRecord = list.find(function (entry) { return entry.id === mainId; });
      if (mainRecord) mainRecord.id = mainRecord.id;
    }
    return { list: list, mainId: mainId, activeId: activeId };
  }

  function classById(classes, id) {
    const source = normalizeClasses(classes);
    return source.list.find(function (entry) { return entry.id === id; }) || null;
  }

  function mainClass(classes) {
    const source = normalizeClasses(classes);
    return source.list.find(function (entry) { return entry.id === source.mainId; }) || null;
  }

  function activeClass(classes) {
    const source = normalizeClasses(classes);
    return source.list.find(function (entry) { return entry.id === source.activeId; }) || null;
  }

  function canChooseClass(state) {
    return !normalizeClasses(state && state.classes).mainId && levelStatus(state).current >= 2;
  }

  function canAddSubclass(state) {
    const source = normalizeClasses(state && state.classes);
    const active = source.list.find(function (entry) { return entry.id === source.activeId; });
    return Boolean(active && source.list.length < CLASS_LIMIT &&
      classLevel(active.points) >= SUBCLASS_AT_BRANCH_LEVEL);
  }

  function chooseMainClass(state, kind, customName) {
    const source = normalizeClasses(state.classes);
    if (levelStatus(state).current < 2) return { ok: false, reason: 'locked', state: state };
    if (source.mainId) return { ok: false, reason: 'already', state: state };
    const record = normalizeClassRecord({
      kind: normalizeClassKind(kind),
      name: kind === 'custom' ? customName : '',
      points: 0
    });
    if (record.kind === 'custom' && !cleanText(customName, CLASS_NAME_MAX_LENGTH)) {
      return { ok: false, reason: 'name-required', state: state };
    }
    if (record.kind !== 'custom') record.id = record.kind;
    return {
      ok: true, reason: null, class: record,
      state: Object.assign({}, state, {
        classes: { list: [record], mainId: record.id, activeId: record.id }
      })
    };
  }

  function addSubclass(state, kind, customName) {
    const source = normalizeClasses(state.classes);
    if (!source.mainId) return { ok: false, reason: 'no-main', state: state };
    if (source.list.length >= CLASS_LIMIT) return { ok: false, reason: 'limit', state: state };
    const active = source.list.find(function (entry) { return entry.id === source.activeId; });
    if (!active || classLevel(active.points) < SUBCLASS_AT_BRANCH_LEVEL) {
      return { ok: false, reason: 'locked', state: state };
    }
    const classKind = normalizeClassKind(kind);
    if (classKind !== 'custom' && source.list.some(function (entry) { return entry.kind === classKind; })) {
      return { ok: false, reason: 'already', state: state };
    }
    if (classKind === 'custom' && !cleanText(customName, CLASS_NAME_MAX_LENGTH)) {
      return { ok: false, reason: 'name-required', state: state };
    }
    const record = normalizeClassRecord({ kind: classKind, name: customName, points: 0 });
    if (classKind !== 'custom') record.id = record.kind;
    return {
      ok: true, reason: null, class: record,
      state: Object.assign({}, state, {
        classes: {
          list: source.list.concat([record]),
          mainId: source.mainId,
          activeId: record.id
        }
      })
    };
  }

  function setActiveClass(state, id) {
    const source = normalizeClasses(state.classes);
    const record = source.list.find(function (entry) { return entry.id === id; });
    if (!record) return { ok: false, reason: 'not-found', state: state };
    if (source.activeId === id) return { ok: true, reason: null, changed: false, state: state };
    return {
      ok: true, reason: null, changed: true,
      state: Object.assign({}, state, {
        classes: Object.assign({}, source, { activeId: id })
      })
    };
  }

  function updateClass(state, id, patch) {
    const source = normalizeClasses(state.classes);
    const current = source.list.find(function (entry) { return entry.id === id; });
    if (!current) return { ok: false, reason: 'not-found', state: state };
    const input = patch || {};
    let name = current.name;
    if (current.kind === 'custom' && 'name' in input) {
      name = cleanText(input.name, CLASS_NAME_MAX_LENGTH) || 'Своё';
    }
    const titles = 'titles' in input ? normalizeTitleList(current.kind, input.titles) : current.titles;
    const next = Object.assign({}, current, { name: name, titles: titles });
    if (JSON.stringify(next) === JSON.stringify(current)) {
      return { ok: true, reason: null, changed: false, state: state };
    }
    return {
      ok: true, reason: null, changed: true,
      state: Object.assign({}, state, {
        classes: Object.assign({}, source, {
          list: source.list.map(function (entry) { return entry.id === id ? next : entry; })
        })
      })
    };
  }

  function removeClass(state, id) {
    const source = normalizeClasses(state.classes);
    if (id === source.mainId) return { ok: false, reason: 'main-protected', state: state };
    const exists = source.list.some(function (entry) { return entry.id === id; });
    if (!exists) return { ok: false, reason: 'not-found', state: state };
    const list = source.list.filter(function (entry) { return entry.id !== id; });
    return {
      ok: true, reason: null,
      state: Object.assign({}, state, {
        classes: {
          list: list,
          mainId: source.mainId,
          activeId: source.activeId === id ? source.mainId : source.activeId
        }
      })
    };
  }

  /** Классовые шаблоны для модалки выбора: used = уже есть в профиле. */
  function classTemplates(classes) {
    const source = normalizeClasses(classes);
    return ClassBook.CLASSES.map(function (template) {
      const used = source.list.some(function (entry) { return entry.kind === template.id; });
      return {
        kind: template.id,
        name: template.id === 'custom'
          ? 'Своё'
          : template.name,
        short: template.short,
        icon: template.icon,
        lore: template.lore,
        used: used,
        titles: template.id === 'custom' ? [] : ClassBook.defaultTitles(template.id)
      };
    });
  }

  /* ------------------------------------------------------- Фокус-сессии --- */

  function normalizeMinutes(raw) {
    return (Array.isArray(raw) ? raw : [])
      .map(function (value) { return clampInt(value, 1, 999, 0); })
      .filter(function (value) { return value > 0; })
      .slice(-FOCUS_LOG_LIMIT);
  }

  function normalizeFocus(raw, nowMs) {
    const source = (raw && typeof raw === 'object' && !Array.isArray(raw)) ? raw : {};
    const now = Number.isFinite(Number(nowMs)) ? Number(nowMs) : Date.now();
    const boundary = lastResetBoundary(now);
    const storedDay = Number(source.dayStart);
    const sameDay = Number.isFinite(storedDay) && storedDay === boundary;
    const focus = sameDay ? normalizeMinutes(source.focus) : [];
    const rest = sameDay ? normalizeMinutes(source.rest) : [];
    return {
      dayStart: boundary,
      focus: focus,
      rest: rest,
      touched: sameDay
        ? (Boolean(source.touched) || focus.length > 0 || rest.length > 0)
        : false,
      quote: cleanText(source.quote, QUOTE_MAX_LENGTH),
      focusMin: clampInt(source.focusMin, 1, FOCUS_MAX_MINUTES, 25),
      restMin: clampInt(source.restMin, 1, REST_MAX_MINUTES, 15),
      mode: source.mode === 'rest' ? 'rest' : 'focus'
    };
  }

  function sumMinutes(list) {
    return (Array.isArray(list) ? list : []).reduce(function (sum, value) {
      return sum + Math.max(0, Math.floor(Number(value) || 0));
    }, 0);
  }

  function markFocusStarted(state, nowMs) {
    const focus = normalizeFocus(state.focus, nowMs);
    if (focus.touched) return { ok: true, reason: null, changed: false, state: state };
    return {
      ok: true, reason: null, changed: true,
      state: Object.assign({}, state, { focus: Object.assign({}, focus, { touched: true }) })
    };
  }

  function addFocusSession(state, mode, minutes, nowMs) {
    const kind = mode === 'rest' ? 'rest' : 'focus';
    const value = clampInt(minutes, 1, 999, 0);
    if (!value) return { ok: false, reason: 'invalid', changed: false, state: state };
    const focus = normalizeFocus(state.focus, nowMs);
    const next = Object.assign({}, focus, { touched: true });
    next[kind] = focus[kind].concat([value]).slice(-FOCUS_LOG_LIMIT);
    return {
      ok: true, reason: null, changed: true,
      state: Object.assign({}, state, { focus: next })
    };
  }

  function setFocusSettings(state, settings, nowMs) {
    const source = settings || {};
    const focus = normalizeFocus(state.focus, nowMs);
    const next = Object.assign({}, focus, {
      focusMin: clampInt(source.focusMin != null ? source.focusMin : focus.focusMin,
        1, FOCUS_MAX_MINUTES, focus.focusMin),
      restMin: clampInt(source.restMin != null ? source.restMin : focus.restMin,
        1, REST_MAX_MINUTES, focus.restMin),
      mode: source.mode === 'rest' ? 'rest' : (source.mode === 'focus' ? 'focus' : focus.mode)
    });
    if (next.focusMin === focus.focusMin && next.restMin === focus.restMin && next.mode === focus.mode) {
      return { ok: true, reason: null, changed: false, state: state };
    }
    return {
      ok: true, reason: null, changed: true,
      state: Object.assign({}, state, { focus: next })
    };
  }

  function setFocusMode(state, mode, nowMs) {
    return setFocusSettings(state, { mode: mode === 'rest' ? 'rest' : 'focus' }, nowMs);
  }

  function setFocusQuote(state, quote, nowMs) {
    const focus = normalizeFocus(state.focus, nowMs);
    const next = cleanText(quote, QUOTE_MAX_LENGTH);
    if (next === focus.quote) return { ok: true, reason: null, changed: false, state: state };
    return {
      ok: true, reason: null, changed: true,
      state: Object.assign({}, state, { focus: Object.assign({}, focus, { quote: next }) })
    };
  }

  /* ------------------------------------------------------------- Задачи --- */

  function normalizeTask(raw) {
    if (!raw || typeof raw !== 'object') return null;
    const title = cleanText(raw.title, TASK_TITLE_MAX_LENGTH);
    if (!title) return null;
    const done = Boolean(raw.done);
    const count = clampInt(raw.count, 1, COUNT_MAX, 1);
    const completed = raw.completed != null
      ? clampInt(raw.completed, 0, count, 0)
      : (done ? count : 0);
    return {
      id: (typeof raw.id === 'string' && raw.id) ? raw.id : createId('task'),
      title: title,
      desc: cleanMultiline(raw.desc != null ? raw.desc : raw.description, TASK_DESC_MAX_LENGTH),
      points: clampInt(raw.points, 1, POINTS_MAX, 1),
      count: count,
      completed: completed,
      minutes: normalizeTaskMinutes(raw.minutes),
      oneTime: Boolean(raw.oneTime),
      done: done,
      awarded: clampInt(raw.awarded, 0, POINTS_MAX * COUNT_MAX, 0),
      awardedTo: typeof raw.awardedTo === 'string' ? raw.awardedTo : '',
      icon: normalizeIcon(raw.icon)
    };
  }

  function patchTask(state, id, patch) {
    return Object.assign({}, state, {
      tasks: state.tasks.map(function (task) {
        return task.id === id ? Object.assign({}, task, patch) : task;
      })
    });
  }

  function addTask(state, input) {
    const source = input || {};
    const task = normalizeTask({
      title: source.title,
      desc: source.desc,
      points: source.points,
      count: source.count != null ? source.count : 1,
      completed: source.completed != null ? source.completed : 0,
      minutes: source.minutes,
      oneTime: source.oneTime,
      icon: source.icon
    });
    if (!task) return { ok: false, reason: 'invalid', state: state };
    return {
      ok: true, reason: null, task: task,
      state: Object.assign({}, state, { tasks: state.tasks.concat([task]) })
    };
  }

  function updateTask(state, id, input) {
    const source = input || {};
    const current = state.tasks.find(function (task) { return task.id === id; });
    if (!current) return { ok: false, reason: 'not-found', state: state };
    const patch = {};
    const title = cleanText(source.title, TASK_TITLE_MAX_LENGTH);
    if (title) patch.title = title;
    if ('desc' in source) patch.desc = cleanMultiline(source.desc, TASK_DESC_MAX_LENGTH);
    if ('points' in source) patch.points = clampInt(source.points, 1, POINTS_MAX, current.points);
    if ('minutes' in source) patch.minutes = normalizeTaskMinutes(source.minutes);
    if ('oneTime' in source) patch.oneTime = Boolean(source.oneTime);
    if ('icon' in source) patch.icon = normalizeIcon(source.icon);
    return { ok: true, reason: null, state: patchTask(state, id, patch) };
  }

  function removeTask(state, id) {
    const exists = state.tasks.some(function (task) { return task.id === id; });
    if (!exists) return { ok: false, reason: 'not-found', state: state };
    return {
      ok: true, reason: null,
      state: Object.assign({}, state, {
        tasks: state.tasks.filter(function (task) { return task.id !== id; })
      })
    };
  }

  function setTaskCount(state, id, count) {
    const current = state.tasks.find(function (task) { return task.id === id; });
    if (!current) return { ok: false, reason: 'not-found', state: state };
    if (current.done) return { ok: false, reason: 'locked', state: state };
    const next = clampInt(count, 1, COUNT_MAX, current.count);
    const completed = Math.min(current.completed, next);
    return {
      ok: true, reason: null, count: next,
      state: patchTask(state, id, { count: next, completed: completed })
    };
  }

  function setTaskCompleted(state, id, completed) {
    const current = state.tasks.find(function (task) { return task.id === id; });
    if (!current) return { ok: false, reason: 'not-found', state: state };
    if (current.done) return { ok: false, reason: 'locked', state: state };
    const next = clampInt(completed, 0, current.count, current.completed);
    if (next === current.completed) return { ok: true, reason: null, changed: false, state: state };
    return {
      ok: true, reason: null, changed: true, completed: next,
      state: patchTask(state, id, { completed: next })
    };
  }

  function addClassPoints(state, classId, delta) {
    if (!classId) return state.classes;
    const classes = normalizeClasses(state.classes);
    const record = classes.list.find(function (entry) { return entry.id === classId; });
    if (!record) return classes;
    return Object.assign({}, classes, {
      list: classes.list.map(function (entry) {
        if (entry.id !== classId) return entry;
        return Object.assign({}, entry, {
          points: clampInt(entry.points + Math.floor(Number(delta) || 0),
            0, Number.MAX_SAFE_INTEGER, entry.points)
        });
      })
    });
  }

  function checkTask(state, id, nowMs) {
    const task = state.tasks.find(function (item) { return item.id === id; });
    if (!task) return { ok: false, reason: 'not-found', state: state, delta: 0 };
    if (task.done) return { ok: false, reason: 'already-done', state: state, delta: 0 };
    const completed = clampInt(task.completed, 0, task.count, 0);
    if (completed <= 0) return { ok: false, reason: 'no-completed', state: state, delta: 0 };
    const delta = task.points * completed;
    const classes = normalizeClasses(state.classes);
    const active = classes.list.find(function (entry) { return entry.id === classes.activeId; }) || null;
    const awardedTo = active ? active.id : '';

    if (task.oneTime) {
      const archived = archiveTaskNow(state, task, delta, nowMs);
      const next = Object.assign({}, state, {
        tasks: state.tasks.filter(function (item) { return item.id !== id; }),
        wallet: state.wallet + delta,
        xp: state.xp + delta,
        classes: addClassPoints(state, awardedTo, delta),
        archive: archived
      });
      return {
        ok: true, reason: null, delta: delta, awardedTo: awardedTo,
        archived: true, state: keepLevelPrompt(next)
      };
    }

    const next = Object.assign({}, patchTask(state, id, { done: true, awarded: delta, awardedTo: awardedTo }), {
      wallet: state.wallet + delta,
      xp: state.xp + delta,
      classes: addClassPoints(state, awardedTo, delta)
    });
    return { ok: true, reason: null, delta: delta, awardedTo: awardedTo, archived: false, state: keepLevelPrompt(next) };
  }

  function uncheckTask(state, id) {
    const task = state.tasks.find(function (item) { return item.id === id; });
    if (!task) return { ok: false, reason: 'not-found', state: state, delta: 0, writeOff: 0 };
    if (!task.done) return { ok: false, reason: 'not-done', state: state, delta: 0, writeOff: 0 };
    const amount = task.awarded > 0 ? task.awarded : task.points * task.completed;
    const takenFromWallet = Math.min(amount, state.wallet);
    const takenFromXp = Math.min(amount, state.xp);
    const next = Object.assign({}, patchTask(state, id, { done: false, awarded: 0, awardedTo: '' }), {
      wallet: state.wallet - takenFromWallet,
      xp: state.xp - takenFromXp,
      classes: addClassPoints(state, task.awardedTo, -amount)
    });
    return {
      ok: true, reason: null, delta: -amount,
      writeOff: amount - takenFromWallet,
      state: keepLevelPrompt(next)
    };
  }

  /* ------------------------------------------------------------- Магазин --- */

  function normalizeItem(raw) {
    if (!raw || typeof raw !== 'object') return null;
    const title = cleanText(raw.title, TASK_TITLE_MAX_LENGTH);
    if (!title) return null;
    return {
      id: (typeof raw.id === 'string' && raw.id) ? raw.id : createId('item'),
      title: title,
      desc: cleanText(raw.desc != null ? raw.desc : raw.description, ITEM_DESC_MAX_LENGTH),
      price: clampInt(raw.price != null ? raw.price : raw.points, 1, POINTS_MAX, 1),
      icon: normalizeIcon(raw.icon)
    };
  }

  function addItem(state, input) {
    const source = input || {};
    const item = normalizeItem({
      title: source.title, desc: source.desc,
      price: source.price != null ? source.price : source.points,
      icon: source.icon
    });
    if (!item) return { ok: false, reason: 'invalid', state: state };
    return {
      ok: true, reason: null, item: item,
      state: Object.assign({}, state, { shop: state.shop.concat([item]) })
    };
  }

  function updateItem(state, id, input) {
    const source = input || {};
    const current = state.shop.find(function (item) { return item.id === id; });
    if (!current) return { ok: false, reason: 'not-found', state: state };
    const patch = {};
    const title = cleanText(source.title, TASK_TITLE_MAX_LENGTH);
    if (title) patch.title = title;
    if ('desc' in source) patch.desc = cleanText(source.desc, ITEM_DESC_MAX_LENGTH);
    if ('price' in source) patch.price = clampInt(source.price, 1, POINTS_MAX, current.price);
    if ('icon' in source) patch.icon = normalizeIcon(source.icon);
    return {
      ok: true, reason: null,
      state: Object.assign({}, state, {
        shop: state.shop.map(function (item) {
          return item.id === id ? Object.assign({}, item, patch) : item;
        })
      })
    };
  }

  function removeItem(state, id) {
    const exists = state.shop.some(function (item) { return item.id === id; });
    if (!exists) return { ok: false, reason: 'not-found', state: state };
    return {
      ok: true, reason: null,
      state: Object.assign({}, state, {
        shop: state.shop.filter(function (item) { return item.id !== id; })
      })
    };
  }

  function normalizeInventoryEntry(raw) {
    if (!raw || typeof raw !== 'object') return null;
    const title = cleanText(raw.title, TASK_TITLE_MAX_LENGTH);
    if (!title) return null;
    const boughtAt = Number.isFinite(Number(raw.boughtAt)) ? Number(raw.boughtAt) : Date.now();
    const usedAt = Number.isFinite(Number(raw.usedAt)) ? Number(raw.usedAt) : 0;
    return {
      id: (typeof raw.id === 'string' && raw.id) ? raw.id : createId('stock'),
      itemId: typeof raw.itemId === 'string' ? raw.itemId : '',
      title: title,
      desc: cleanText(raw.desc != null ? raw.desc : raw.description, ITEM_DESC_MAX_LENGTH),
      price: clampInt(raw.price, 0, POINTS_MAX, 0),
      boughtAt: boughtAt,
      usedAt: usedAt,
      used: usedAt > 0,
      icon: normalizeIcon(raw.icon)
    };
  }

  function buyItem(state, id, asOfMs) {
    const item = state.shop.find(function (entry) { return entry.id === id; });
    if (!item) return { ok: false, reason: 'not-found', state: state, spent: 0, missing: 0, entry: null };
    if (state.wallet < item.price) {
      return {
        ok: false, reason: 'insufficient', state: state, spent: 0,
        missing: item.price - state.wallet, entry: null
      };
    }
    const now = Number.isFinite(Number(asOfMs)) ? Number(asOfMs) : Date.now();
    const entry = normalizeInventoryEntry({
      itemId: item.id, title: item.title, desc: item.desc,
      price: item.price, icon: item.icon, boughtAt: now
    });
    return {
      ok: true, reason: null, spent: item.price, missing: 0, entry: entry,
      state: Object.assign({}, state, {
        wallet: state.wallet - item.price,
        spentToday: clampInt((Number(state.spentToday) || 0) + item.price, 0, Number.MAX_SAFE_INTEGER, 0),
        inventory: [entry].concat(state.inventory || [])
      })
    };
  }

  function useInventoryEntry(state, id, used, asOfMs) {
    const current = (state.inventory || []).find(function (entry) { return entry.id === id; });
    if (!current) return { ok: false, reason: 'not-found', state: state };
    const flag = used !== false;
    const now = Number.isFinite(Number(asOfMs)) ? Number(asOfMs) : Date.now();
    if (current.used === flag) return { ok: true, reason: null, changed: false, state: state };
    return {
      ok: true, reason: null, changed: true,
      state: Object.assign({}, state, {
        inventory: state.inventory.map(function (entry) {
          if (entry.id !== id) return entry;
          return Object.assign({}, entry, { used: flag, usedAt: flag ? now : 0 });
        })
      })
    };
  }

  function removeInventoryEntry(state, id) {
    const exists = (state.inventory || []).some(function (entry) { return entry.id === id; });
    if (!exists) return { ok: false, reason: 'not-found', state: state };
    return {
      ok: true, reason: null,
      state: Object.assign({}, state, {
        inventory: state.inventory.filter(function (entry) { return entry.id !== id; })
      })
    };
  }

  /* ------------------------------------------------------------- Заметки --- */

  function normalizeNote(raw) {
    if (!raw || typeof raw !== 'object') return null;
    const title = cleanText(raw.title, NOTE_TITLE_MAX_LENGTH);
    const text = cleanMultiline(raw.text != null ? raw.text : raw.body, NOTE_TEXT_MAX_LENGTH);
    if (!title && !text) return null;
    const createdAt = Number.isFinite(Number(raw.createdAt)) ? Number(raw.createdAt) : Date.now();
    const updatedAt = Number.isFinite(Number(raw.updatedAt)) ? Number(raw.updatedAt) : createdAt;
    return {
      id: (typeof raw.id === 'string' && raw.id) ? raw.id : createId('note'),
      title: title || cleanText(text, NOTE_TITLE_MAX_LENGTH),
      text: text,
      createdAt: createdAt,
      updatedAt: updatedAt
    };
  }

  function addNote(state, input, asOfMs) {
    const source = input || {};
    const now = Number.isFinite(Number(asOfMs)) ? Number(asOfMs) : Date.now();
    if ((state.notes || []).length >= NOTES_LIMIT) {
      return { ok: false, reason: 'limit', state: state, note: null };
    }
    const note = normalizeNote({
      title: source.title, text: source.text,
      createdAt: now, updatedAt: now
    });
    if (!note) return { ok: false, reason: 'invalid', state: state, note: null };
    return {
      ok: true, reason: null, note: note,
      state: Object.assign({}, state, { notes: [note].concat(state.notes || []) })
    };
  }

  function updateNote(state, id, input, asOfMs) {
    const source = input || {};
    const current = (state.notes || []).find(function (note) { return note.id === id; });
    if (!current) return { ok: false, reason: 'not-found', state: state };
    const now = Number.isFinite(Number(asOfMs)) ? Number(asOfMs) : Date.now();
    const merged = normalizeNote({
      id: current.id,
      title: 'title' in source ? source.title : current.title,
      text: 'text' in source ? source.text : current.text,
      createdAt: current.createdAt,
      updatedAt: now
    });
    if (!merged) return { ok: false, reason: 'invalid', state: state };
    return {
      ok: true, reason: null,
      state: Object.assign({}, state, {
        notes: state.notes.map(function (note) { return note.id === id ? merged : note; })
      })
    };
  }

  function removeNote(state, id) {
    const exists = (state.notes || []).some(function (note) { return note.id === id; });
    if (!exists) return { ok: false, reason: 'not-found', state: state };
    return {
      ok: true, reason: null,
      state: Object.assign({}, state, {
        notes: state.notes.filter(function (note) { return note.id !== id; })
      })
    };
  }

  /* -------------------------------------------------------------- Архив --- */

  function normalizeArchiveEntry(raw) {
    if (!raw || typeof raw !== 'object') return null;
    const date = Number(raw.date);
    if (!Number.isFinite(date)) return null;
    const tasks = (Array.isArray(raw.tasks) ? raw.tasks : []).map(function (task) {
      if (!task || typeof task !== 'object') return null;
      const title = cleanText(task.title, TASK_TITLE_MAX_LENGTH);
      if (!title) return null;
      return {
        id: (typeof task.id === 'string' && task.id) ? task.id : '',
        title: title,
        points: clampInt(task.points, 0, POINTS_MAX, 0),
        count: clampInt(task.count, 0, COUNT_MAX, 0),
        minutes: normalizeTaskMinutes(task.minutes),
        oneTime: Boolean(task.oneTime),
        awarded: clampInt(task.awarded, 0, POINTS_MAX * COUNT_MAX, 0)
      };
    }).filter(Boolean);
    return {
      id: (typeof raw.id === 'string' && raw.id) ? raw.id : 'day_' + date,
      date: date,
      earned: clampInt(raw.earned, 0, Number.MAX_SAFE_INTEGER, 0),
      spent: clampInt(raw.spent, 0, Number.MAX_SAFE_INTEGER, 0),
      tasks: tasks
    };
  }

  function trimArchive(list) {
    return (Array.isArray(list) ? list : [])
      .map(normalizeArchiveEntry)
      .filter(function (entry) { return Boolean(entry && entry.tasks.length); })
      .sort(function (a, b) { return b.date - a.date; })
      .slice(0, ARCHIVE_DAYS);
  }

  function dayLabel(ms) {
    const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
      'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
    const stamp = Number.isFinite(Number(ms)) ? Number(ms) : Date.now();
    const date = new Date(stamp);
    return date.getDate() + ' ' + months[date.getMonth()];
  }

  function buildArchiveEntry(state, resetAt) {
    const stamp = Number.isFinite(Number(resetAt)) ? Number(resetAt) : Date.now();
    const done = (state.tasks || []).filter(function (task) {
      return task.done || task.awarded > 0;
    }).map(function (task) {
      return {
        id: task.id,
        title: task.title,
        points: task.points,
        count: task.completed,
        minutes: task.minutes,
        oneTime: task.oneTime,
        awarded: task.awarded > 0 ? task.awarded : task.points * task.completed
      };
    });
    const earned = done.reduce(function (sum, task) { return sum + task.awarded; }, 0);
    return normalizeArchiveEntry({
      id: 'day_' + stamp, date: stamp, earned: earned,
      spent: Number(state.spentToday) || 0, tasks: done
    });
  }

  function snapshotTask(task, awarded) {
    return {
      id: task.id,
      title: task.title,
      points: task.points,
      count: task.completed,
      minutes: task.minutes,
      oneTime: task.oneTime,
      awarded: awarded
    };
  }

  function mergeArchiveEntry(state, entry) {
    const list = (state.archive || []).slice();
    const index = list.findIndex(function (item) { return item.date === entry.date; });
    if (index === -1) return trimArchive([entry].concat(list));
    const current = normalizeArchiveEntry(list[index]);
    const tasks = (current.tasks || []).slice();
    (entry.tasks || []).forEach(function (task) {
      if (task.id && tasks.some(function (item) { return item.id === task.id; })) return;
      if (!task.id && tasks.some(function (item) { return item.title === task.title && item.awarded === task.awarded; })) return;
      tasks.push(task);
    });
    const merged = normalizeArchiveEntry(Object.assign({}, current, {
      tasks: tasks,
      earned: (current.earned || 0) + (entry.earned || 0)
    }));
    list[index] = merged;
    return trimArchive(list);
  }

  function archiveTaskNow(state, task, awarded, nowMs) {
    const now = Number.isFinite(Number(nowMs)) ? Number(nowMs) : Date.now();
    const resetAt = lastResetBoundary(now);
    const entry = normalizeArchiveEntry({
      id: 'day_' + resetAt,
      date: resetAt,
      earned: awarded,
      spent: Number(state.spentToday) || 0,
      tasks: [snapshotTask(task, awarded)]
    });
    return mergeArchiveEntry(state, entry);
  }

  function applyDailyReset(state, nowMs) {
    const now = Number.isFinite(Number(nowMs)) ? Number(nowMs) : Date.now();
    if (!needsDailyReset(state.lastResetAt, now)) {
      return { changed: false, skipped: 0, archived: null, state: state };
    }
    const skipped = missedResets(state.lastResetAt, now);
    const archived = buildArchiveEntry(state, lastResetBoundary(state.lastResetAt));
    const tasks = state.tasks.map(function (task) {
      return Object.assign({}, task, {
        done: false,
        awarded: 0,
        awardedTo: '',
        completed: task.oneTime ? Math.min(task.completed, task.count) : 0
      });
    });
    const focus = normalizeFocus(state.focus, now);
    focus.focus = [];
    focus.rest = [];
    focus.touched = false;
    focus.dayStart = lastResetBoundary(now);
    return {
      changed: true, skipped: skipped, archived: archived,
      state: Object.assign({}, state, {
        tasks: tasks,
        lastResetAt: lastResetBoundary(now),
        spentToday: 0,
        focus: focus,
        archive: archived && archived.tasks.length
          ? mergeArchiveEntry(state, archived)
          : trimArchive(state.archive)
      })
    };
  }

  /* ------------------------------------------------------- Вкладки UI --- */

  function normalizeSectionOpen(raw, fallback) {
    if (raw == null) return fallback;
    return Boolean(raw);
  }

  function normalizeUi(raw) {
    const source = (raw && typeof raw === 'object' && !Array.isArray(raw)) ? raw : {};
    const openRaw = Array.isArray(source.open) ? source.open.map(String) : [];
    const open = [];
    OPENABLE_TAB_IDS.forEach(function (id) {
      if (openRaw.indexOf(id) !== -1 && open.indexOf(id) === -1) open.push(id);
    });
    const activeRaw = typeof source.active === 'string' ? source.active : '';
    let active = APP_TAB_IDS.indexOf(activeRaw) !== -1 ? activeRaw : 'ss';
    if (active !== 'ss' && open.indexOf(active) === -1) active = 'ss';
    const sectionsRaw = (source.sections && typeof source.sections === 'object') ? source.sections : {};
    return {
      active: active,
      open: open,
      zoom: normalizeZoom(source.zoom),
      sections: {
        tasks: normalizeSectionOpen(sectionsRaw.tasks, true),
        shop: normalizeSectionOpen(sectionsRaw.shop, true),
        inventory: normalizeSectionOpen(sectionsRaw.inventory, true)
      }
    };
  }

  function appTabExists(tab) {
    return APP_TAB_IDS.indexOf(String(tab || '')) !== -1;
  }

  function openAppTab(state, tab) {
    const id = String(tab || '');
    if (!appTabExists(id)) return { ok: false, reason: 'unknown-tab', state: state };
    const ui = normalizeUi(state.ui);
    if (id !== 'ss' && ui.open.indexOf(id) === -1) ui.open.push(id);
    if (ui.active === id) return { ok: true, reason: null, changed: false, state: state };
    ui.active = id;
    return { ok: true, reason: null, changed: true, state: Object.assign({}, state, { ui: ui }) };
  }

  function activateAppTab(state, tab) {
    const id = String(tab || '');
    if (!appTabExists(id)) return { ok: false, reason: 'unknown-tab', state: state };
    const ui = normalizeUi(state.ui);
    if (id !== 'ss' && ui.open.indexOf(id) === -1) {
      return { ok: false, reason: 'closed-tab', state: state };
    }
    if (ui.active === id) return { ok: true, reason: null, changed: false, state: state };
    ui.active = id;
    return { ok: true, reason: null, changed: true, state: Object.assign({}, state, { ui: ui }) };
  }

  function closeAppTab(state, tab) {
    const id = String(tab || '');
    if (!appTabExists(id)) return { ok: false, reason: 'unknown-tab', state: state };
    if (id === 'ss') return { ok: false, reason: 'pinned', state: state };
    const ui = normalizeUi(state.ui);
    if (ui.open.indexOf(id) === -1) return { ok: false, reason: 'already-closed', state: state };
    ui.open = ui.open.filter(function (item) { return item !== id; });
    if (ui.active === id) ui.active = 'ss';
    return { ok: true, reason: null, state: Object.assign({}, state, { ui: ui }) };
  }

  function setSectionOpen(state, section, open) {
    const key = String(section || '');
    if (['tasks', 'shop', 'inventory'].indexOf(key) === -1) {
      return { ok: false, reason: 'unknown-section', state: state };
    }
    const ui = normalizeUi(state.ui);
    const next = Boolean(open);
    if (ui.sections[key] === next) return { ok: true, reason: null, changed: false, state: state };
    return {
      ok: true, reason: null, changed: true,
      state: Object.assign({}, state, {
        ui: Object.assign({}, ui, {
          sections: Object.assign({}, ui.sections, { [key]: next })
        })
      })
    };
  }

  function setUiZoom(state, zoom) {
    const ui = normalizeUi(state.ui);
    const next = normalizeZoom(zoom);
    if (ui.zoom === next) return { ok: true, reason: null, changed: false, state: state };
    return {
      ok: true, reason: null, changed: true, zoom: next,
      state: Object.assign({}, state, { ui: Object.assign({}, ui, { zoom: next }) })
    };
  }

  function buildAppTabs(ui) {
    const source = normalizeUi(ui);
    return APP_TABS.map(function (tab) {
      return {
        id: tab.id, label: tab.label, icon: tab.icon, title: tab.title,
        pinned: Boolean(tab.pinned),
        open: tab.id === 'ss' || source.open.indexOf(tab.id) !== -1,
        active: source.active === tab.id
      };
    });
  }

  /* -------------------------------------------------------- Состояние --- */

  function createDefaultState(nowMs) {
    const now = Number.isFinite(Number(nowMs)) ? Number(nowMs) : Date.now();
    return {
      schemaVersion: SCHEMA_VERSION,
      profile: { name: '', avatarIcon: null },
      wallet: 0,
      xp: 0,
      levelFloor: 1,
      levelPromptSkipped: 0,
      lastResetAt: lastResetBoundary(now),
      tasks: [],
      shop: [],
      classes: { list: [], mainId: '', activeId: '' },
      ui: normalizeUi(null),
      inventory: [],
      archive: [],
      notes: [],
      spentToday: 0,
      focus: normalizeFocus(null, now)
    };
  }

  function normalizeState(raw, nowMs) {
    const base = createDefaultState(nowMs);
    if (!raw || typeof raw !== 'object') return base;

    const state = {
      schemaVersion: SCHEMA_VERSION,
      profile: {
        name: sanitizeName(raw.profile && raw.profile.name),
        avatarIcon: normalizeAvatarIcon(raw.profile && raw.profile.avatarIcon)
      },
      wallet: clampInt(raw.wallet, 0, Number.MAX_SAFE_INTEGER, 0),
      xp: clampInt(raw.xp, 0, Number.MAX_SAFE_INTEGER, 0),
      levelFloor: 0,
      levelPromptSkipped: 0,
      lastResetAt: Number.isFinite(Number(raw.lastResetAt)) ? Number(raw.lastResetAt) : base.lastResetAt,
      tasks: [],
      shop: [],
      classes: normalizeClasses(raw.classes || raw.branches),
      ui: normalizeUi(raw.ui),
      inventory: [],
      archive: trimArchive(raw.archive),
      notes: [],
      spentToday: clampInt(raw.spentToday, 0, Number.MAX_SAFE_INTEGER, 0),
      focus: normalizeFocus(raw.focus, nowMs)
    };

    (Array.isArray(raw.tasks) ? raw.tasks : []).forEach(function (rawTask) {
      const task = normalizeTask(rawTask);
      if (task) state.tasks.push(task);
    });
    (Array.isArray(raw.shop) ? raw.shop : []).forEach(function (rawItem) {
      const item = normalizeItem(rawItem);
      if (item) state.shop.push(item);
    });
    (Array.isArray(raw.inventory) ? raw.inventory : []).forEach(function (rawEntry) {
      const entry = normalizeInventoryEntry(rawEntry);
      if (entry) state.inventory.push(entry);
    });
    (Array.isArray(raw.notes) ? raw.notes : []).slice(-NOTES_LIMIT).forEach(function (rawNote) {
      const note = normalizeNote(rawNote);
      if (note) state.notes.push(note);
    });

    /* Старые персональные титулы применяем к китайской ветке, если она есть */
    const overrides = normalizeTitleOverrides(raw.titleOverrides);
    const kitai = state.classes.list.find(function (entry) { return entry.kind === 'kitai'; });
    if (kitai && Object.keys(overrides).length) {
      const titles = kitai.titles.map(function (item, index) {
        const override = overrides[index + 1];
        if (!override) return item;
        return {
          name: override.name || item.name,
          lore: override.lore || item.lore
        };
      });
      kitai.titles = titles;
    }

    state.levelFloor = clampInt(raw.levelFloor, 1, MAX_LEVEL, 1);
    if (!Object.prototype.hasOwnProperty.call(raw, 'levelPromptSkipped')) {
      state.levelFloor = Math.max(state.levelFloor, levelFromXp(state.xp));
    }
    state.levelPromptSkipped = clampInt(raw.levelPromptSkipped, 0, MAX_LEVEL, 0);
    return keepLevelPrompt(state);
  }

  /* ------------------------------------------- Персональные титулы (legacy) --- */

  function normalizeTitleOverrides(raw) {
    const result = {};
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return result;
    Object.keys(raw).forEach(function (key) {
      const level = Number(key);
      if (!Number.isInteger(level) || level < 1 || level > Titles.MAX_LEVEL) return;
      const entry = raw[key];
      if (!entry || typeof entry !== 'object') return;
      const base = Titles.titleAt(level);
      const name = cleanText(entry.name, TITLE_MAX_LENGTH);
      const lore = cleanText(entry.lore != null ? entry.lore : entry.desc, DESC_MAX_LENGTH);
      const customName = name && name !== base.name ? name : '';
      const customLore = lore && lore !== base.lore ? lore : '';
      if (!customLore && !customName) return;
      result[level] = { name: customName, lore: customLore };
    });
    return result;
  }

  /* -------------------------------------------------------- Профиль --- */

  function renameProfile(state, name) {
    return Object.assign({}, state, {
      profile: Object.assign({}, state.profile, { name: sanitizeName(name) })
    });
  }

  function setAvatarIcon(state, icon) {
    const next = normalizeAvatarIcon(icon);
    const current = normalizeAvatarIcon(state.profile && state.profile.avatarIcon);
    if (JSON.stringify(next) === JSON.stringify(current)) {
      return { ok: true, reason: null, changed: false, state: state };
    }
    return {
      ok: true, reason: null, changed: true,
      state: Object.assign({}, state, {
        profile: Object.assign({}, state.profile, { avatarIcon: next })
      })
    };
  }

  /* ------------------------------------------------------- View model --- */

  function classView(record, classes) {
    const progress = classProgress(record.points);
    const source = normalizeClasses(classes);
    const titles = record.titles.map(function (item, index) {
      const level = index + 1;
      return {
        level: level,
        name: item.name,
        lore: item.lore,
        earned: level <= progress.level,
        current: level === progress.level
      };
    });
    return Object.assign({}, record, {
      icon: classTemplate(record.kind).icon,
      level: progress.level,
      start: progress.start,
      nextLevelAt: progress.nextLevelAt,
      toNextLevel: progress.toNextLevel,
      step: progress.step,
      pct: progress.pct,
      active: source.activeId === record.id,
      main: source.mainId === record.id,
      custom: record.kind === 'custom',
      maxLevel: MAX_LEVEL,
      currentTitle: titles[progress.level - 1],
      nextTitle: progress.level < MAX_LEVEL ? titles[progress.level] : null,
      titles: titles
    });
  }

  function buildTitleLine(state, name, active, level) {
    const namePart = name ? 'Игрок ' + name : 'Игрок';
    if (!active) {
      if (level < 2) {
        const toNext = Math.max(0, xpForLevel(2) - state.xp);
        return namePart + ', титул — ' + ClassBook.BASE_TITLE.name +
          ', до выбора ветки ' + toNext + ' ' + pointsWord(toNext);
      }
      return namePart + ', титул — ' + ClassBook.BASE_TITLE.name + ', пора выбрать ветку';
    }
    const current = active.currentTitle;
    const next = active.nextTitle;
    const base = namePart + ', титул — ' + (current ? current.name : ClassBook.BASE_TITLE.name);
    if (!next) return base + ', максимальный титул ветки';
    return base + ', до титула ' + next.name + ' ' + active.toNextLevel + ' ' +
      pointsWord(active.toNextLevel);
  }

  function buildViewModel(state, nowMs) {
    const now = Number.isFinite(Number(nowMs)) ? Number(nowMs) : Date.now();
    const status = levelStatus(state);
    const progress = levelBar(state.xp, status.current);
    const level = status.current;
    const name = sanitizeName(state.profile && state.profile.name);
    const classes = normalizeClasses(state.classes);
    const list = classes.list.map(function (record) { return classView(record, classes); });
    const active = list.find(function (item) { return item.active; }) || null;
    const main = list.find(function (item) { return item.main; }) || null;
    const canChoose = canChooseClass(state);
    const canAdd = canAddSubclass(state);
    const currentTitle = active && active.currentTitle ? active.currentTitle : ClassBook.BASE_TITLE;
    const nextTitle = active && active.nextTitle ? active.nextTitle : null;
    const titleLine = buildTitleLine(state, name, active, level);
    const toChoice = Math.max(0, xpForLevel(2) - state.xp);

    const tasks = state.tasks.map(function (task) {
      const completed = Math.max(0, Math.min(Number(task.completed) || 0, task.count));
      return Object.assign({}, task, {
        award: task.points * completed,
        approaches: task.count,
        completed: completed,
        canCheck: !task.done && completed > 0
      });
    });

    const inventory = (state.inventory || []).map(function (entry) {
      return Object.assign({}, entry, {
        usedLabel: entry.used ? 'использовано' : 'в запасе',
        dateLabel: dayLabel(entry.used && entry.usedAt ? entry.usedAt : entry.boughtAt)
      });
    });
    const stock = inventory.filter(function (entry) { return !entry.used; });
    const achievements = inventory.filter(function (entry) { return entry.used; });

    const archive = trimArchive(state.archive).map(function (entry) {
      return Object.assign({}, entry, {
        label: dayLabel(entry.date),
        taskCount: entry.tasks.length,
        tasks: entry.tasks.map(function (task) {
          return Object.assign({}, task, {
            pointsLabel: task.awarded > 0 ? task.awarded : task.points * task.count
          });
        })
      });
    });

    const notes = (state.notes || []).map(function (note) {
      return Object.assign({}, note, {
        preview: note.text.length > 260 ? note.text.slice(0, 260).trim() + '…' : note.text,
        dateLabel: dayLabel(note.updatedAt)
      });
    });

    const focus = normalizeFocus(state.focus, now);

    let addSubclassReason = '';
    if (classes.list.length >= CLASS_LIMIT) addSubclassReason = 'Уже 4 ветки — больше нельзя';
    else if (!active) addSubclassReason = 'Сначала выбери основную ветку';
    else if (active.level < SUBCLASS_AT_BRANCH_LEVEL) {
      addSubclassReason = 'Подкласс откроется на 5 уровне активной ветки';
    }

    return {
      profile: {
        name: name,
        displayName: displayName(name),
        hasName: Boolean(name),
        avatarIcon: normalizeAvatarIcon(state.profile && state.profile.avatarIcon),
        level: level,
        titleName: currentTitle.name,
        titleLore: currentTitle.lore,
        nextTitleName: nextTitle ? nextTitle.name : null,
        pointsToNextTitle: active ? active.toNextLevel : toChoice,
        baseTitle: ClassBook.BASE_TITLE.name,
        hasClass: Boolean(active),
        activeClassId: active ? active.id : '',
        activeClassName: active ? active.name : '',
        activeClassLevel: active ? active.level : 0
      },
      titleLine: titleLine,
      progress: {
        wallet: state.wallet,
        xp: state.xp,
        level: level,
        toNextLevel: progress.toNextLevel,
        levelStart: progress.levelStart,
        nextLevelAt: progress.nextLevelAt,
        step: progress.step,
        gained: progress.gained,
        pct: progress.pct,
        toMaxPct: Math.min(100, Math.max(0,
          Math.round((state.xp / Math.max(1, xpForLevel(MAX_LEVEL))) * 100)))
      },
      levelUp: {
        pending: status.pending,
        deferred: status.deferred,
        prompt: status.prompt,
        currentLevel: status.current,
        level: status.target
      },
      tasks: tasks,
      shop: state.shop.map(function (item) {
        return Object.assign({}, item, { affordable: state.wallet >= item.price });
      }),
      tabs: { active: normalizeUi(state.ui).active, list: buildAppTabs(state.ui) },
      ui: { zoom: normalizeUi(state.ui).zoom },
      sections: normalizeUi(state.ui).sections,
      inventory: inventory,
      stock: stock,
      achievements: achievements,
      archive: archive,
      notes: notes,
      classes: {
        list: list,
        mainId: classes.mainId,
        activeId: classes.activeId,
        activeName: active ? active.name : '',
        activeTitle: currentTitle.name,
        activeNextTitle: nextTitle ? nextTitle.name : null,
        activeToNext: active ? active.toNextLevel : 0,
        activePoints: active ? active.points : 0,
        activeLevel: active ? active.level : 0,
        canChoose: canChoose,
        canAddSubclass: canAdd,
        addSubclassReason: addSubclassReason,
        limit: CLASS_LIMIT,
        subclassAt: SUBCLASS_AT_BRANCH_LEVEL,
        maxLevel: MAX_LEVEL,
        templates: classTemplates(classes),
        choiceTo: toChoice
      },
      focus: {
        dayStart: focus.dayStart,
        focus: focus.focus,
        rest: focus.rest,
        touched: focus.touched,
        quote: focus.quote,
        focusMin: focus.focusMin,
        restMin: focus.restMin,
        mode: focus.mode,
        totalFocus: sumMinutes(focus.focus),
        totalRest: sumMinutes(focus.rest),
        focusSessions: focus.focus.length,
        restSessions: focus.rest.length
      },
      meta: {
        pendingReset: needsDailyReset(state.lastResetAt, now),
        lastResetAt: state.lastResetAt,
        resetHour: RESET_HOUR_LOCAL,
        taskCount: state.tasks.length,
        shopCount: state.shop.length,
        inventoryCount: inventory.length,
        unusedInventory: stock.length,
        usedInventory: achievements.length,
        archiveCount: archive.length,
        archiveDays: ARCHIVE_DAYS,
        notesCount: notes.length,
        notesLimit: NOTES_LIMIT,
        noteTitleMax: NOTE_TITLE_MAX_LENGTH,
        noteTextMax: NOTE_TEXT_MAX_LENGTH,
        spentToday: Math.max(0, Number(state.spentToday) || 0),
        classCount: list.length,
        classLimit: CLASS_LIMIT,
        classMaxLevel: MAX_LEVEL,
        subclassAt: SUBCLASS_AT_BRANCH_LEVEL,
        itemDescMax: ITEM_DESC_MAX_LENGTH,
        descMax: DESC_MAX_LENGTH,
        titleMax: TITLE_MAX_LENGTH,
        classNameMax: CLASS_NAME_MAX_LENGTH,
        quoteMax: QUOTE_MAX_LENGTH,
        focusMax: FOCUS_MAX_MINUTES,
        restMax: REST_MAX_MINUTES,
        shopIdeas: SHOP_IDEAS
      }
    };
  }

  /* ------------------------------------------------- Экспорт и импорт --- */

  function buildExportPayload(state, nowMs) {
    const now = Number.isFinite(Number(nowMs)) ? Number(nowMs) : Date.now();
    return {
      app: APP_ID,
      appName: APP_NAME,
      schemaVersion: SCHEMA_VERSION,
      exportedAt: new Date(now).toISOString(),
      state: normalizeState(state, now)
    };
  }

  function validateImportPayload(raw, nowMs) {
    const errors = [];
    const warnings = [];
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) {
      return { ok: false, errors: ['Файл пуст или не содержит JSON-объект.'], warnings: warnings, state: null };
    }
    const data = (raw.state && typeof raw.state === 'object') ? raw.state : raw;
    if (raw.app && raw.app !== APP_ID) {
      warnings.push('Файл создан другим приложением — импортируем только знакомые поля.');
    }
    if (raw.schemaVersion != null && Number(raw.schemaVersion) > SCHEMA_VERSION) {
      warnings.push('Файл создан более новой версией Still Standing: часть данных может не подхватиться.');
    }
    if (!Array.isArray(data.tasks) && !Array.isArray(data.shop)) {
      errors.push('В файле нет ни задач, ни товаров — похоже, это не резервная копия Still Standing.');
    }
    if (data.tasks != null && !Array.isArray(data.tasks)) errors.push('Поле tasks должно быть списком.');
    if (data.shop != null && !Array.isArray(data.shop)) errors.push('Поле shop должно быть списком.');
    if (errors.length) return { ok: false, errors: errors, warnings: warnings, state: null };
    return { ok: true, errors: [], warnings: warnings, state: normalizeState(data, nowMs) };
  }

  /* ---------------------------------------------------------- Экспорт --- */

  return {
    SCHEMA_VERSION: SCHEMA_VERSION,
    APP_ID: APP_ID,
    APP_NAME: APP_NAME,
    RESET_HOUR_LOCAL: RESET_HOUR_LOCAL,
    DAY_MS: DAY_MS,
    MAX_LEVEL: MAX_LEVEL,
    NAME_MAX_LENGTH: NAME_MAX_LENGTH,
    TITLE_MAX_LENGTH: TITLE_MAX_LENGTH,
    DESC_MAX_LENGTH: DESC_MAX_LENGTH,
    TASK_TITLE_MAX_LENGTH: TASK_TITLE_MAX_LENGTH,
    TASK_DESC_MAX_LENGTH: TASK_DESC_MAX_LENGTH,
    TASK_MINUTES_MIN: TASK_MINUTES_MIN,
    TASK_MINUTES_MAX: TASK_MINUTES_MAX,
    ZOOM_LEVELS: ZOOM_LEVELS,
    ITEM_DESC_MAX_LENGTH: ITEM_DESC_MAX_LENGTH,
    NOTE_TITLE_MAX_LENGTH: NOTE_TITLE_MAX_LENGTH,
    NOTE_TEXT_MAX_LENGTH: NOTE_TEXT_MAX_LENGTH,
    NOTES_LIMIT: NOTES_LIMIT,
    QUOTE_MAX_LENGTH: QUOTE_MAX_LENGTH,
    FOCUS_MAX_MINUTES: FOCUS_MAX_MINUTES,
    REST_MAX_MINUTES: REST_MAX_MINUTES,
    CLASS_NAME_MAX_LENGTH: CLASS_NAME_MAX_LENGTH,
    CLASS_LIMIT: CLASS_LIMIT,
    SUBCLASS_AT_BRANCH_LEVEL: SUBCLASS_AT_BRANCH_LEVEL,
    ARCHIVE_DAYS: ARCHIVE_DAYS,
    APP_TABS: APP_TABS,
    SHOP_IDEAS: SHOP_IDEAS,
    DEFAULT_ICON: DEFAULT_ICON,
    BASE_TITLE: ClassBook.BASE_TITLE,
    CLASSES: ClassBook.CLASSES,

    xpForLevel: xpForLevel,
    levelFromXp: levelFromXp,
    levelBar: levelBar,
    levelProgress: levelProgress,
    levelStatus: levelStatus,
    confirmLevelUp: confirmLevelUp,
    deferLevelUp: deferLevelUp,
    keepLevelPrompt: keepLevelPrompt,
    todayResetBoundary: todayResetBoundary,
    lastResetBoundary: lastResetBoundary,
    needsDailyReset: needsDailyReset,
    missedResets: missedResets,

    clampInt: clampInt,
    cleanText: cleanText,
    cleanMultiline: cleanMultiline,
    sanitizeName: sanitizeName,
    displayName: displayName,
    plural: plural,
    pointsWord: pointsWord,
    createId: createId,
    dayLabel: dayLabel,
    normalizeIcon: normalizeIcon,
    normalizeAvatarIcon: normalizeAvatarIcon,
    normalizeTitleOverrides: normalizeTitleOverrides,

    classXpForLevel: classXpForLevel,
    classLevel: classLevel,
    classProgress: classProgress,
    normalizeClasses: normalizeClasses,
    normalizeClassRecord: normalizeClassRecord,
    classById: classById,
    mainClass: mainClass,
    activeClass: activeClass,
    classTemplate: classTemplate,
    classTemplates: classTemplates,
    canChooseClass: canChooseClass,
    canAddSubclass: canAddSubclass,
    chooseMainClass: chooseMainClass,
    addSubclass: addSubclass,
    setActiveClass: setActiveClass,
    updateClass: updateClass,
    removeClass: removeClass,

    normalizeTask: normalizeTask,
    normalizeItem: normalizeItem,
    normalizeNote: normalizeNote,
    normalizeInventoryEntry: normalizeInventoryEntry,
    normalizeArchiveEntry: normalizeArchiveEntry,
    normalizeFocus: normalizeFocus,
    trimArchive: trimArchive,
    normalizeUi: normalizeUi,
    openAppTab: openAppTab,
    activateAppTab: activateAppTab,
    closeAppTab: closeAppTab,
    setSectionOpen: setSectionOpen,
    setUiZoom: setUiZoom,
    buildAppTabs: buildAppTabs,
    taskPointsRange: taskPointsRange,
    normalizeZoom: normalizeZoom,

    normalizeState: normalizeState,
    createDefaultState: createDefaultState,

    addTask: addTask,
    updateTask: updateTask,
    removeTask: removeTask,
    setTaskCount: setTaskCount,
    setTaskCompleted: setTaskCompleted,
    checkTask: checkTask,
    uncheckTask: uncheckTask,

    addItem: addItem,
    updateItem: updateItem,
    removeItem: removeItem,
    buyItem: buyItem,
    useInventoryEntry: useInventoryEntry,
